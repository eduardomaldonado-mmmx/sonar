function renderFatalErrors() {
  const cont = document.getElementById("fatal-errors-panel");
  if (!cont) return;
  const lista = scriptData.erroresFatales || [];
  cont.innerHTML = `
    <div class="sec-card expanded" style="border-color:var(--bd-cri)">
      <div class="sec-head" style="cursor:default">
        <span class="sec-num" style="background:var(--rojo)">🚫</span>
        <div class="sec-title" style="color:var(--rojo);font-weight:700">Errores Fatales</div>
        <span style="font-size:11px;color:var(--muted);font-style:italic;margin-right:8px">cualquiera ocurrido anula el puntaje a 0</span>
        <button class="icon-btn" onclick="agregarErrorFatal()">+ Agregar</button>
      </div>
      <div class="sec-body" style="display:block">
        ${lista.length === 0
          ? '<div style="color:var(--muted);font-style:italic;font-size:12px;padding:8px 0">Este script no tiene errores fatales definidos — todo se califica por puntos, sin ninguno que anule el resultado.</div>'
          : lista.map(ef => `
            <div class="fatal-item">
              <div style="flex:1">
                <input value="${escapeAttr(ef.n)}" placeholder="Nombre del error fatal" onchange="setErrorFatalCampo('${ef.id}','n',this.value)">
                <textarea placeholder="Descripción: ¿qué tiene que pasar para que cuente como este error?" onchange="setErrorFatalCampo('${ef.id}','desc',this.value)">${escapeAttr(ef.desc||"")}</textarea>
              </div>
              <button class="icon-btn danger" onclick="eliminarErrorFatal('${ef.id}')" title="Eliminar">🗑</button>
            </div>
          `).join("")
        }
      </div>
    </div>
  `;
}

function agregarErrorFatal() {
  if (!scriptData.erroresFatales) scriptData.erroresFatales = [];
  scriptData.erroresFatales.push({ id: "ef" + Date.now(), n: "Nuevo error fatal", desc: "" });
  marcarDirty();
  renderFatalErrors();
}

function eliminarErrorFatal(id) {
  if (!confirm("¿Eliminar este error fatal?")) return;
  scriptData.erroresFatales = (scriptData.erroresFatales || []).filter(ef => ef.id !== id);
  marcarDirty();
  renderFatalErrors();
}

function setErrorFatalCampo(id, campo, val) {
  const ef = (scriptData.erroresFatales || []).find(e => e.id === id);
  if (ef) ef[campo] = val;
  marcarDirty();
}

function agregarSeccion() {
  const modoPuntos = scriptData.modoPuntaje === "puntos_directos";
  const nuevaSec = {
    id: "s" + Date.now(),
    titulo: "Nueva sección",
    peso: 10,
    criterios: [{
      id: "c" + Date.now(),
      n: "Nuevo criterio",
      exc: "", ace: "", def: "", cri: "",
      ...(modoPuntos ? { puntosMax: 0 } : {})
    }]
  };
  scriptData.secciones.push(nuevaSec);
  marcarDirty();
  renderEditor();
  // Scroll a la nueva sección
  setTimeout(() => {
    const cards = document.querySelectorAll(".sec-card");
    if (cards.length) cards[cards.length-1].scrollIntoView({behavior:"smooth", block:"center"});
  }, 50);
}

function eliminarSeccion(si) {
  if (!confirm("¿Eliminar la sección \"" + scriptData.secciones[si].titulo + "\" y todos sus criterios?")) return;
  scriptData.secciones.splice(si, 1);
  marcarDirty();
  renderEditor();
}

function agregarCriterio(si) {
  const modoPuntos = scriptData.modoPuntaje === "puntos_directos";
  scriptData.secciones[si].criterios.push({
    id: "c" + Date.now(),
    n: "Nuevo criterio",
    exc: "", ace: "", def: "", cri: "",
    ...(modoPuntos ? { puntosMax: 0 } : {})
  });
  marcarDirty();
  renderEditor();
}

function eliminarCriterio(si, ci) {
  if (!confirm("¿Eliminar el criterio \"" + scriptData.secciones[si].criterios[ci].n + "\"?")) return;
  scriptData.secciones[si].criterios.splice(ci, 1);
  if (scriptData.secciones[si].criterios.length === 0) {
    if (confirm("La sección quedó vacía. ¿Eliminar también la sección?")) {
      scriptData.secciones.splice(si, 1);
    }
  }
  marcarDirty();
  renderEditor();
}

function marcarDirty() {
  dirty = true;
  const btn = document.getElementById("btn-publicar");
  if (btn) {
    btn.textContent = "✓ Publicar nueva versión (cambios sin guardar)";
  }
}

// ═════════════════════════════════════════════════════════════════════
// VALIDACIÓN
// ═════════════════════════════════════════════════════════════════════

function validar() {
  if (!scriptData) return { ok: true };
  const errores = [];
  const warnings = [];
  const modoPuntos = scriptData.modoPuntaje === "puntos_directos";

  if (modoPuntos) {
    // En modo puntos directos, lo que debe sumar 100 son los puntosMax
    // de TODOS los criterios (el peso de cada sección se deriva de ahí).
    const totalPuntos = scriptData.secciones.reduce((sum, s) =>
      sum + s.criterios.reduce((s2,c)=>s2+(parseInt(c.puntosMax)||0),0), 0);
    if (totalPuntos !== 100) {
      errores.push(`Los puntos de los criterios suman ${totalPuntos} (deben sumar 100)`);
    }
  } else {
    // Modo clásico: los pesos por sección deben sumar 100
    const totalPeso = scriptData.secciones.reduce((sum, s) => sum + (parseInt(s.peso) || 0), 0);
    if (totalPeso !== 100) {
      errores.push(`Los pesos suman ${totalPeso}% (debe ser 100%)`);
    }
  }
  // Cada sección tiene al menos 1 criterio
  scriptData.secciones.forEach((s, i) => {
    if (!s.criterios || s.criterios.length === 0) {
      errores.push(`La sección "${s.titulo}" no tiene criterios`);
    }
    if (!s.titulo.trim()) {
      errores.push(`La sección ${i+1} no tiene título`);
    }
  });
  // Cada criterio tiene nombre
  scriptData.secciones.forEach(s => {
    s.criterios.forEach((c, ci) => {
      if (!c.n.trim()) {
        errores.push(`Hay un criterio sin nombre en "${s.titulo}"`);
      }
      const nivelesVacios = ["exc","ace","def","cri"].filter(n => !c[n] || !c[n].trim()).length;
      if (nivelesVacios > 0 && c.n.trim()) {
        warnings.push(`"${c.n}" tiene ${nivelesVacios} nivel(es) sin descripción`);
      }
    });
  });
  // Errores fatales: cada uno debe tener nombre
  (scriptData.erroresFatales || []).forEach(ef => {
    if (!ef.n || !ef.n.trim()) errores.push("Hay un error fatal sin nombre");
  });
  // Total criterios
  const totalCrit = scriptData.secciones.reduce((sum, s) => sum + (s.criterios?.length || 0), 0);

  const valEl = document.getElementById("validator");
  const txtEl = document.getElementById("validator-text");
  const btnPub = document.getElementById("btn-publicar");

  if (errores.length > 0) {
    valEl.className = "validator val-err";
    valEl.querySelector(".validator-icon").textContent = "✕";
    txtEl.innerHTML = `<strong>Errores que impiden publicar:</strong> ${errores.join(" · ")}`;
    btnPub.disabled = true;
    return { ok: false, errores, warnings };
  }
  if (warnings.length > 0) {
    valEl.className = "validator val-warn";
    valEl.querySelector(".validator-icon").textContent = "⚠";
    txtEl.innerHTML = `<strong>Advertencias:</strong> ${warnings.slice(0,2).join(" · ")}${warnings.length>2?` · y ${warnings.length-2} más`:""}`;
    btnPub.disabled = false;
    return { ok: true, warnings };
  }
  valEl.className = "validator val-ok";
  valEl.querySelector(".validator-icon").textContent = "✓";
  const erroresFatalesTxt = (scriptData.erroresFatales||[]).length ? ` · ${scriptData.erroresFatales.length} errores fatales` : '';
  txtEl.innerHTML = `<strong>Validación OK</strong> · ${scriptData.secciones.length} secciones · ${modoPuntos ? '100 puntos repartidos' : 'pesos suman 100%'} · ${totalCrit} criterios${erroresFatalesTxt}`;
  btnPub.disabled = false;
  return { ok: true };
}

// ═════════════════════════════════════════════════════════════════════
// PUBLICAR / VISTA PREVIA / EXPORT / IMPORT
// ═════════════════════════════════════════════════════════════════════

function publicarVersion() {
  const val = validar();
  if (!val.ok) {
    mostrarToast("Corrige los errores antes de publicar", true);
    return;
  }
  if (val.warnings && val.warnings.length > 0) {
    if (!confirm("Hay advertencias. ¿Publicar de todas formas?")) return;
  }
  const ok = guardarVersion(scriptActual, paisActual, scriptData);
  if (ok) {
    dirty = false;
    document.getElementById("btn-publicar").textContent = "✓ Publicar nueva versión";
    mostrarToast("Versión publicada exitosamente");
    renderHistorial();
    actualizarVariantIndicator();
  }
}

function abrirVistaPrevia() {
  const subtitle = document.getElementById("preview-subtitle");
  const body = document.getElementById("preview-body");
  const sLabel = SCRIPTS_DISPONIBLES.find(s => s.id === scriptActual)?.label || scriptActual;
  const pLabel = paisActual === "BASE" ? "Script base global" : PAISES[paisActual];
  subtitle.textContent = `${sLabel} · ${pLabel} · ${scriptData.secciones.length} secciones`;
  body.innerHTML = scriptData.secciones.map((sec, si) => `
    <div class="preview-sec">
      <div class="preview-sec-head">
        <span>${si+1}. ${escapeAttr(sec.titulo)}</span>
        <span class="peso-badge">Peso: ${sec.peso}%</span>
      </div>
      <div class="preview-sec-body">
        ${sec.criterios.map(c => `
          <div class="preview-crit">
            <div class="preview-crit-name">${escapeAttr(c.n)}</div>
            <div class="preview-levels">
              <div class="preview-lvl lvl-exc"><b>Excelente:</b> ${escapeAttr(c.exc)}</div>
              <div class="preview-lvl lvl-ace"><b>Aceptable:</b> ${escapeAttr(c.ace)}</div>
              <div class="preview-lvl lvl-def"><b>Deficiente:</b> ${escapeAttr(c.def)}</div>
              <div class="preview-lvl lvl-cri"><b>Crítico:</b> ${escapeAttr(c.cri)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
  abrirModal("preview-modal");
}

function exportarJSON() {
  const sLabel = SCRIPTS_DISPONIBLES.find(s => s.id === scriptActual)?.label || scriptActual;
  const pLabel = paisActual === "BASE" ? "BASE" : paisActual;
  const data = {
    meta: {
      script_id: scriptActual,
      script_label: sLabel,
      pais: paisActual,
      exportado_por: usuarioActual.nombre,
      exportado_en: new Date().toISOString(),
      version: "SONAR Editor 1.0"
    },
    script: scriptData
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `SONAR_${scriptActual}_${pLabel}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  mostrarToast("Script exportado");
}

function importarJSON(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.script || !data.script.secciones) {
        mostrarToast("Archivo JSON inválido", true);
        return;
      }
      if (!confirm("¿Reemplazar el script actual con el contenido del archivo? (Tendrás que publicarlo para guardar)")) return;
      scriptData = data.script;
      marcarDirty();
      renderEditor();
      mostrarToast("Script importado · Revisa y publica para guardar");
    } catch(err) {
      mostrarToast("Error al leer el archivo JSON", true);
    }
  };
  reader.readAsText(file);
  document.getElementById("import-file").value = "";
}

// ═════════════════════════════════════════════════════════════════════
// HISTORIAL DE VERSIONES
// ═════════════════════════════════════════════════════════════════════

function renderHistorial() {
  const cont = document.getElementById("history-list");
  const hist = cargarHistorial(scriptActual, paisActual);
  if (!hist || hist.length === 0) {
    cont.innerHTML = '<div class="empty-history">Sin versiones publicadas todavía</div>';
    return;
  }
  cont.innerHTML = hist.map((v, i) => `
    <div class="version-item ${v.current ? 'current' : ''}">
      <div class="ver">v${v.v}${v.current ? '<span class="current-badge">ACTIVA</span>' : ''}</div>
      <div class="meta">${formatearFecha(v.fecha)}</div>
      <div class="meta meta-line">${escapeAttr(v.autor)}</div>
      ${!v.current ? `
        <div class="actions">
          <button onclick="verVersion(${v.v})">Ver</button>
          <button onclick="restaurarVersion(${v.v})">Restaurar</button>
        </div>
      ` : ""}
    </div>
  `).join("");
}

let versionParaRestaurar = null;

function verVersion(vNum) {
  const hist = cargarHistorial(scriptActual, paisActual);
  const ver = hist.find(v => v.v === vNum);
  if (!ver || !ver.script) {
    mostrarToast("No se pudo cargar la versión", true);
    return;
  }
  document.getElementById("version-modal-title").textContent = `Versión ${vNum}`;
  document.getElementById("version-modal-subtitle").textContent = `${formatearFecha(ver.fecha)} · ${ver.autor}`;
  const body = document.getElementById("version-modal-body");
  body.innerHTML = ver.script.secciones.map((sec, si) => `
    <div class="preview-sec">
      <div class="preview-sec-head">
        <span>${si+1}. ${escapeAttr(sec.titulo)}</span>
        <span class="peso-badge">Peso: ${sec.peso}%</span>
      </div>
      <div class="preview-sec-body">
        ${sec.criterios.map(c => `
          <div class="preview-crit">
            <div class="preview-crit-name">${escapeAttr(c.n)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
  versionParaRestaurar = vNum;
  abrirModal("version-modal");
}

function restaurarVersion(vNum) {
  if (!confirm(`¿Restaurar la versión ${vNum}? Se creará una nueva versión basada en esta.`)) return;
  const hist = cargarHistorial(scriptActual, paisActual);
  const ver = hist.find(v => v.v === vNum);
  if (!ver || !ver.script) {
    mostrarToast("Error al restaurar", true);
    return;
  }
  scriptData = JSON.parse(JSON.stringify(ver.script));
  marcarDirty();
  renderEditor();
  mostrarToast(`Versión ${vNum} cargada · Publica para confirmar`);
  cerrarModal("version-modal");
}

function confirmarRestaurar() {
  if (versionParaRestaurar !== null) {
    cerrarModal("version-modal");
    restaurarVersion(versionParaRestaurar);
  }
}

// ═════════════════════════════════════════════════════════════════════
// MODALES Y TOAST
// ═════════════════════════════════════════════════════════════════════

function abrirModal(id) {
  document.getElementById(id).classList.add("active");
}

function cerrarModal(id) {
  document.getElementById(id).classList.remove("active");
}

let toastTimer = null;
function mostrarToast(msg, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast active" + (isError ? " error" : "");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("active");
  }, 3500);
}

// ═════════════════════════════════════════════════════════════════════
// MODO DEMO
// ═════════════════════════════════════════════════════════════════════

function toggleDemoMode() {
  if (dirty && !confirm("Hay cambios sin publicar. ¿Cambiar de modo?")) return;
  DEMO_MODE = !DEMO_MODE;
  const toggle = document.getElementById("demo-toggle");
  const label = document.getElementById("demo-toggle-label");
  const banner = document.getElementById("demo-banner");
  if (DEMO_MODE) {
    toggle.classList.add("active");
    label.textContent = "Modo Demo";
    if (banner) banner.classList.add("active");
  } else {
    toggle.classList.remove("active");
    label.textContent = "Modo Real";
    if (banner) banner.classList.remove("active");
  }
  if (usuarioActual) {
    cargarScriptActual();
  }
}

// ═════════════════════════════════════════════════════════════════════
// INICIALIZACIÓN
// ═════════════════════════════════════════════════════════════════════

// Arrancar directo — el login ya se resolvió antes de mostrar esta vista
iniciarEditorConSesionGlobal();

// Warning antes de salir si hay cambios
window.addEventListener("beforeunload", e => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "Hay cambios sin publicar";
  }
});

/* Exponer funciones al window para onclick */
  window.abrirModal = abrirModal;
  window.abrirVistaPrevia = abrirVistaPrevia;
  window.actualizarUserPill = actualizarUserPill;
  window.actualizarVariantIndicator = actualizarVariantIndicator;
  window.agregarCriterio = agregarCriterio;
  window.agregarSeccion = agregarSeccion;

  window.cambiarScript = cambiarScript;
  window.cambiarModoPuntaje = cambiarModoPuntaje;
  window.setCriterioPuntos = setCriterioPuntos;
  window.agregarErrorFatal = agregarErrorFatal;
  window.eliminarErrorFatal = eliminarErrorFatal;
  window.setErrorFatalCampo = setErrorFatalCampo;
  window.cargarHistorial = cargarHistorial;
  window.cargarScript = cargarScript;
  window.cargarScriptActual = cargarScriptActual;
  window.cerrarModal = cerrarModal;
  window.confirmarRestaurar = confirmarRestaurar;
  window.criterioHTML = criterioHTML;
  window.iniciarEditorConSesionGlobal = iniciarEditorConSesionGlobal;
  window.eliminarCriterio = eliminarCriterio;
  window.eliminarSeccion = eliminarSeccion;
  window.escapeAttr = escapeAttr;
  window.exportarJSON = exportarJSON;
  window.formatearFecha = formatearFecha;
  window.guardarVersion = guardarVersion;
  window.hoy = hoy;
  window.importarJSON = importarJSON;
  window.iniciarEditor = iniciarEditor;
  window.marcarDirty = marcarDirty;
  window.mostrarToast = mostrarToast;
  window.poblarSelectores = poblarSelectores;
  window.publicarVersion = publicarVersion;
  window.renderEditor = renderEditor;
  window.renderHistorial = renderHistorial;
  window.restaurarVersion = restaurarVersion;
  window.setCriterioNombre = setCriterioNombre;
  window.setNivel = setNivel;
  window.setPesoSeccion = setPesoSeccion;
  window.setTituloSeccion = setTituloSeccion;
  window.storageKey = storageKey;
  window.toggleDemoMode = toggleDemoMode;
  window.toggleSeccion = toggleSeccion;
  window.validar = validar;
  window.verVersion = verVersion;
})();

</script>

<section id="view-dashboard-kpis">

  <div class="qi-hero">
    <div>
      <h1>📊 Dashboard de KPIs de Calidad</h1>
      <div class="qi-sub">Vista ejecutiva de inteligencia de calidad · ¿Cómo se está comportando la calidad de toda la operación?</div>
    </div>
    <div class="qi-scope" id="qi-scope">— evaluaciones en el alcance</div>
  </div>

  <!-- FILTROS GLOBALES -->
  <div class="qi-filters" id="qi-filters">
    <div class="qi-filter">
      <label>Periodo</label>
      <select id="qi-f-periodo">
        <option value="7">Últimos 7 días</option>
        <option value="30" selected>Últimos 30 días</option>
        <option value="90">Últimos 90 días</option>
        <option value="180">Últimos 180 días</option>
        <option value="all">Todo</option>
      </select>
    </div>
    <div class="qi-filter">
      <label>Área</label>
      <select id="qi-f-area"><option value="all">Todas</option></select>
    </div>
    <div class="qi-filter">
      <label>Canal</label>
      <select id="qi-f-canal">
        <option value="all">Todos</option>
        <option value="llamadas">Llamadas</option>
      </select>
      <span class="qi-filter-note">único con datos hoy</span>
    </div>
    <div class="qi-filter">
      <label>Asesor</label>
      <select id="qi-f-asesor"><option value="all">Todos</option></select>
    </div>
    <button class="qi-reset" id="qi-btn-reset">Limpiar filtros</button>
  </div>

  <div id="qi-body">
    <!-- Se renderiza aquí -->
  </div>

<script>
(function(){
  // ═════════════════════════════════════════════════════════════════
  // DASHBOARD DE KPIs DE CALIDAD — Quality Intelligence
  // Capa analítica pura sobre sonar_seguimiento_evaluaciones.
  // No escribe. No toca otras vistas. Reutiliza Chart.js ya cargado.
  // ═════════════════════════════════════════════════════════════════
  var SEG_KEY = "sonar_seguimiento_evaluaciones";

  var UMBRAL_CRITICO = 6.0;   // criterio con promedio < 6 = crítico
  var UMBRAL_EXC = 8.5;       // ≥ 8.5 = fortaleza
  var CAIDA_SIGNIFICATIVA = 1.0;  // pts

  // Estado local de la vista
  var state = {
    filtros: { periodo: "30", area: "all", canal: "all", asesor: "all" },
    granularidad: "week", // day | week | month
    drill: { level: "operacion", area: null, criterio: null }
  };

  var chartEvol = null;

  function getEvals() {
    try { return JSON.parse(localStorage.getItem(SEG_KEY) || "[]") || []; }
    catch(e) { return []; }
  }

  function fechaBase(e) {
    // Preferimos fecha_llamada (día real de la llamada), caemos a fecha_guardado
    return (e.fecha_llamada && String(e.fecha_llamada).length >= 10)
      ? e.fecha_llamada.substr(0,10)
      : (e.fecha_guardado || "").substr(0,10);
  }

  function toDate(str) {
    if (!str) return null;
    var d = new Date(str + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function daysAgo(n) {
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - n); return d;
  }

  function areaLabel(a) {
    if (a === "credito") return "Validación de Crédito";
    if (a === "ventas") return "Ventas Digital";
    if (a === "cobranza") return "Cobranza";
    return a || "—";
  }

  function areaNorm(e) {
    if (e.area === "credito") return "credito";
    if (e.area === "ventas") return "ventas";
    if (e.area === "cobranza") return "cobranza";
    return e.area || "otros";
  }

  function nivelDePuntaje(p) {
    if (p == null || isNaN(p)) return null;
    if (p >= 9) return "excelente";
    if (p >= 7) return "aceptable";
    if (p >= 4) return "deficiente";
    return "critico";
  }

  function fmt(n, d) { return n == null || isNaN(n) ? "—" : Number(n).toFixed(d == null ? 1 : d); }
  function pct(n, d) { return n == null || isNaN(n) ? "—" : (n*100).toFixed(d == null ? 0 : d) + "%"; }

  // ═════════════════════════════════════════════════════════════════
  // FILTROS
  // ═════════════════════════════════════════════════════════════════
  function evalsFiltradas() {
    var todas = getEvals();
    var f = state.filtros;
    var hoy = new Date(); hoy.setHours(23,59,59,999);
    var desde = null;
    if (f.periodo !== "all") {
      desde = daysAgo(parseInt(f.periodo, 10) - 1);
    }

    return todas.filter(function(e){
      var d = toDate(fechaBase(e));
      if (!d) return false;
      if (desde && d < desde) return false;
      if (d > hoy) return false;
      if (f.area !== "all" && areaNorm(e) !== f.area) return false;
      // Canal: hoy solo hay llamadas. Si se filtra por llamadas, todas pasan.
      // Si un día agregan canal a las evaluaciones, aquí se leerá e.canal.
      if (f.canal !== "all") {
        var canal = e.canal || "llamadas";
        if (canal !== f.canal) return false;
      }
      if (f.asesor !== "all") {
        if ((e.asesor || "").trim().toLowerCase() !== f.asesor) return false;
      }
      return true;
    });
  }

  function evalsPeriodoAnterior() {
    // Mismo tamaño de ventana, inmediatamente anterior. Solo aplica si hay periodo definido.
    var f = state.filtros;
    if (f.periodo === "all") return [];
    var dias = parseInt(f.periodo, 10);
    var hastaAnterior = daysAgo(dias);
    hastaAnterior.setHours(23,59,59,999);
    var desdeAnterior = daysAgo(dias*2 - 1);
    var todas = getEvals();
    return todas.filter(function(e){
      var d = toDate(fechaBase(e));
      if (!d) return false;
      if (d < desdeAnterior || d > hastaAnterior) return false;
      if (f.area !== "all" && areaNorm(e) !== f.area) return false;
      if (f.canal !== "all") {
        var canal = e.canal || "llamadas";
        if (canal !== f.canal) return false;
      }
      if (f.asesor !== "all" && (e.asesor || "").trim().toLowerCase() !== f.asesor) return false;
      return true;
    });
  }

  function poblarFiltros() {
    var todas = getEvals();

    var areas = {};
    var asesores = {};
    todas.forEach(function(e){
      var a = areaNorm(e); if (a) areas[a] = true;
      var as = (e.asesor||"").trim();
      if (as) asesores[as.toLowerCase()] = as;
    });

    var selArea = document.getElementById("qi-f-area");
    if (selArea) {
      var current = selArea.value;
      selArea.innerHTML = '<option value="all">Todas</option>' + Object.keys(areas).sort().map(function(a){
        return '<option value="'+a+'">'+areaLabel(a)+'</option>';
      }).join('');
      if (current) selArea.value = current;
    }

    var selAses = document.getElementById("qi-f-asesor");
    if (selAses) {
      var currentAs = selAses.value;
      var lista = Object.keys(asesores).sort(function(a,b){ return asesores[a].localeCompare(asesores[b]); });
      selAses.innerHTML = '<option value="all">Todos</option>' + lista.map(function(k){
        return '<option value="'+k+'">'+escapeHtml(asesores[k])+'</option>';
      }).join('');
      if (currentAs) selAses.value = currentAs;
    }
  }

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ═════════════════════════════════════════════════════════════════
  // AGREGACIONES
  // ═════════════════════════════════════════════════════════════════
  function avg(arr) {
    var v = arr.filter(function(x){ return x != null && !isNaN(x); });
    if (!v.length) return null;
    return v.reduce(function(a,b){ return a+b; }, 0) / v.length;
  }

  function bucketKey(dateStr, gran) {
    if (!dateStr) return null;
    var d = toDate(dateStr);
    if (!d) return null;
    if (gran === "day") return dateStr;
    if (gran === "month") {
      return dateStr.substr(0,7); // YYYY-MM
    }
    // week — lunes
    var dia = d.getDay();
    var ajuste = (dia === 0 ? -6 : 1) - dia;
    d.setDate(d.getDate() + ajuste);
    d.setHours(0,0,0,0);
    return d.toISOString().substr(0,10);
  }

  function labelBucket(key, gran) {
    if (!key) return "";
    if (gran === "day") {
      var d = toDate(key);
      return d ? d.toLocaleDateString("es-MX", { day:"numeric", month:"short" }) : key;
    }
    if (gran === "month") {
      var d2 = toDate(key + "-01");
      return d2 ? d2.toLocaleDateString("es-MX", { month:"short", year:"2-digit" }) : key;
    }
    var lunes = toDate(key);
    if (!lunes) return key;
    var domingo = new Date(lunes); domingo.setDate(domingo.getDate() + 6);
    var fmt = function(x){ return x.toLocaleDateString("es-MX", { day:"numeric", month:"short" }); };
    return fmt(lunes) + " – " + fmt(domingo);
  }

  function agruparPorBucket(evals, gran) {
    var map = {};
    evals.forEach(function(e){
      var k = bucketKey(fechaBase(e), gran);
      if (!k) return;
      if (!map[k]) map[k] = [];
      map[k].push(e.puntaje_total || 0);
    });
    var keys = Object.keys(map).sort();
    return keys.map(function(k){ return { key: k, label: labelBucket(k, gran), avg: avg(map[k]), n: map[k].length }; });
  }

  function agruparPorArea(evals) {
    var map = {};
    evals.forEach(function(e){
      var a = areaNorm(e);
      if (!map[a]) map[a] = { area: a, scores: [], evals: [] };
      map[a].scores.push(e.puntaje_total || 0);
      map[a].evals.push(e);
    });
    return Object.values(map);
  }

  function tendenciaArea(evalsArea) {
    // Primera mitad vs segunda mitad del periodo actual (ordenado por fecha)
    var ordenadas = evalsArea.slice().sort(function(a,b){
      return (fechaBase(a) || "").localeCompare(fechaBase(b) || "");
    });
    if (ordenadas.length < 4) return { delta: null, dir: "flat" };
    var mid = Math.floor(ordenadas.length / 2);
    var prim = avg(ordenadas.slice(0, mid).map(function(e){ return e.puntaje_total; }));
    var seg = avg(ordenadas.slice(mid).map(function(e){ return e.puntaje_total; }));
    if (prim == null || seg == null) return { delta: null, dir: "flat" };
    var delta = seg - prim;
    var dir = "flat";
    if (delta >= 0.3) dir = "up";
    else if (delta <= -0.3) dir = "down";
    return { delta: delta, dir: dir };
  }

  function agruparPorCriterio(evals) {
    var map = {};
    evals.forEach(function(e){
      (e.criterios || []).forEach(function(c){
        if (!c || !c.criterio) return;
        var key = c.criterio;
        if (!map[key]) map[key] = { nombre: key, seccion: c.seccion || "General", scores: [], evalsRefs: [] };
        if (c.puntaje != null && !isNaN(c.puntaje)) {
          map[key].scores.push(c.puntaje);
          map[key].evalsRefs.push(e);
        }
      });
    });
    return Object.values(map).map(function(o){
      return { nombre: o.nombre, seccion: o.seccion, promedio: avg(o.scores), n: o.scores.length, evalsRefs: o.evalsRefs };
    }).filter(function(o){ return o.n > 0; });
  }

  function tendenciaCriterio(evals, nombreCriterio) {
    var puntos = [];
    evals.forEach(function(e){
      (e.criterios || []).forEach(function(c){
        if (c.criterio === nombreCriterio && c.puntaje != null && !isNaN(c.puntaje)) {
          puntos.push({ fecha: fechaBase(e), score: c.puntaje });
        }
      });
    });
    puntos.sort(function(a,b){ return (a.fecha||"").localeCompare(b.fecha||""); });
    if (puntos.length < 4) return { delta: null, dir: "flat" };
    var mid = Math.floor(puntos.length / 2);
    var prim = avg(puntos.slice(0, mid).map(function(p){ return p.score; }));
    var seg = avg(puntos.slice(mid).map(function(p){ return p.score; }));
    if (prim == null || seg == null) return { delta: null, dir: "flat" };
    var delta = seg - prim;
    var dir = "flat";
    if (delta >= 0.3) dir = "up";
    else if (delta <= -0.3) dir = "down";
    return { delta: delta, dir: dir };
  }

  // ═════════════════════════════════════════════════════════════════
  // RENDER
  // ═════════════════════════════════════════════════════════════════
  function render() {
    poblarFiltros();
    var evals = evalsFiltradas();
    var scope = document.getElementById("qi-scope");
    if (scope) scope.textContent = evals.length + " evaluación" + (evals.length === 1 ? "" : "es") + " en el alcance";

    var body = document.getElementById("qi-body");
    if (!body) return;

    if (!evals.length) {
      body.innerHTML =
        '<div class="qi-empty">' +
          '<h2>No hay evaluaciones en el alcance seleccionado</h2>' +
          '<div>Ajusta los filtros o regístra evaluaciones desde <strong>Evaluar llamada</strong> o <strong>Evaluar Batch</strong>.</div>' +
        '</div>';
      return;
    }

    body.innerHTML =
      renderKPIs(evals) +
      '<div class="qi-row">' +
        renderEvolucion() +
        renderAreas(evals) +
      '</div>' +
      renderDistribucion(evals) +
      renderHeatmap(evals) +
      renderFortRiesgos(evals) +
      renderAlertas(evals) +
      renderDrill(evals);

    // Renderizar gráfica evolución
    renderChartEvolucion(evals);
    // Segmented control para granularidad
    document.querySelectorAll(".view-dashboard-kpis .qi-seg[data-seg='gran'] button").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.granularidad = btn.getAttribute("data-gran");
        document.querySelectorAll(".view-dashboard-kpis .qi-seg[data-seg='gran'] button").forEach(function(b){
          b.classList.toggle("active", b === btn);
        });
        renderChartEvolucion(evalsFiltradas());
      });
    });
    // Drill-down handlers
    bindDrillHandlers(evals);
  }

  function renderKPIs(evals) {
    var f = state.filtros;
    var promedio = avg(evals.map(function(e){ return e.puntaje_total; }));
    var evalsAnt = evalsPeriodoAnterior();
    var promedioAnt = avg(evalsAnt.map(function(e){ return e.puntaje_total; }));
    var delta = (promedio != null && promedioAnt != null) ? (promedio - promedioAnt) : null;
    var deltaEvals = (evalsAnt.length > 0) ? (evals.length - evalsAnt.length) : null;

    var criterios = agruparPorCriterio(evals);
    var criticos = criterios.filter(function(c){ return c.promedio != null && c.promedio < UMBRAL_CRITICO; }).length;
    var fatales = 0;
    evals.forEach(function(e){ if ((e.errores_fatales_detectados||[]).length) fatales++; });

    // Tendencia general — primera vs segunda mitad
    var ordenadas = evals.slice().sort(function(a,b){ return (fechaBase(a)||"").localeCompare(fechaBase(b)||""); });
    var tendGen = { dir: "flat", delta: null };
    if (ordenadas.length >= 4) {
      var mid = Math.floor(ordenadas.length / 2);
      var p1 = avg(ordenadas.slice(0, mid).map(function(e){ return e.puntaje_total; }));
      var p2 = avg(ordenadas.slice(mid).map(function(e){ return e.puntaje_total; }));
      if (p1 != null && p2 != null) {
        tendGen.delta = p2 - p1;
        if (tendGen.delta >= 0.3) tendGen.dir = "up";
        else if (tendGen.delta <= -0.3) tendGen.dir = "down";
      }
    }

    function kpiCard(label, value, delta, extra, isPct, hint) {
      var deltaHtml = "";
      if (delta != null) {
        var dir = delta > 0.05 ? "up" : (delta < -0.05 ? "down" : "flat");
        var arrow = dir === "up" ? "▲" : (dir === "down" ? "▼" : "▬");
        var sign = delta > 0 ? "+" : "";
        deltaHtml = '<div class="qi-kpi-delta '+dir+'">'+arrow+' '+sign+fmt(delta,2)+' vs periodo anterior</div>';
      } else if (extra) {
        deltaHtml = '<div class="qi-kpi-hint">'+extra+'</div>';
      }
      var valClass = value === "N/D" ? "qi-kpi-value nd" : "qi-kpi-value";
      var hintHtml = hint ? '<div class="qi-kpi-hint">'+hint+'</div>' : "";
      return '<div class="qi-kpi">'+
        '<div class="qi-kpi-label">'+label+'</div>'+
        '<div class="'+valClass+'">'+value+'</div>'+
        deltaHtml + hintHtml +
      '</div>';
    }

    var tendLabel = tendGen.dir === "up" ? "Mejorando" : (tendGen.dir === "down" ? "Deteriorando" : "Estable");

    return '<div class="qi-kpis">' +
      kpiCard("Calidad promedio", promedio != null ? fmt(promedio,2) : "N/D", delta, f.periodo === "all" ? "Sin periodo anterior comparable" : null) +
      kpiCard("Tendencia general", tendLabel, tendGen.delta, "Primera vs segunda mitad") +
      kpiCard("Evaluaciones", String(evals.length), null, deltaEvals != null ? ((deltaEvals>=0?"+":"")+deltaEvals+" vs periodo anterior") : "Volumen del alcance") +
      kpiCard("Cobertura", "N/D", null, null, false, "Requiere universo total de llamadas") +
      kpiCard("Criterios críticos", String(criticos), null, "promedio &lt; " + UMBRAL_CRITICO) +
      kpiCard("Errores fatales", String(fatales), null, "evaluaciones con al menos uno") +
    '</div>';
  }

  function renderEvolucion() {
    return '<div class="qi-panel" style="margin-bottom:0">' +
      '<div class="qi-panel-head">' +
        '<div>' +
          '<h2>Evolución de calidad</h2>' +
          '<div class="qi-panel-sub">¿Estamos mejorando o empeorando?</div>' +
        '</div>' +
        '<div class="qi-seg" data-seg="gran">' +
          '<button data-gran="day"'+(state.granularidad==="day"?' class="active"':"")+'>Diario</button>' +
          '<button data-gran="week"'+(state.granularidad==="week"?' class="active"':"")+'>Semanal</button>' +
          '<button data-gran="month"'+(state.granularidad==="month"?' class="active"':"")+'>Mensual</button>' +
        '</div>' +
      '</div>' +
      '<div class="qi-chart-wrap"><canvas id="qi-chart-evol"></canvas></div>' +
    '</div>';
  }

  function renderChartEvolucion(evals) {
    var canvas = document.getElementById("qi-chart-evol");
    if (!canvas || typeof Chart === "undefined") return;
    var puntos = agruparPorBucket(evals, state.granularidad);
    if (chartEvol) { try { chartEvol.destroy(); } catch(e){} }
    chartEvol = new Chart(canvas.getContext("2d"), {
      type: "line",
      data: {
        labels: puntos.map(function(p){ return p.label; }),
        datasets: [{
          label: "Calidad promedio",
          data: puntos.map(function(p){ return p.avg; }),
          borderColor: "#00b100",
          backgroundColor: "rgba(0,177,0,0.08)",
          tension: 0.3,
          fill: true,
          pointRadius: 4,
          pointBackgroundColor: "#00b100",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx){
                var p = puntos[ctx.dataIndex];
                return "Promedio: " + fmt(p.avg, 2) + "  ·  n=" + p.n;
              }
            }
          }
        },
        scales: {
          y: { min: 0, max: 10, ticks: { stepSize: 2, color: "#7a7a7a" }, grid: { color: "#ececec" } },
          x: { ticks: { color: "#7a7a7a", maxRotation: 45, minRotation: 0 }, grid: { display: false } }
        }
      }
    });
  }

  function renderAreas(evals) {
    var porArea = agruparPorArea(evals);
    porArea.sort(function(a,b){ return b.scores.length - a.scores.length; });

    var items = porArea.map(function(a){
      var prom = avg(a.scores);
      var t = tendenciaArea(a.evals);
      var trendHtml = "";
      if (t.delta != null) {
        var arr = t.dir === "up" ? "▲" : (t.dir === "down" ? "▼" : "▬");
        var cls = t.dir === "up" ? "up" : (t.dir === "down" ? "down" : "flat");
        var sign = t.delta > 0 ? "+" : "";
        trendHtml = '<span class="trend '+cls+'">'+arr+' '+sign+fmt(t.delta,2)+'</span>';
      } else {
        trendHtml = '<span class="qi-nd">n insuficiente</span>';
      }
      var pctBar = prom != null ? Math.max(0, Math.min(100, prom * 10)) : 0;
      return '<div class="qi-area-item">' +
        '<div class="top">' +
          '<div class="name">'+escapeHtml(areaLabel(a.area))+'</div>' +
          '<div class="score'+(prom==null?' nd':'')+'">'+(prom!=null?fmt(prom,2):"N/D")+'</div>' +
        '</div>' +
        '<div class="bar"><div class="bar-fill" style="width:'+pctBar+'%"></div></div>' +
        '<div class="meta"><span>'+a.scores.length+' evaluaciones</span>'+trendHtml+'</div>' +
      '</div>';
    }).join('');

    return '<div class="qi-panel" style="margin-bottom:0">' +
      '<div class="qi-panel-head">' +
        '<div>' +
          '<h2>Calidad por área</h2>' +
          '<div class="qi-panel-sub">Promedio + tendencia (primera vs segunda mitad)</div>' +
        '</div>' +
      '</div>' +
      '<div class="qi-area-list">' + (items || '<div class="qi-nd">Sin datos</div>') + '</div>' +
    '</div>';
  }

  function renderDistribucion(evals) {
    var buckets = { excelente: 0, aceptable: 0, deficiente: 0, critico: 0 };
    evals.forEach(function(e){
      var n = nivelDePuntaje(e.puntaje_total);
      if (n) buckets[n]++;
    });
    var total = evals.length;
    function bloque(cls, label, key) {
      var n = buckets[key];
      var p = total ? (n/total) : 0;
      return '<div class="qi-dist-item '+cls+'">' +
        '<div class="lbl">'+label+'</div>' +
        '<div class="val">'+n+'</div>' +
        '<div class="pct">'+pct(p)+' del total</div>' +
      '</div>';
    }
    return '<div class="qi-panel">' +
      '<div class="qi-panel-head">' +
        '<div><h2>Distribución de resultados</h2>' +
        '<div class="qi-panel-sub">Cuántas evaluaciones caen en cada rango de desempeño</div></div>' +
      '</div>' +
      '<div class="qi-distribution">' +
        bloque("exc", "Excelente (≥9)", "excelente") +
        bloque("ace", "Aceptable (7–8.9)", "aceptable") +
        bloque("def", "Deficiente (4–6.9)", "deficiente") +
        bloque("cri", "Crítico (<4)", "critico") +
      '</div>' +
    '</div>';
  }

  function renderHeatmap(evals) {
    // Criterios (top 12 por volumen) × últimos N buckets según granularidad
    var criterios = agruparPorCriterio(evals);
    criterios.sort(function(a,b){ return b.n - a.n; });
    criterios = criterios.slice(0, 12);
    if (!criterios.length) {
      return '<div class="qi-panel"><div class="qi-panel-head"><div><h2>Heatmap criterios × periodo</h2>' +
        '<div class="qi-panel-sub">Detecta deterioros, mejoras y criterios estables</div></div></div>' +
        '<div class="qi-nd" style="padding:20px;text-align:center">Sin criterios evaluados en el alcance</div></div>';
    }

    // Buckets del periodo (misma granularidad que la gráfica)
    var gran = state.granularidad;
    // Recolectamos scores por (criterio, bucket)
    var matriz = {}; // criterio -> bucket -> [scores]
    var bucketsSet = {};
    evals.forEach(function(e){
      var b = bucketKey(fechaBase(e), gran);
      if (!b) return;
      bucketsSet[b] = true;
      (e.criterios || []).forEach(function(c){
        if (!c.criterio || c.puntaje == null || isNaN(c.puntaje)) return;
        if (!matriz[c.criterio]) matriz[c.criterio] = {};
        if (!matriz[c.criterio][b]) matriz[c.criterio][b] = [];
        matriz[c.criterio][b].push(c.puntaje);
      });
    });
    var buckets = Object.keys(bucketsSet).sort();
    // Máximo 8 buckets para no saturar
    if (buckets.length > 8) buckets = buckets.slice(-8);

    function celColor(score) {
      if (score == null) return { bg: "#f5f5f5", fg: "#cccccc" };
      // 0..10 → escala rojo → amarillo → verde
      var pct = Math.max(0, Math.min(1, score / 10));
      var r, g;
      if (pct < 0.5) {
        // rojo (d63333) a amarillo (d4a017)
        var t = pct / 0.5;
        r = Math.round(214 + (212-214)*t);
        g = Math.round(51 + (160-51)*t);
      } else {
        var t2 = (pct - 0.5) / 0.5;
        r = Math.round(212 + (0-212)*t2);
        g = Math.round(160 + (177-160)*t2);
      }
      var bg = "rgb("+r+","+g+",30)";
      // opacidad menor + tinte
      var alpha = 0.18 + pct*0.55;
      return { bg: "rgba("+r+","+g+",30,"+alpha.toFixed(2)+")", fg: "#0a0a0a" };
    }

    var header = '<tr><th class="crit-head">Criterio</th>' +
      buckets.map(function(b){ return '<th>'+escapeHtml(labelBucket(b, gran))+'</th>'; }).join('') +
    '</tr>';
    var rows = criterios.map(function(c){
      var cells = buckets.map(function(b){
        var vals = matriz[c.nombre] && matriz[c.nombre][b];
        if (!vals || !vals.length) return '<td class="empty">—</td>';
        var s = avg(vals);
        var col = celColor(s);
        return '<td style="background:'+col.bg+';color:'+col.fg+'">'+fmt(s,1)+'</td>';
      }).join('');
      return '<tr><td class="name" title="'+escapeHtml(c.nombre)+'">'+escapeHtml(truncate(c.nombre, 60))+'</td>'+cells+'</tr>';
    }).join('');

    return '<div class="qi-panel">' +
      '<div class="qi-panel-head">' +
        '<div><h2>Heatmap criterios × periodo</h2>' +
        '<div class="qi-panel-sub">Top 12 criterios por volumen · última ventana según granularidad seleccionada</div></div>' +
      '</div>' +
      '<div class="qi-heatmap"><table><thead>'+header+'</thead><tbody>'+rows+'</tbody></table></div>' +
    '</div>';
  }

  function truncate(s, n) {
    if (!s) return "";
    return s.length > n ? s.substr(0, n-1) + "…" : s;
  }

  function renderFortRiesgos(evals) {
    var criterios = agruparPorCriterio(evals);
    // Enriquecer con tendencia
    criterios = criterios.map(function(c){
      var t = tendenciaCriterio(evals, c.nombre);
      return { nombre: c.nombre, promedio: c.promedio, n: c.n, tend: t };
    });
    // Filtrar mínimo n para robustez
    criterios = criterios.filter(function(c){ return c.n >= 3; });

    // Fortalezas: prom alto (≥ UMBRAL_EXC) o mejorando fuerte
    var fortalezas = criterios.slice().sort(function(a,b){
      // score compuesto: promedio + peso a subida
      var sa = (a.promedio||0) + (a.tend.delta > 0 ? a.tend.delta*0.5 : 0);
      var sb = (b.promedio||0) + (b.tend.delta > 0 ? b.tend.delta*0.5 : 0);
      return sb - sa;
    }).slice(0, 6);

    // Riesgos: prom bajo o cayendo fuerte
    var riesgos = criterios.slice().sort(function(a,b){
      var sa = (a.promedio||0) - (a.tend.delta < 0 ? Math.abs(a.tend.delta)*0.5 : 0);
      var sb = (b.promedio||0) - (b.tend.delta < 0 ? Math.abs(b.tend.delta)*0.5 : 0);
      return sa - sb;
    }).slice(0, 6);

    function item(c) {
      var tHtml = "";
      if (c.tend.delta != null) {
        var arr = c.tend.dir === "up" ? "▲" : (c.tend.dir === "down" ? "▼" : "▬");
        var sign = c.tend.delta > 0 ? "+" : "";
        tHtml = '<span class="trend '+c.tend.dir+'">'+arr+' '+sign+fmt(c.tend.delta,2)+'</span>';
      } else {
        tHtml = '<span class="trend flat">▬</span>';
      }
      return '<div class="qi-fr-item">' +
        '<span class="n">n='+c.n+'</span>' +
        '<span class="name" title="'+escapeHtml(c.nombre)+'">'+escapeHtml(truncate(c.nombre, 55))+'</span>' +
        '<span class="score-mini">'+fmt(c.promedio,1)+'</span>' +
        tHtml +
      '</div>';
    }

    return '<div class="qi-panel">' +
      '<div class="qi-panel-head"><div><h2>Fortalezas y focos de riesgo</h2>' +
      '<div class="qi-panel-sub">Combina promedio + tendencia. Solo criterios con n ≥ 3</div></div></div>' +
      '<div class="qi-fr-grid">' +
        '<div class="qi-fr-col fort"><h3>✅ Principales fortalezas</h3>' +
          (fortalezas.length ? fortalezas.map(item).join('') : '<div class="qi-nd">Sin criterios con n suficiente</div>') +
        '</div>' +
        '<div class="qi-fr-col risk"><h3>⚠️ Principales focos de riesgo</h3>' +
          (riesgos.length ? riesgos.map(item).join('') : '<div class="qi-nd">Sin criterios con n suficiente</div>') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderAlertas(evals) {
    var alertas = [];

    // 1. Áreas cayendo significativamente
    var porArea = agruparPorArea(evals);
    porArea.forEach(function(a){
      var t = tendenciaArea(a.evals);
      if (t.delta != null && t.delta <= -CAIDA_SIGNIFICATIVA) {
        alertas.push({ tipo: "crit", msg: '🔴 <strong>' + escapeHtml(areaLabel(a.area)) + '</strong> cayó <strong>' + fmt(Math.abs(t.delta),2) + ' pts</strong> dentro del periodo (primera vs segunda mitad).' });
      } else if (t.delta != null && t.delta <= -0.5) {
        alertas.push({ tipo: "warn", msg: '🟠 <strong>' + escapeHtml(areaLabel(a.area)) + '</strong> con deterioro moderado: ' + fmt(t.delta,2) + ' pts.' });
      }
    });

    // 2. Criterios bajo umbral crítico
    var criterios = agruparPorCriterio(evals).filter(function(c){ return c.n >= 3 && c.promedio != null && c.promedio < UMBRAL_CRITICO; });
    criterios.sort(function(a,b){ return a.promedio - b.promedio; });
    criterios.slice(0, 3).forEach(function(c){
      alertas.push({ tipo: "crit", msg: '🔴 <strong>' + escapeHtml(truncate(c.nombre, 60)) + '</strong> promedia <strong>' + fmt(c.promedio,2) + '</strong> (bajo umbral ' + UMBRAL_CRITICO + '). n=' + c.n });
    });

    // 3. Criterios cayendo fuerte
    var crCae = agruparPorCriterio(evals).map(function(c){
      var t = tendenciaCriterio(evals, c.nombre);
      return { nombre: c.nombre, promedio: c.promedio, n: c.n, delta: t.delta, dir: t.dir };
    }).filter(function(c){ return c.n >= 4 && c.delta != null && c.delta <= -CAIDA_SIGNIFICATIVA; });
    crCae.sort(function(a,b){ return a.delta - b.delta; });
    crCae.slice(0, 3).forEach(function(c){
      alertas.push({ tipo: "warn", msg: '🟠 <strong>' + escapeHtml(truncate(c.nombre, 55)) + '</strong> cayó ' + fmt(c.delta,2) + ' pts dentro del periodo.' });
    });

    // 4. Errores fatales acumulados
    var fatales = evals.filter(function(e){ return (e.errores_fatales_detectados||[]).length > 0; });
    if (fatales.length >= 3) {
      var pctFat = fatales.length / evals.length;
      alertas.push({ tipo: "crit", msg: '🔴 <strong>' + fatales.length + ' evaluaciones</strong> con error fatal (' + pct(pctFat) + ' del alcance).' });
    } else if (fatales.length > 0) {
      alertas.push({ tipo: "warn", msg: '🟠 ' + fatales.length + ' evaluación' + (fatales.length===1?"":"es") + ' con error fatal en el periodo.' });
    }

    // 5. Cobertura muy baja de un área específica
    var porA = agruparPorArea(evals);
    porA.forEach(function(a){
      if (a.scores.length === 1) {
        alertas.push({ tipo: "info", msg: 'ℹ️ Solo <strong>1 evaluación</strong> de ' + escapeHtml(areaLabel(a.area)) + ' en el alcance. Insuficiente para conclusiones.' });
      }
    });

    var body;
    if (!alertas.length) {
      body = '<div class="qi-alerts-empty">Sin alertas ejecutivas. La operación está dentro de parámetros normales para el alcance seleccionado.</div>';
    } else {
      body = '<div class="qi-alerts">' + alertas.map(function(a){
        return '<div class="qi-alert '+a.tipo+'"><div class="msg">'+a.msg+'</div></div>';
      }).join('') + '</div>';
    }

    return '<div class="qi-panel">' +
      '<div class="qi-panel-head"><div><h2>🚨 Alertas ejecutivas</h2>' +
      '<div class="qi-panel-sub">Situaciones que requieren atención de dirección</div></div></div>' +
      body +
    '</div>';
  }

  function renderDrill(evals) {
    var d = state.drill;
    var promGen = avg(evals.map(function(e){ return e.puntaje_total; }));
    var promGenTxt = promGen != null ? fmt(promGen,2) : "N/D";

    var pathHtml = '<div class="qi-drill-path">' +
      '<span class="qi-drill-step active" data-drill-level="operacion">Operación</span>';
    if (d.area) {
      pathHtml += '<span class="qi-drill-arrow">→</span>' +
        '<span class="qi-drill-step '+(d.level==='area'?'active':'')+'" data-drill-level="area">'+escapeHtml(areaLabel(d.area))+'</span>';
    }
    if (d.criterio) {
      pathHtml += '<span class="qi-drill-arrow">→</span>' +
        '<span class="qi-drill-step '+(d.level==='criterio'?'active':'')+'" data-drill-level="criterio">'+escapeHtml(truncate(d.criterio, 40))+'</span>';
    }
    pathHtml += '</div>';

    var body;
    if (d.level === "operacion") {
      var porArea = agruparPorArea(evals);
      porArea.sort(function(a,b){ return (avg(b.scores)||0) - (avg(a.scores)||0); });
      body =
        '<div class="lvl-title">Calidad general <span class="score-big">'+promGenTxt+'</span></div>' +
        '<div style="font-size:12px;color:#7a7a7a;margin-bottom:8px">Selecciona un área para explorar sus criterios</div>' +
        '<div class="qi-drill-list">' +
          porArea.map(function(a){
            var s = avg(a.scores);
            return '<div class="item" data-drill-area="'+a.area+'">' +
              '<span class="lbl">'+escapeHtml(areaLabel(a.area))+' <span style="color:#9a9a9a;font-weight:400">('+a.scores.length+' eval)</span></span>' +
              '<span class="val">'+(s!=null?fmt(s,2):"N/D")+' →</span>' +
            '</div>';
          }).join('') +
        '</div>';
    } else if (d.level === "area") {
      var evalsArea = evals.filter(function(e){ return areaNorm(e) === d.area; });
      var promArea = avg(evalsArea.map(function(e){ return e.puntaje_total; }));
      var crits = agruparPorCriterio(evalsArea).filter(function(c){ return c.n >= 2; });
      crits.sort(function(a,b){ return (a.promedio||10) - (b.promedio||10); }); // más débiles primero
      body =
        '<div class="lvl-title">'+escapeHtml(areaLabel(d.area))+' <span class="score-big">'+(promArea!=null?fmt(promArea,2):"N/D")+'</span></div>' +
        '<div style="font-size:12px;color:#7a7a7a;margin-bottom:8px">Criterios ordenados por debilidad. Selecciona uno para ver asesores afectados</div>' +
        '<div class="qi-drill-list">' +
          (crits.length ? crits.slice(0,10).map(function(c){
            return '<div class="item" data-drill-criterio="'+escapeHtml(c.nombre)+'">' +
              '<span class="lbl">'+escapeHtml(truncate(c.nombre, 60))+' <span style="color:#9a9a9a;font-weight:400">(n='+c.n+')</span></span>' +
              '<span class="val">'+fmt(c.promedio,2)+' →</span>' +
            '</div>';
          }).join('') : '<div class="qi-nd">Sin criterios con n suficiente</div>') +
        '</div>';
    } else if (d.level === "criterio") {
      var evalsArea2 = evals.filter(function(e){ return areaNorm(e) === d.area; });
      // Asesores afectados por este criterio
      var porAsesor = {};
      evalsArea2.forEach(function(e){
        (e.criterios||[]).forEach(function(c){
          if (c.criterio === d.criterio && c.puntaje != null && !isNaN(c.puntaje)) {
            var ka = (e.asesor||"—").trim();
            if (!porAsesor[ka]) porAsesor[ka] = [];
            porAsesor[ka].push(c.puntaje);
          }
        });
      });
      var asesoresArr = Object.keys(porAsesor).map(function(k){
        return { asesor: k, promedio: avg(porAsesor[k]), n: porAsesor[k].length };
      });
      asesoresArr.sort(function(a,b){ return (a.promedio||10) - (b.promedio||10); });

      var promCrit = null;
      var allScores = [];
      asesoresArr.forEach(function(a){ allScores = allScores.concat(porAsesor[a.asesor]); });
      promCrit = avg(allScores);

      body =
        '<div class="lvl-title">'+escapeHtml(truncate(d.criterio, 70))+' <span class="score-big">'+(promCrit!=null?fmt(promCrit,2):"N/D")+'</span></div>' +
        '<div style="font-size:12px;color:#7a7a7a;margin-bottom:8px">Asesores impactados en este criterio dentro de '+escapeHtml(areaLabel(d.area))+' (más débiles primero)</div>' +
        '<div class="qi-drill-list">' +
          (asesoresArr.length ? asesoresArr.map(function(a){
            return '<div class="item terminal">' +
              '<span class="lbl">'+escapeHtml(a.asesor)+' <span style="color:#9a9a9a;font-weight:400">(n='+a.n+')</span></span>' +
              '<span class="val">'+fmt(a.promedio,2)+'</span>' +
            '</div>';
          }).join('') : '<div class="qi-nd">Sin asesores con datos para este criterio</div>') +
        '</div>';
    }

    return '<div class="qi-panel">' +
      '<div class="qi-panel-head"><div><h2>🔍 Drill-down analítico</h2>' +
      '<div class="qi-panel-sub">Operación → Área → Criterio → Asesores afectados</div></div></div>' +
      '<div class="qi-drill">' + pathHtml +
        '<div class="qi-drill-body">' + body + '</div>' +
      '</div>' +
    '</div>';
  }

  function bindDrillHandlers(evals) {
    document.querySelectorAll(".view-dashboard-kpis .qi-drill-step").forEach(function(s){
      s.addEventListener("click", function(){
        var lvl = s.getAttribute("data-drill-level");
        if (lvl === "operacion") { state.drill = { level: "operacion", area: null, criterio: null }; }
        else if (lvl === "area") { state.drill.level = "area"; state.drill.criterio = null; }
        else if (lvl === "criterio") { state.drill.level = "criterio"; }
        render();
      });
    });
    document.querySelectorAll(".view-dashboard-kpis .qi-drill-list .item[data-drill-area]").forEach(function(it){
      it.addEventListener("click", function(){
        state.drill = { level: "area", area: it.getAttribute("data-drill-area"), criterio: null };
        render();
      });
    });
    document.querySelectorAll(".view-dashboard-kpis .qi-drill-list .item[data-drill-criterio]").forEach(function(it){
      it.addEventListener("click", function(){
        state.drill.level = "criterio";
        state.drill.criterio = it.getAttribute("data-drill-criterio");
        render();
      });
    });
  }

  // ═════════════════════════════════════════════════════════════════
  // WIRING FILTROS
  // ═════════════════════════════════════════════════════════════════
  function bindFilters() {
    var ids = { periodo: "qi-f-periodo", area: "qi-f-area", canal: "qi-f-canal", asesor: "qi-f-asesor" };
    Object.keys(ids).forEach(function(k){
      var el = document.getElementById(ids[k]);
      if (!el) return;
      el.addEventListener("change", function(){
        state.filtros[k] = el.value;
        // Al cambiar filtros, reseteamos drill al nivel operación para evitar estados inconsistentes
        state.drill = { level: "operacion", area: null, criterio: null };
        render();
      });
    });
    var btn = document.getElementById("qi-btn-reset");
    if (btn) btn.addEventListener("click", function(){
      state.filtros = { periodo: "30", area: "all", canal: "all", asesor: "all" };
      state.drill = { level: "operacion", area: null, criterio: null };
      document.getElementById("qi-f-periodo").value = "30";
      document.getElementById("qi-f-area").value = "all";
      document.getElementById("qi-f-canal").value = "all";
      document.getElementById("qi-f-asesor").value = "all";
      render();
    });
  }

  // Init
  bindFilters();
  render();
})();
</script>

</template>

    <button class="modal-close" onclick="document.getElementById('sx-modal').classList.remove('active');document.getElementById('sx-modal-back').classList.remove('active');">×</button>
  </div>
  <div class="modal-body" id="sx-modal-body"></div>
  <div class="modal-foot">
    <button class="sx-btn" onclick="document.getElementById('sx-modal').classList.remove('active');document.getElementById('sx-modal-back').classList.remove('active');">Cerrar</button>
  </div>
</div>

<script>
(function(){
  // ═════════════════════════════════════════════════════════════════
  // EDITOR DE SCRIPTS — capa de contenido oficial del guion
  // Storage: sonar_scripts_oficiales
  // Shape: { [cedulaId]: { versiones: [{v, contenido, secciones, nombre, autor, fecha, current, activo}] } }
  // ═════════════════════════════════════════════════════════════════

  // Catálogo de cédulas — MISMO que usa el Editor de Rúbricas.
  var CEDULAS = [
    { id: "credito",          area: "Validación de Crédito", label: "Validación de Crédito" },
    { id: "ventas",           area: "Ventas Digital",        label: "Ventas Nuevas — Digital" },
    { id: "cobranza_inbound", area: "Cobranza",              label: "Cobranza Inbound" },
    { id: "cobranza_m30",     area: "Cobranza",              label: "Cobranza M30 (1 mes)" },
    { id: "cobranza_m90",     area: "Cobranza",              label: "Cobranza M90 (3 meses)" },
    { id: "cobranza_m120",    area: "Cobranza",              label: "Cobranza M120 (4 meses)" },
    { id: "cobranza_m150",    area: "Cobranza",              label: "Cobranza M150 (5 meses)" },
  ];

  var editandoId = null; // cedulaId en edición

  function getSession() {
    try { return JSON.parse(localStorage.getItem("sonar_global_session") || "null"); } catch(e) { return null; }
  }

  function autorActual() {
    var s = getSession();
    return s ? s.nombre : "SONAR";
  }

  // API pública (queda expuesta como window.SonarScripts para que Evaluador/Batch la consulten)
  function getAll() {
    // Usar Sonar.getItem si existiera (para pasar por el interceptor de sync), o localStorage
    try { return JSON.parse(localStorage.getItem("sonar_scripts_oficiales") || "{}") || {}; }
    catch(e) { return {}; }
  }
  function setAll(obj) {
    localStorage.setItem("sonar_scripts_oficiales", JSON.stringify(obj || {}));
  }

  function getVersiones(cedulaId) {
    var all = getAll();
    return (all[cedulaId] && all[cedulaId].versiones) || [];
  }
  function getActivo(cedulaId) {
    var vs = getVersiones(cedulaId);
    var act = vs.filter(function(v){ return v.current && v.activo !== false; });
    return act[0] || null;
  }

  // Expone para Evaluador/Batch
  window.SonarScripts = {
    getActivo: getActivo,
    getVersiones: getVersiones,
    // Devuelve un bloque textual listo para inyectarse al prompt, o null si no hay script.
    toPromptBlock: function(cedulaId) {
      var v = getActivo(cedulaId);
      if (!v) return null;
      var body = v.contenido || "";
      if (v.secciones && v.secciones.length) {
        body = v.secciones.map(function(s){ return "== " + s.titulo + " ==\n" + s.texto; }).join("\n\n");
      }
      return {
        nombre: v.nombre || "Script",
        version: v.v,
        cedula_id: cedulaId,
        cedula_label: (CEDULAS.filter(function(c){return c.id===cedulaId;})[0] || {}).label || cedulaId,
        texto: body
      };
    }
  };

  function guardarVersionNueva(cedulaId, contenido, secciones, nombre, archivo) {
    var all = getAll();
    if (!all[cedulaId]) all[cedulaId] = { versiones: [] };
    // Marcar las anteriores como no current
    all[cedulaId].versiones.forEach(function(v){ v.current = false; });
    var siguiente = all[cedulaId].versiones.length ? Math.max.apply(null, all[cedulaId].versiones.map(function(v){ return v.v; })) + 1 : 1;
    all[cedulaId].versiones.unshift({
      v: siguiente,
      nombre: nombre || ((CEDULAS.filter(function(c){return c.id===cedulaId;})[0]||{}).label + " · v" + siguiente),
      contenido: contenido,
      secciones: secciones || null,
      nombre_archivo: archivo || null,
      autor: autorActual(),
      fecha: new Date().toISOString(),
      current: true,
      activo: true
    });
    // Cap de historial: 10 versiones
    all[cedulaId].versiones = all[cedulaId].versiones.slice(0, 10);
    setAll(all);
    return siguiente;
  }

  function toggleActivo(cedulaId) {
    var all = getAll();
    if (!all[cedulaId] || !all[cedulaId].versiones.length) return;
    var current = all[cedulaId].versiones.filter(function(v){ return v.current; })[0];
    if (!current) current = all[cedulaId].versiones[0];
    current.activo = current.activo === false ? true : false;
    setAll(all);
  }

  // ─── Detección de secciones a partir de texto plano ───
  function detectarSecciones(texto) {
    if (!texto) return [];
    var lineas = texto.replace(/\r/g, "").split(/\n/);
    var secciones = [];
    var actual = null;
    var bufferPreamble = [];

    function esTituloSeccion(l) {
      var s = (l || "").trim();
      if (!s) return false;
      // Descartar líneas muy largas
      if (s.length > 80) return false;
      // Patrones comunes: "1. Título", "== Título ==", "**Título**", "TÍTULO EN MAYÚSCULAS"
      if (/^==\s*.+\s*==$/.test(s)) return true;
      if (/^#{1,3}\s+.+/.test(s)) return true;
      if (/^\d+(\.\d+)?\.?\s+.{2,60}$/.test(s) && !/[.!?]$/.test(s)) return true;
      // Todo en mayúsculas con al menos una letra
      var letras = s.replace(/[^A-ZÁÉÍÓÚÑa-záéíóúñ]/g, "");
      if (letras.length >= 4 && letras === letras.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(letras)) return true;
      return false;
    }
    function limpiarTitulo(s) {
      return s.replace(/^==\s*/, "").replace(/\s*==$/, "")
        .replace(/^#{1,3}\s+/, "")
        .replace(/^\d+(\.\d+)?\.?\s+/, "")
        .replace(/^\*\*+/, "").replace(/\*\*+$/, "")
        .trim();
    }

    lineas.forEach(function(l){
      if (esTituloSeccion(l)) {
        if (actual) secciones.push(actual);
        actual = { titulo: limpiarTitulo(l), texto: "" };
      } else if (actual) {
        actual.texto += (actual.texto ? "\n" : "") + l;
      } else {
        bufferPreamble.push(l);
      }
    });
    if (actual) secciones.push(actual);

    // Si hay preamble (contenido antes del primer título), meterlo como sección "Introducción"
    if (bufferPreamble.length && bufferPreamble.join("").trim()) {
      secciones.unshift({ titulo: "Preámbulo", texto: bufferPreamble.join("\n").trim() });
    }
    // Limpiar cada sección
    secciones = secciones.map(function(s){ return { titulo: s.titulo, texto: (s.texto || "").trim() }; })
      .filter(function(s){ return s.titulo && (s.texto || s.titulo); });
    return secciones;
  }

  // ─── Extraer texto de archivo ───
  function ensureMammoth() {
    if (typeof mammoth !== "undefined") return Promise.resolve();
    return new Promise(function(res, rej){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
      s.onload = res; s.onerror = function(){ rej(new Error("No se pudo cargar Mammoth")); };
      document.head.appendChild(s);
    });
  }
  function ensureXLSX() {
    if (typeof XLSX !== "undefined") return Promise.resolve();
    return new Promise(function(res, rej){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = res; s.onerror = function(){ rej(new Error("No se pudo cargar SheetJS")); };
      document.head.appendChild(s);
    });
  }

  async function leerArchivo(file) {
    var n = file.name.toLowerCase();
    if (n.endsWith(".txt")) return await file.text();
    if (n.endsWith(".docx")) {
      await ensureMammoth();
      var buf = await file.arrayBuffer();
      var r = await mammoth.extractRawText({ arrayBuffer: buf });
      return r.value || "";
    }
    if (n.endsWith(".xlsx") || n.endsWith(".xls")) {
      await ensureXLSX();
      var data = await file.arrayBuffer();
      var wb = XLSX.read(data, { type: "array" });
      var out = [];
      wb.SheetNames.forEach(function(name){
        var sheet = wb.Sheets[name];
        var rows = XLSX.utils.sheet_to_json(sheet, { defval: "", header: 1 });
        if (rows.length) out.push("== " + name + " ==");
        rows.forEach(function(r){
          var line = r.map(function(c){ return String(c || "").trim(); }).filter(Boolean).join(" — ");
          if (line) out.push(line);
        });
      });
      return out.join("\n");
    }
    throw new Error("Formato no soportado: usa .txt, .docx o .xlsx");
  }

  // ─── Render tabla ───
  function renderTable() {
    var all = getAll();
    var t = document.getElementById("sx-table");
    if (!t) return;
    var thead = '<thead><tr>' +
      '<th>Cédula</th><th>Script activo</th><th>Versión</th><th>Última actualización</th><th>Estado</th><th style="text-align:right">Acciones</th>' +
      '</tr></thead>';
    var rows = CEDULAS.map(function(c){
      var reg = all[c.id];
      var current = reg && reg.versiones && reg.versiones.filter(function(v){ return v.current; })[0];
      var nombre, ver, fecha, badge;
      if (current) {
        nombre = current.nombre || "—";
        ver = '<span class="sx-version">v' + current.v + '</span>';
        fecha = new Date(current.fecha).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
        badge = current.activo === false
          ? '<span class="sx-badge inactivo">Inactivo</span>'
          : '<span class="sx-badge activo">Activo</span>';
      } else {
        nombre = '<span style="color:var(--gray-400);font-style:italic">Sin script configurado</span>';
        ver = '<span class="sx-version" style="color:var(--gray-400)">—</span>';
        fecha = '—';
        badge = '<span class="sx-badge sin">Sin script</span>';
      }
      return '<tr>' +
        '<td><div class="cedula-name">' + escapeHtml(c.label) + '</div><div class="cedula-area">' + escapeHtml(c.area) + '</div></td>' +
        '<td>' + nombre + '</td>' +
        '<td>' + ver + '</td>' +
        '<td>' + fecha + '</td>' +
        '<td>' + badge + '</td>' +
        '<td><div class="actions">' +
          (current ? '<button class="btn-mini" data-act="ver" data-id="' + c.id + '">👁 Ver</button>' : '') +
          '<button class="btn-mini primary" data-act="editar" data-id="' + c.id + '">' + (current ? '✎ Editar' : '+ Configurar') + '</button>' +
          (current ? '<button class="btn-mini" data-act="historial" data-id="' + c.id + '">🕘 Historial</button>' : '') +
        '</div></td>' +
      '</tr>';
    }).join('');
    t.innerHTML = thead + '<tbody>' + rows + '</tbody>';

    // Bind acciones
    t.querySelectorAll('button[data-act]').forEach(function(b){
      b.addEventListener('click', function(){
        var act = b.getAttribute('data-act');
        var id = b.getAttribute('data-id');
        if (act === 'ver') abrirPreview(id);
        else if (act === 'editar') abrirEditor(id);
        else if (act === 'historial') abrirHistorial(id);
      });
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ─── Editor ───
  function abrirEditor(cedulaId) {
    editandoId = cedulaId;
    var c = CEDULAS.filter(function(x){ return x.id === cedulaId; })[0];
    document.getElementById("sx-editor").classList.add("active");
    document.getElementById("sx-editor-title").textContent = c.label;
    document.getElementById("sx-editor-sub").textContent = c.area + " · cédula " + cedulaId;

    var current = getActivo(cedulaId) || (getVersiones(cedulaId)[0] || null);
    document.getElementById("sx-content").value = current ? (current.contenido || "") : "";
    document.getElementById("sx-name").value = current ? (current.nombre || "") : (c.label + " · Script v1");
    document.getElementById("sx-save-status").textContent = "";
    document.getElementById("sx-save-status").className = "sx-status";
    actualizarPreview();
    // Scroll to editor
    document.getElementById("sx-editor").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function actualizarPreview() {
    var texto = document.getElementById("sx-content").value;
    var secs = detectarSecciones(texto);
    var box = document.getElementById("sx-preview-box");
    var c = CEDULAS.filter(function(x){ return x.id === editandoId; })[0];
    var nombre = document.getElementById("sx-name").value || (c ? c.label : "");
    var current = editandoId ? getActivo(editandoId) : null;
    var estado = current ? (current.activo === false ? "Inactivo" : "Activo") : "Sin publicar";
    var version = current ? current.v : "—";

    if (!texto.trim()) {
      box.innerHTML = '<div style="color:var(--gray-400);text-align:center;padding:20px;font-size:13px">Pega o sube contenido para ver la previsualización estructurada.</div>';
      return;
    }
    var html = '<h4>' + escapeHtml(nombre) + '</h4>' +
      '<div class="meta"><strong>Cédula:</strong> ' + escapeHtml(c ? c.label : "") + ' · <strong>Versión:</strong> v' + version + ' · <strong>Estado:</strong> ' + estado + '</div>';
    if (secs.length) {
      html += secs.map(function(s){
        return '<div class="sect"><div class="sect-title">' + escapeHtml(s.titulo) + '</div><div class="sect-body">' + escapeHtml(s.texto) + '</div></div>';
      }).join('');
    } else {
      html += '<div class="sect"><div class="sect-body">' + escapeHtml(texto) + '</div></div>';
    }
    box.innerHTML = html;
  }

  function abrirPreview(cedulaId) {
    var v = getActivo(cedulaId) || getVersiones(cedulaId)[0];
    if (!v) return;
    var c = CEDULAS.filter(function(x){ return x.id === cedulaId; })[0];
    var box = document.getElementById("sx-modal-body");
    var secs = v.secciones && v.secciones.length ? v.secciones : detectarSecciones(v.contenido || "");
    var html = '<h4 style="margin:0 0 10px;font-size:15px;font-weight:700">' + escapeHtml(v.nombre || "Script") + '</h4>' +
      '<div style="font-size:12px;color:var(--gray-500);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-100)">' +
        '<strong>Cédula:</strong> ' + escapeHtml(c.label) + ' · <strong>Versión:</strong> v' + v.v +
        ' · <strong>Estado:</strong> ' + (v.activo === false ? "Inactivo" : "Activo") +
        ' · <strong>Autor:</strong> ' + escapeHtml(v.autor || "—") +
      '</div>';
    if (secs.length) {
      html += secs.map(function(s){
        return '<div style="margin-bottom:14px"><div style="font-size:12px;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;color:var(--green-dark);margin-bottom:6px">' +
          escapeHtml(s.titulo) + '</div><div style="font-size:13px;line-height:1.6;white-space:pre-wrap">' + escapeHtml(s.texto) + '</div></div>';
      }).join('');
    } else {
      html += '<div style="font-size:13px;line-height:1.6;white-space:pre-wrap">' + escapeHtml(v.contenido || "") + '</div>';
    }
    document.getElementById("sx-modal-title").textContent = "Previsualización";
    box.innerHTML = html;
    document.getElementById("sx-modal").classList.add("active");
    document.getElementById("sx-modal-back").classList.add("active");
  }

  function abrirHistorial(cedulaId) {
    var vs = getVersiones(cedulaId);
    var box = document.getElementById("sx-modal-body");
    if (!vs.length) {
      box.innerHTML = '<div style="color:var(--gray-500);text-align:center;padding:20px">Sin versiones registradas.</div>';
    } else {
      box.innerHTML = '<div class="sx-history">' + vs.map(function(v){
        var fecha = new Date(v.fecha).toLocaleString("es-MX", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        return '<div class="item">' +
          '<div><span class="v-lbl">v' + v.v + '</span>' + escapeHtml(v.nombre || "—") +
            (v.current ? '<span class="current">actual</span>' : '') +
            (v.activo === false ? '<span class="current" style="color:var(--gray-400)">inactivo</span>' : '') +
          '</div>' +
          '<div class="meta">' + escapeHtml(v.autor || "—") + ' · ' + fecha + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    document.getElementById("sx-modal-title").textContent = "Historial de versiones";
    document.getElementById("sx-modal").classList.add("active");
    document.getElementById("sx-modal-back").classList.add("active");
  }

  // ─── Bindings ───
  function bind() {
    // Tabs internas
    document.querySelectorAll(".view-scripts .sx-tabs button").forEach(function(b){
      b.addEventListener("click", function(){
        var t = b.getAttribute("data-tab");
        document.querySelectorAll(".view-scripts .sx-tabs button").forEach(function(x){ x.classList.toggle("active", x === b); });
        document.querySelectorAll(".view-scripts .sx-tabpanel").forEach(function(p){
          p.classList.toggle("active", p.getAttribute("data-panel") === t);
        });
        if (t === "preview") actualizarPreview();
      });
    });

    document.getElementById("sx-content").addEventListener("input", actualizarPreview);
    document.getElementById("sx-name").addEventListener("input", actualizarPreview);

    // Drop zone
    var drop = document.getElementById("sx-drop");
    var file = document.getElementById("sx-file");
    drop.addEventListener("click", function(){ file.click(); });
    drop.addEventListener("dragover", function(e){ e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", function(){ drop.classList.remove("drag"); });
    drop.addEventListener("drop", function(e){
      e.preventDefault(); drop.classList.remove("drag");
      var f = e.dataTransfer.files[0]; if (f) handleFile(f);
    });
    file.addEventListener("change", function(){ if (file.files[0]) handleFile(file.files[0]); });

    async function handleFile(f) {
      var st = document.getElementById("sx-file-status");
      st.textContent = "Leyendo archivo…"; st.className = "sx-status";
      try {
        var texto = await leerArchivo(f);
        if (!texto.trim()) throw new Error("El archivo está vacío o no tiene texto legible");
        document.getElementById("sx-content").value = texto.trim();
        // Cambiar a la pestaña Pegar contenido
        document.querySelector(".view-scripts .sx-tabs button[data-tab='paste']").click();
        st.textContent = "✓ Cargado: " + f.name + " (" + texto.length + " caracteres). Revisa el contenido y guarda como nueva versión.";
        st.className = "sx-status ok";
        actualizarPreview();
      } catch(e) {
        st.textContent = "✕ " + e.message; st.className = "sx-status err";
      }
      file.value = "";
    }

    document.getElementById("sx-save").addEventListener("click", function(){
      if (!editandoId) return;
      var texto = document.getElementById("sx-content").value.trim();
      if (!texto) {
        var st = document.getElementById("sx-save-status");
        st.textContent = "✕ El contenido está vacío"; st.className = "sx-status err";
        return;
      }
      var nombre = document.getElementById("sx-name").value.trim();
      var secs = detectarSecciones(texto);
      var vNueva = guardarVersionNueva(editandoId, texto, secs.length ? secs : null, nombre, null);
      var st = document.getElementById("sx-save-status");
      st.textContent = "✓ Guardado como v" + vNueva + " y marcado como activo. Evaluador y Batch ya lo usarán automáticamente.";
      st.className = "sx-status ok";
      renderTable();
    });

    document.getElementById("sx-toggle-active").addEventListener("click", function(){
      if (!editandoId) return;
      toggleActivo(editandoId);
      var st = document.getElementById("sx-save-status");
      var c = getActivo(editandoId);
      var v = getVersiones(editandoId)[0];
      st.textContent = "✓ Estado: " + (v && v.activo !== false ? "Activo" : "Inactivo");
      st.className = "sx-status ok";
      renderTable();
    });

    document.getElementById("sx-history-open").addEventListener("click", function(){
      if (editandoId) abrirHistorial(editandoId);
    });

    document.getElementById("sx-cancel").addEventListener("click", function(){
      editandoId = null;
      document.getElementById("sx-editor").classList.remove("active");
    });

    document.getElementById("sx-modal-back").addEventListener("click", function(){
      document.getElementById("sx-modal").classList.remove("active");
      document.getElementById("sx-modal-back").classList.remove("active");
    });
  }

  bind();
  renderTable();
})();
</script>

</template>

  function getSession() {

  }

  function renderUserPill() {
