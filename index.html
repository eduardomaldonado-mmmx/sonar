  // Claves de localStorage que SÍ se sincronizan al backend compartido.
  // Todo lo demás (cachés de IA, mensajes de Slack ya copiados, etc.)
  // se queda local a propósito: son datos regenerables, no registros.
  var SYNC_EXACT = {
    "sonar_seguimiento_evaluaciones": { type: "array", idField: "id" },
    "sonar_coachings_registrados":    { type: "array", idField: "id" },
    "coaching_planes_accion":         { type: "array", idField: "id" },
    "coaching_siguientes_sesiones":   { type: "array", idField: "id" },
    "sonar_staff_cargado":            { type: "lww" },
    "sonar_script_personalizado":     { type: "object", dateField: "cargado_en" }
  };
  var SYNC_PREFIX = "sonar_editor_"; // sonar_editor_credito_BASE, sonar_editor_cobranza_m30, etc.
  var SYNC_PREFIX_CFG = { type: "nested-array", path: "versiones", idField: "v" };

  var _pushQueue = {};   // key -> timeout handle, para debouncing
  var _syncLog = [];
  var _lastSyncOk = false;
  var currentView = null;
  var _origAddEL = document.addEventListener.bind(document);
  document.addEventListener = function(evt, cb, opts) {
    if (evt === 'DOMContentLoaded') {
      if (currentView !== null) {
        setTimeout(function(){ try { cb.call(document, new Event('DOMContentLoaded')); } catch(e){ console.error(e); } }, 0);
        return;
      }
    }
    return _origAddEL(evt, cb, opts);
  };

  // ─────────────────────────────────────────────────────────
  // SYNC: interceptar localStorage.setItem para las claves que
  // comparten datos entre supervisores. El resto de localStorage
  // sigue funcionando exactamente igual que siempre.
  // ─────────────────────────────────────────────────────────
  var _origSetItem = Storage.prototype.setItem.bind(localStorage);
  var _origGetItem = Storage.prototype.getItem.bind(localStorage);

  function matchSyncConfig(key) {
    if (SYNC_EXACT[key]) return SYNC_EXACT[key];
    if (key.indexOf(SYNC_PREFIX) === 0) return SYNC_PREFIX_CFG;
    return null;
  }

  function backendConfigured() {
    return !!(getBackendUrl() && getBackendToken());
  }
  function getBackendUrl() { return (_origGetItem(CFG_BACKEND_URL) || "").trim(); }
  function getBackendToken() { return (_origGetItem(CFG_BACKEND_TOKEN) || "").trim(); }
  function getMyName() { return (_origGetItem(CFG_BACKEND_MYNAME) || "").trim() || "SONAR-web"; }

  function logSync(msg) {
    var ts = new Date().toLocaleTimeString("es-MX");
    _syncLog.unshift("[" + ts + "] " + msg);
    _syncLog = _syncLog.slice(0, 30);
    var el = document.getElementById("cfg-backend-log");
    if (el) {
      el.style.display = "block";
      el.innerHTML = _syncLog.map(function(l){ return "<div>" + l + "</div>"; }).join("");
    }
    console.log("[SONAR sync]", msg);
  }

  function setSyncPill(state, label) {
    var pill = document.getElementById("sonar-sync-pill");
    var lbl = document.getElementById("sonar-sync-label");
    if (!pill || !lbl) return;
    pill.className = "sonar-sync-pill" + (state ? " " + state : "");
    lbl.textContent = label;
  }

  // Storage.prototype.setItem override: para las claves sincronizadas,
  // además de escribir local, guardamos un timestamp propio y encolamos
  // un push al backend (con debounce, para no mandar 1 request por letra
  // si algo escribe seguido).
  Storage.prototype.setItem = function (key, value) {
    _origSetItem(key, value);
    if (this !== localStorage) return;
    var cfg = matchSyncConfig(key);
    if (!cfg) return;
    var ts = Date.now();
    _origSetItem(key + "__ts", String(ts));
    if (!backendConfigured()) return;
    schedulePush(key, cfg, ts);
  };

  function schedulePush(key, cfg, ts) {
    if (_pushQueue[key]) clearTimeout(_pushQueue[key]);
    _pushQueue[key] = setTimeout(function () {
      delete _pushQueue[key];
      pushOne(key, ts);
    }, 900);
  }

  function pushOne(key, ts) {
    var raw = _origGetItem(key);
    var value;
    try { value = JSON.parse(raw); } catch (e) { value = raw; }
    setSyncPill("syncing", "Guardando…");
    fetchPost({ items: [{ key: key, value: value, updated_at: ts }] })
      .then(function (res) {
        if (res && res.ok) {
          logSync("↑ Enviado: " + key);
          setSyncPill("ok", "Sincronizado");
          _lastSyncOk = true;
        } else {
          logSync("✗ Error al enviar " + key + ": " + (res && res.error));
          setSyncPill("err", "Error de sync");
        }
      })
      .catch(function (err) {
        logSync("✗ Sin conexión al backend (" + key + "): " + err.message);
        setSyncPill("err", "Sin conexión");
      });
  }

  function fetchPost(body) {
    body.token = getBackendToken();
    body.updated_by = getMyName();
    return fetch(getBackendUrl(), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita preflight CORS
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function fetchGet(action) {
    var url = getBackendUrl() + "?action=" + action + "&token=" + encodeURIComponent(getBackendToken());
    return fetch(url).then(function (r) { return r.json(); });
  }

  // ── Estrategias de fusión (merge) ──────────────────────────
  function mergeArrayById(localArr, remoteArr, idField) {
    localArr = Array.isArray(localArr) ? localArr : [];
    remoteArr = Array.isArray(remoteArr) ? remoteArr : [];
    var map = {};
    remoteArr.forEach(function (it) { if (it && it[idField] != null) map[it[idField]] = it; });
    localArr.forEach(function (it) { if (it && it[idField] != null) map[it[idField]] = it; });
    var merged = [];
    Object.keys(map).forEach(function (k) { merged.push(map[k]); });
    return merged;
  }

  function mergeObjectByDate(localObj, remoteObj, dateField) {
    localObj = localObj || {}; remoteObj = remoteObj || {};
    var out = {};
    var keys = {};
    Object.keys(remoteObj).forEach(function (k) { keys[k] = 1; });
    Object.keys(localObj).forEach(function (k) { keys[k] = 1; });
    Object.keys(keys).forEach(function (k) {
      var a = remoteObj[k], b = localObj[k];
      if (a === undefined) { out[k] = b; return; }
      if (b === undefined) { out[k] = a; return; }
      var ad = (a && a[dateField]) || "";
      var bd = (b && b[dateField]) || "";
      out[k] = (bd > ad) ? b : a;
    });
    return out;
  }

  function mergeNestedArray(localObj, remoteObj, path, idField) {
    var localArr = (localObj && localObj[path]) || [];
    var remoteArr = (remoteObj && remoteObj[path]) || [];
    var merged = mergeArrayById(localArr, remoteArr, idField);
    merged.sort(function (a, b) { return (b[idField] || 0) - (a[idField] || 0); });
    merged.forEach(function (v, i) { v.current = (i === 0); });
    merged = merged.slice(0, 5);
    return { versiones: merged };
  }

  function mergeValue(cfg, localVal, remoteVal, localTs, remoteTs) {
    if (cfg.type === "array") return mergeArrayById(localVal, remoteVal, cfg.idField);
    if (cfg.type === "nested-array") return mergeNestedArray(localVal, remoteVal, cfg.path, cfg.idField);
    if (cfg.type === "object") return mergeObjectByDate(localVal, remoteVal, cfg.dateField);
    // lww: el que tenga timestamp más reciente gana
    if (remoteVal === undefined || remoteVal === null) return localVal;
    if (localVal === undefined || localVal === null) return remoteVal;
    return (remoteTs || 0) > (localTs || 0) ? remoteVal : localVal;
  }

  // ── Pull + merge al arrancar ────────────────────────────────
  function pullAndMerge() {
    if (!backendConfigured()) return Promise.resolve({ skipped: true });
    setSyncPill("syncing", "Sincronizando…");
    return fetchGet("pull").then(function (res) {
      if (!res || !res.ok) {
        logSync("✗ Pull falló: " + (res && res.error));
        setSyncPill("err", "Error de sync");
        return { ok: false };
      }
      var remoteData = res.data || {};
      var changedKeys = 0;

      Object.keys(remoteData).forEach(function (key) {
        var cfg = matchSyncConfig(key);
        if (!cfg) return; // el backend puede tener claves de otras versiones; ignoramos lo que no reconocemos
        var remoteEntry = remoteData[key];
        var remoteVal = remoteEntry.value;
        var remoteTs = remoteEntry.updated_at || 0;

        var localRaw = _origGetItem(key);
        var localVal = null;
        try { localVal = localRaw ? JSON.parse(localRaw) : null; } catch (e) {}
        var localTs = parseInt(_origGetItem(key + "__ts") || "0", 10);

        var merged = mergeValue(cfg, localVal, remoteVal, localTs, remoteTs);
        var mergedStr = JSON.stringify(merged);

        if (mergedStr !== localRaw) {
          _origSetItem(key, mergedStr);
          _origSetItem(key + "__ts", String(Date.now()));
          changedKeys++;
        }
      });

      // También revisamos claves locales que el backend todavía no conoce
      // (ej. la primera vez que este navegador sincroniza)
      var toPushInitial = [];
      Object.keys(SYNC_EXACT).forEach(function (key) {
        if (!remoteData[key]) {
          var raw = _origGetItem(key);
          if (raw) {
            var val; try { val = JSON.parse(raw); } catch (e) { val = null; }
            if (val) toPushInitial.push({ key: key, value: val, updated_at: Date.now() });
          }
        }
      });
      // Y las claves dinámicas del editor (sonar_editor_*) presentes localmente
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(SYNC_PREFIX) === 0 && k.indexOf("__ts") === -1 && !remoteData[k]) {
          var rawE = _origGetItem(k);
          if (rawE) {
            var valE; try { valE = JSON.parse(rawE); } catch (e) { valE = null; }
            if (valE) toPushInitial.push({ key: k, value: valE, updated_at: Date.now() });
          }
        }
      }

      var donePromise = Promise.resolve();
      if (toPushInitial.length) {
        donePromise = fetchPost({ items: toPushInitial }).then(function () {
          logSync("↑ Primeras claves subidas al backend: " + toPushInitial.length);
        });
      }

      return donePromise.then(function () {
        logSync("✓ Sincronizado · " + changedKeys + " clave(s) actualizada(s) localmente");
        setSyncPill("ok", "Sincronizado");
        _lastSyncOk = true;
        return { ok: true, changedKeys: changedKeys };
      });
    }).catch(function (err) {
      logSync("✗ Sin conexión al backend: " + err.message);
      setSyncPill("err", "Sin conexión");
      return { ok: false, error: err.message };
    });
  }

  function showSyncOverlay(text) {
    var ov = document.getElementById("sonar-sync-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "sonar-sync-overlay";
      ov.className = "sonar-sync-overlay";
      ov.innerHTML = '<div class="spin"></div><div class="txt" id="sonar-sync-overlay-txt"></div>';
      document.body.appendChild(ov);
    }
    document.getElementById("sonar-sync-overlay-txt").textContent = text;
    ov.style.display = "flex";
  }
  function hideSyncOverlay() {
    var ov = document.getElementById("sonar-sync-overlay");
    if (ov) ov.style.display = "none";
  }
  function switchView(name) {
    if (currentView === name) return;
    var container = document.getElementById('sonar-view-container');
    if (!container) return;
    container.innerHTML = '';
    var tpl = document.getElementById('tpl-' + name);
    if (!tpl) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:#999">Vista no encontrada: ' + name + '</div>';
      return;
    }
    var clone = tpl.content ? tpl.content.cloneNode(true) : tpl.cloneNode(true);
    var scopeWrapper = document.createElement('div');
    scopeWrapper.className = 'view-' + name;
    scopeWrapper.appendChild(clone);
    container.appendChild(scopeWrapper);
    var scripts = container.querySelectorAll('script');
    scripts.forEach(function(oldScript){
      var newScript = document.createElement('script');
      if (oldScript.src) newScript.src = oldScript.src;
      else newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
    document.querySelectorAll('.sonar-tab').forEach(function(t){
      t.classList.toggle('active', t.getAttribute('data-view') === name);
    });
    // El editor no tiene tab visible en el header; si estamos en editor marcamos config como activa
    if (name === 'editor' || name === 'scripts') {
      var cfgTab = document.querySelector('.sonar-tab[data-view="config"]');
      if (cfgTab) cfgTab.classList.add('active');
    }
    currentView = name;
    if (name === 'config') loadConfigView();
    try { localStorage.setItem('sonar_active_tab', name); } catch(e){}
    window.scrollTo(0, 0);
  }
  function loadConfigView() {
    var ak = localStorage.getItem(CFG_ANTHROPIC) || '';
    var sk = localStorage.getItem(CFG_ASSEMBLYAI) || '';
    var ai = document.getElementById('cfg-anthropic-key');
    var si = document.getElementById('cfg-assemblyai-key');
    if (ai) ai.value = ak;
    if (si) si.value = sk;
    setStatus('anthropic', ak);
    setStatus('assemblyai', sk);
    renderStorageStats();

    // Campos del backend
    var bu = document.getElementById('cfg-backend-url');
    var bt = document.getElementById('cfg-backend-token');
    var bn = document.getElementById('cfg-backend-myname');
    if (bu) bu.value = getBackendUrl();
    if (bt) bt.value = getBackendToken();
    if (bn) bn.value = getMyName() === 'SONAR-web' ? '' : getMyName();
    setBackendStatus();
    var logEl = document.getElementById('cfg-backend-log');
    if (logEl && _syncLog.length) {
      logEl.style.display = 'block';
      logEl.innerHTML = _syncLog.map(function(l){ return '<div>' + l + '</div>'; }).join('');
    }
  }

  function setBackendStatus() {
    var el = document.getElementById('cfg-backend-status');
    if (!el) return;
    if (!backendConfigured()) {
      el.className = 'cfg-status warn';
      el.innerHTML = '\u26a0 Sin backend configurado. SONAR funciona solo con datos locales de este navegador (como antes).';
    } else if (_lastSyncOk) {
      el.className = 'cfg-status ok';
      el.innerHTML = '\u2713 Backend configurado y sincronizando correctamente.';
    } else {
      el.className = 'cfg-status warn';
      el.innerHTML = '\u26a0 Backend configurado pero a\u00fan no se ha confirmado conexi\u00f3n. Da clic en "Probar conexi\u00f3n".';
    }
  }

  function saveBackendConfig() {
    var bu = (document.getElementById('cfg-backend-url')?.value || '').trim();
    var bt = (document.getElementById('cfg-backend-token')?.value || '').trim();
    var bn = (document.getElementById('cfg-backend-myname')?.value || '').trim();
    if (bu) _origSetItem(CFG_BACKEND_URL, bu); else _origSetItem(CFG_BACKEND_URL, '');
    if (bt) _origSetItem(CFG_BACKEND_TOKEN, bt); else _origSetItem(CFG_BACKEND_TOKEN, '');
    if (bn) _origSetItem(CFG_BACKEND_MYNAME, bn); else _origSetItem(CFG_BACKEND_MYNAME, '');
    setBackendStatus();
    var btn = event && event.target;
    if (btn) { var orig = btn.textContent; btn.textContent = '\u2713 Guardado'; setTimeout(function(){ btn.textContent = orig; }, 1500); }
    if (backendConfigured()) {
      logSync('Configuraci\u00f3n guardada. Prueba la conexi\u00f3n o sincroniza ahora.');
    }
  }

  function testBackendConnection() {
    if (!backendConfigured()) {
      alert('Primero pega la URL y la palabra clave, y da clic en "Guardar y conectar".');
      return;
    }
    setSyncPill('syncing', 'Probando…');
    logSync('Probando conexi\u00f3n...');
    fetchGet('ping').then(function(res){
      if (res && res.ok) {
        logSync('\u2713 Conexi\u00f3n exitosa: ' + res.message);
        setSyncPill('ok', 'Conectado');
        _lastSyncOk = true;
        setBackendStatus();
        alert('\u2713 Conexi\u00f3n exitosa con el backend.');
      } else {
        logSync('\u2717 El backend respondi\u00f3 pero con error: ' + (res && res.error));
        setSyncPill('err', 'Error');
        alert('El backend respondi\u00f3 pero con error: ' + (res && res.error) + '\n\n\u00bfLa palabra clave coincide con el SHARED_SECRET del archivo .gs?');
      }
    }).catch(function(err){
      logSync('\u2717 No se pudo conectar: ' + err.message);
      setSyncPill('err', 'Sin conexi\u00f3n');
      alert('No se pudo conectar al backend.\n\n' + err.message + '\n\n\u00bfLa URL termina en /exec? \u00bfLo desplegaste con acceso "Cualquier persona"?');
    });
  }

  function forceSyncNow() {
    if (!backendConfigured()) {
      alert('Configura el backend primero.');
      return;
    }
    pullAndMerge().then(function(res){
      setBackendStatus();
      if (res && res.ok) {
        alert('\u2713 Sincronizado. Si tienes otra pesta\u00f1a abierta (Evaluar, Lote, Coaching), cambia de pesta\u00f1a y vuelve para ver los datos actualizados.');
      }
    });
  }
  function setStatus(kind, val) {
    var el = document.getElementById('cfg-' + kind + '-status'); if (!el) return;
    if (!val) { el.className = 'cfg-status warn'; el.innerHTML = '\u26a0 Sin configurar.'; }
    else { el.className = 'cfg-status ok'; el.innerHTML = '\u2713 Configurada (termina en <code style="font-family:monospace;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:3px">...' + val.slice(-6) + '</code>)'; }
  }
  function saveKey(kind) {
    var input = document.getElementById('cfg-' + kind + '-key'); if (!input) return;
    var v = input.value.trim();
    var storageKey = kind === 'anthropic' ? CFG_ANTHROPIC : CFG_ASSEMBLYAI;
    if (v) localStorage.setItem(storageKey, v); else localStorage.removeItem(storageKey);
    setStatus(kind, v);
    var btn = event && event.target;
    if (btn) { var orig = btn.textContent; btn.textContent = '\u2713 Guardada'; setTimeout(function(){ btn.textContent = orig; }, 1500); }
  }
  function toggleReveal(id) { var el = document.getElementById(id); if (el) el.type = el.type === 'password' ? 'text' : 'password'; }
  function renderStorageStats() {
    var keys = [
      { k: 'sonar_seguimiento_evaluaciones', label: 'Evaluaciones guardadas' },
      { k: 'sonar_coachings_registrados',    label: 'Sesiones de coaching' },
      { k: 'coaching_planes_accion',         label: 'Planes de acci\u00f3n' },
      { k: 'coaching_siguientes_sesiones',   label: 'Sesiones programadas' },
      { k: 'sonar_staff_cargado',            label: 'Staff cargado' },
      { k: 'sonar_script_personalizado',     label: 'Scripts personalizados (Evaluador)' }
    ];
    var lines = [];
    keys.forEach(function(item){
      var raw = localStorage.getItem(item.k); var count = 0;
      if (raw) { try { var parsed = JSON.parse(raw); if (Array.isArray(parsed)) count = parsed.length; else if (typeof parsed === 'object' && parsed) count = Object.keys(parsed).length; } catch(e){} }
      lines.push('<div>\u2022 ' + item.label + ': <strong>' + count + '</strong></div>');
    });
    var el = document.getElementById('cfg-storage-stats'); if (el) el.innerHTML = lines.join('');
  }
  function resetAllData() {
    if (!confirm('\u00bfBorrar TODOS los datos de SONAR?\n\nLas API keys NO se borran. Esta acci\u00f3n es irreversible.')) return;
    if (!confirm('\u00daltima confirmaci\u00f3n. \u00bfEst\u00e1s seguro?')) return;
    ['sonar_seguimiento_evaluaciones', 'sonar_coachings_registrados','coaching_planes_accion', 'coaching_siguientes_sesiones','sonar_staff_cargado', 'sonar_script_personalizado','sonar_recomendaciones_ia_cache', 'sonar_mensajes_slack_enviados','coaching_canal_activo'].forEach(function(k){ localStorage.removeItem(k); });
    alert('\u2713 Datos borrados. Recargando...'); location.reload();
  }
  function init() {
    document.querySelectorAll('.sonar-tab').forEach(function(btn){ btn.addEventListener('click', function(){ switchView(btn.getAttribute('data-view')); }); });

    var session = getSession();
    if (!session) {
      showLoginGate(proceedAfterLogin);
      return;
    }
    renderUserPill();
    proceedAfterLogin();
  }

  function proceedAfterLogin() {
    var initial = localStorage.getItem('sonar_active_tab') || 'evaluador';
    // Si el usuario había quedado en 'editor', llevarlo a config primero para que decida abrirlo
    if (initial === 'editor' || initial === 'scripts') initial = 'config';

    if (!backendConfigured()) {
      // Sin backend: comportamiento idéntico al de antes, sin fricción.
      setSyncPill('', 'Sin backend');
      switchView(initial);
      return;
    }

    // Con backend: sincronizar ANTES de mostrar cualquier vista, para que
    // Evaluar/Lote/Coaching arranquen ya con los datos mezclados.
    showSyncOverlay('Sincronizando con el equipo…');
    var fallback = setTimeout(function () {
      // Si el backend tarda más de 6s (red lenta, Apps Script dormido), no
      // bloqueamos al usuario indefinidamente — seguimos con lo local.
      hideSyncOverlay();
      switchView(initial);
    }, 6000);

    pullAndMerge().then(function () {
      clearTimeout(fallback);
      hideSyncOverlay();
      switchView(initial);
    }).catch(function () {
      clearTimeout(fallback);
      hideSyncOverlay();
      switchView(initial);
    });
  }
  if (document.readyState === 'loading') _origAddEL('DOMContentLoaded', init); else init();
  return {
    switchView: switchView, saveKey: saveKey, toggleReveal: toggleReveal, resetAllData: resetAllData,
    saveBackendConfig: saveBackendConfig, testBackendConnection: testBackendConnection, forceSyncNow: forceSyncNow,
    getSession: getSession, logout: logout
  };
})();
</script>
