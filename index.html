  if (enEjecutiva) {
    ejecutiva.style.display = "none";
    individual.style.display = "block";
    btn.textContent = "📊 Vista Ejecutiva";
  } else {
    ejecutiva.style.display = "block";
    individual.style.display = "none";
    btn.textContent = "👥 Vista por Asesor";
    cambiarSubvistaEjecutiva(subvistaEjecutivaActual);
  }
}

function cambiarSubvistaEjecutiva(sub) {
  subvistaEjecutivaActual = sub;
  const panelTendencia = document.getElementById("ej-panel-tendencia");
  const panelKpis = document.getElementById("ej-panel-kpis");
  const btnTendencia = document.getElementById("btn-ej-tendencia");
  const btnKpis = document.getElementById("btn-ej-kpis");
  if (sub === "kpis") {
    panelTendencia.style.display = "none";
    panelKpis.style.display = "block";
    btnTendencia.classList.remove("active");
    btnKpis.classList.add("active");
    if (!kpiAreaActual) kpiAreaActual = areaConMasEvaluaciones();
    seleccionarAreaKPI(kpiAreaActual);
  } else {
    panelKpis.style.display = "none";
    panelTendencia.style.display = "block";
    btnKpis.classList.remove("active");
    btnTendencia.classList.add("active");
    renderVistaEjecutiva();
  }
}

let chartEjecutivo = null;

function renderVistaEjecutiva() {
  const { semanas, porSemana } = calcularTendenciaEjecutiva();
  const kpiGlobal = document.getElementById("ejecutiva-kpi-global");
  const kpiAreas = document.getElementById("ejecutiva-kpi-areas");
  const emptyState = document.getElementById("ejecutiva-empty");
  const chartWrap = document.getElementById("chart-ejecutivo")?.parentElement;

  if (semanas.length === 0) {
    if (emptyState) emptyState.style.display = "block";
    if (chartWrap) chartWrap.style.display = "none";
    kpiGlobal.innerHTML = "";
    kpiAreas.innerHTML = "";
    return;
  }
  if (emptyState) emptyState.style.display = "none";
  if (chartWrap) chartWrap.style.display = "block";

  const semanaActual = semanas[semanas.length - 1];
  const semanaAnterior = semanas.length >= 2 ? semanas[semanas.length - 2] : null;

  // ── KPI global de la compañía ──
  const promActual = promedioGlobalSemana(porSemana, semanaActual);
  const promAnterior = semanaAnterior ? promedioGlobalSemana(porSemana, semanaAnterior) : null;
  const deltaGlobal = (promActual != null && promAnterior != null) ? promActual - promAnterior : null;
  const pctGlobal = (deltaGlobal != null && promAnterior) ? (deltaGlobal / promAnterior * 100) : null;

  const colorDelta = d => d == null ? "var(--gray-500)" : d >= 0 ? "var(--green-dark)" : "#b02020";
  const iconoDelta = d => d == null ? "→" : d > 0.05 ? "↑" : d < -0.05 ? "↓" : "→";

  kpiGlobal.innerHTML = `
    <div style="background:linear-gradient(135deg,var(--green-bg),var(--white));border:1.5px solid var(--green-border);border-radius:14px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
      <div>
        <div style="font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px">Calidad general · semana del ${labelSemana(semanaActual)}</div>
        <div style="font-size:42px;font-weight:800;color:var(--gray-900);line-height:1">${promActual != null ? promActual.toFixed(1) : "—"}<span style="font-size:20px;color:var(--gray-500)">/10</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:26px;font-weight:800;color:${colorDelta(deltaGlobal)}">${iconoDelta(deltaGlobal)} ${pctGlobal != null ? Math.abs(pctGlobal).toFixed(1) + "%" : "—"}</div>
        <div style="font-size:11px;color:var(--gray-500)">${semanaAnterior ? "vs. semana del " + labelSemana(semanaAnterior) : "sin semana previa para comparar"}</div>
      </div>
    </div>
  `;

  // ── KPIs por área ──
  const areasInfo = [
    { key: "credito", label: "Validación de Crédito", icon: "📋", color: "morado" },
    { key: "cobranza", label: "Cobranza", icon: "📞", color: "verde" },
    { key: "ventas", label: "Ventas Digital", icon: "💰", color: "dorado" }
  ];
  kpiAreas.innerHTML = areasInfo.map(a => {
    const actual = promedio(porSemana[semanaActual][a.key]);
    const anterior = semanaAnterior ? promedio(porSemana[semanaAnterior][a.key]) : null;
    const delta = (actual != null && anterior != null) ? actual - anterior : null;
    const pct = (delta != null && anterior) ? (delta / anterior * 100) : null;
    const nEvals = porSemana[semanaActual][a.key].length;
    return `
      <div class="kpi-card ${a.color}">
        <div class="kpi-label">${a.icon} ${a.label}</div>
        <div class="kpi-value">${actual != null ? actual.toFixed(1) : "—"}</div>
        <div class="kpi-sub" style="color:${colorDelta(delta)};font-weight:700">${iconoDelta(delta)} ${pct != null ? Math.abs(pct).toFixed(1) + "% vs. semana pasada" : "sin dato previo"}</div>
        <div class="kpi-sub" style="margin-top:2px">${nEvals} evaluaci${nEvals===1?"ón":"ones"} esta semana</div>
      </div>
    `;
  }).join("");

  // ── Gráfica de tendencia (últimas 8 semanas con datos) ──
  const ultimasSemanas = semanas.slice(-8);
  const ctx = document.getElementById("chart-ejecutivo");
  if (ctx && typeof Chart !== "undefined") {
    if (chartEjecutivo) chartEjecutivo.destroy();
    chartEjecutivo = new Chart(ctx, {
      type: "line",
      data: {
        labels: ultimasSemanas.map(labelSemana),
        datasets: [
          { label: "Crédito", data: ultimasSemanas.map(s => promedio(porSemana[s].credito)), borderColor: "#6366F1", backgroundColor: "#6366F115", tension: 0.3, spanGaps: true },
          { label: "Cobranza", data: ultimasSemanas.map(s => promedio(porSemana[s].cobranza)), borderColor: "#00C170", backgroundColor: "#00C17015", tension: 0.3, spanGaps: true },
          { label: "Ventas Digital", data: ultimasSemanas.map(s => promedio(porSemana[s].ventas)), borderColor: "#D4A017", backgroundColor: "#D4A01715", tension: 0.3, spanGaps: true }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } },
        scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } } }
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// KPIs DE CALIDAD — no el score total, sino cómo va cada criterio
// específico de la cédula (Sondeo, Manejo de objeciones, Apertura...)
// ═══════════════════════════════════════════════════════════════

function areaConMasEvaluaciones() {
  const evals = getEvaluaciones();
  const conteo = { credito: 0, cobranza: 0, ventas: 0 };
  evals.forEach(e => { conteo[areaNormalizada(e)]++; });
  const areas = Object.keys(conteo);
  areas.sort((a,b) => conteo[b] - conteo[a]);
  return conteo[areas[0]] > 0 ? areas[0] : "credito";
}

function calcularKPIsCalidad(area) {
  const evals = getEvaluaciones().filter(e => areaNormalizada(e) === area);
  const porCriterio = {}; // { "nombre del criterio": { seccion, valores: [puntajes] } }
  evals.forEach(e => {
    (e.criterios || []).forEach(c => {
      if (!c.criterio) return;
      const key = c.criterio;
      if (!porCriterio[key]) porCriterio[key] = { seccion: c.seccion || "General", valores: [] };
      if (c.puntaje != null && c.nivel) porCriterio[key].valores.push(c.puntaje);
    });
  });
  return Object.entries(porCriterio)
    .map(([nombre, data]) => ({
      nombre,
      seccion: data.seccion,
      promedio: promedio(data.valores),
      n: data.valores.length
    }))
    .filter(item => item.n > 0);
}

function seleccionarAreaKPI(area) {
  kpiAreaActual = area;
  document.querySelectorAll('[data-area-kpi]').forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-area-kpi") === area);
  });
  renderKPIsCalidad(area);
}

function renderKPIsCalidad(area) {
  const cont = document.getElementById("kpis-calidad-lista");
  if (!cont) return;
  const datos = calcularKPIsCalidad(area);

  if (datos.length === 0) {
    cont.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎯</div>
        <h3>Aún no hay evaluaciones de esta área</h3>
        <p>En cuanto haya evaluaciones guardadas para esta cédula, aquí aparecerá el desglose por criterio.</p>
      </div>`;
    return;
  }

  // Agrupar por sección (respeta el orden natural de la cédula), y dentro
  // de cada sección, ordenar del criterio más débil al más fuerte —
  // así lo primero que se ve es lo más urgente de atender.
  const porSeccion = {};
  datos.forEach(d => {
    if (!porSeccion[d.seccion]) porSeccion[d.seccion] = [];
    porSeccion[d.seccion].push(d);
  });
  Object.values(porSeccion).forEach(lista => lista.sort((a,b) => (a.promedio ?? 0) - (b.promedio ?? 0)));

  const colorDe = p => p == null ? "var(--gray-400)" : p >= 8 ? "var(--green-dark)" : p >= 6 ? "#b8860b" : "#b02020";

  cont.innerHTML = Object.entries(porSeccion).map(([seccion, items]) => `
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--morado);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">${escapeHTML(seccion)}</div>
      ${items.map(it => {
        const color = colorDe(it.promedio);
        const pct = it.promedio == null ? 0 : Math.min(100, it.promedio * 10);
        return `
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px">
            <span style="color:var(--text)">${escapeHTML(it.nombre)}</span>
            <span style="white-space:nowrap;margin-left:12px">
              <strong style="color:${color};font-size:15px">${it.promedio != null ? it.promedio.toFixed(1) : "—"}</strong>
              <span style="color:var(--muted);font-size:11px"> /10 · ${it.n} eval${it.n===1?"":"s"}</span>
            </span>
          </div>
          <div style="height:7px;background:var(--negro-b);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .4s"></div>
          </div>
        </div>`;
      }).join("")}
    </div>
  `).join("");
}

function renderKPIs(evals, asesores, fArea) {
  const grid = document.getElementById("kpi-grid");
  if (evals.length === 0) {
    if (fArea) {
      // Hay filtro de área activo pero sin evaluaciones para esa área
      const lblArea = fArea === "credito" ? "Validación de Crédito" : fArea === "cobranza" ? "Cobranza" : fArea === "ventas" ? "Ventas Nuevas" : fArea;
      grid.innerHTML = `<div class="kpi-card rojo" style="grid-column:1/-1;text-align:center;padding:20px">
        <div class="kpi-label">Filtro activo: ${escapeHTML(lblArea)}</div>
        <div class="kpi-value" style="font-size:18px">Sin evaluaciones para esta área</div>
        <div class="kpi-sub">Quita el filtro o cambia de área para ver datos</div>
      </div>`;
    } else {
      grid.innerHTML = '';
    }
    return;
  }
  const promedioGeneral = evals.reduce((s,e)=>s+(e.puntaje_total||0),0)/evals.length;
  const excelentes = evals.filter(e => (e.puntaje_total||0) >= 9).length;
  const criticos = evals.filter(e => (e.puntaje_total||0) < 4).length;
  const necesitan = asesores.filter(a => a.promedio < 7).length;

  // Etiqueta visible cuando hay filtro de área aplicado
  const lblArea = fArea === "credito" ? "Validación de Crédito" : fArea === "cobranza" ? "Cobranza" : fArea === "ventas" ? "Ventas Nuevas" : "";
  const headerArea = fArea ? `<div style="grid-column:1/-1;font-size:11px;color:#A5B4FC;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:-4px">▸ Mostrando solo: ${escapeHTML(lblArea)}</div>` : "";

  grid.innerHTML = headerArea + `
    <div class="kpi-card morado">
      <div class="kpi-label">Asesores</div>
      <div class="kpi-value">${asesores.length}</div>
      <div class="kpi-sub">${fArea ? 'En área seleccionada' : 'En seguimiento activo'}</div>
    </div>
    <div class="kpi-card azul">
      <div class="kpi-label">Evaluaciones</div>
      <div class="kpi-value">${evals.length}</div>
      <div class="kpi-sub">${fArea ? lblArea : 'Total registradas'}</div>
    </div>
    <div class="kpi-card ${promedioGeneral >= 7 ? 'verde' : promedioGeneral >= 4 ? 'dorado' : 'rojo'}">
      <div class="kpi-label">Promedio general</div>
      <div class="kpi-value">${promedioGeneral.toFixed(1)}</div>
      <div class="kpi-sub">${getPuntajeLabel(promedioGeneral)}</div>
    </div>
    <div class="kpi-card verde">
      <div class="kpi-label">Excelentes</div>
      <div class="kpi-value">${excelentes}</div>
      <div class="kpi-sub">${evals.length ? ((excelentes/evals.length)*100).toFixed(0) : 0}% del total</div>
    </div>
    <div class="kpi-card rojo">
      <div class="kpi-label">Necesitan coaching</div>
      <div class="kpi-value">${necesitan}</div>
      <div class="kpi-sub">Promedio < 7</div>
    </div>
  `;
}

function renderAsesores() {
  const evalsTodas = getEvaluaciones();
  let asesores = agruparPorAsesor(evalsTodas);

  // Filtros
  const fNombre = (document.getElementById("filtro-nombre")?.value || "").toLowerCase().trim();
  const fArea = document.getElementById("filtro-area")?.value || "";
  const fOrden = document.getElementById("filtro-orden")?.value || "promedio_desc";

  // Resaltar visualmente el filtro de área si está activo (es el que cambia los KPIs)
  const filtroAreaEl = document.getElementById("filtro-area");
  if (filtroAreaEl) {
    if (fArea) filtroAreaEl.classList.add("filtro-area-destacado");
    else filtroAreaEl.classList.remove("filtro-area-destacado");
  }

  // Filtrar también las evaluaciones para recalcular KPIs según el área seleccionada
  let evalsFiltradas = evalsTodas;
  if (fArea) evalsFiltradas = evalsTodas.filter(e => e.area === fArea);

  if (fNombre) asesores = asesores.filter(a => (a.asesor||"").toLowerCase().includes(fNombre));
  if (fArea) asesores = asesores.filter(a => a.area === fArea);

  // Ordenamiento
  switch(fOrden) {
    case "promedio_desc": asesores.sort((a,b)=>b.promedio-a.promedio); break;
    case "promedio_asc": asesores.sort((a,b)=>a.promedio-b.promedio); break;
    case "evaluaciones_desc": asesores.sort((a,b)=>b.total_evaluaciones-a.total_evaluaciones); break;
    case "reciente": asesores.sort((a,b)=>(b.ultima_fecha||"").localeCompare(a.ultima_fecha||"")); break;
    case "nombre_asc": asesores.sort((a,b)=>(a.asesor||"").localeCompare(b.asesor||"")); break;
  }

  // KPIs ahora se calculan sobre las evaluaciones filtradas (responden al área seleccionada)
  renderKPIs(evalsFiltradas, asesores, fArea);

  const tbody = document.getElementById("tabla-body");
  const wrapper = document.getElementById("tabla-wrapper");

  if (asesores.length === 0) {
    if (evalsTodas.length === 0) {
      wrapper.innerHTML = `<div class="empty-state">
        <div class="icon">📊</div>
        <h3>Aún no hay evaluaciones guardadas</h3>
        <p>Realiza tu primera evaluación en SONAR Evaluador y guárdala. Aquí aparecerán los asesores con su histórico de desempeño y análisis de tendencias.</p>
        <a href="#" onclick="Sonar.switchView('evaluador');return false;" class="btn btn-primary">Ir al Evaluador →</a>
      </div>`;
    } else {
      wrapper.innerHTML = `<div class="empty-state">
        <div class="icon">🔍</div>
        <h3>No hay asesores que coincidan con los filtros</h3>
        <p>Prueba ajustar los filtros o limpiar la búsqueda.</p>
      </div>`;
    }
    return;
  }

  // Reconstruir tabla si fue reemplazada
  if (!document.getElementById("tabla-asesores")) {
    wrapper.innerHTML = `<table class="tabla-asesores" id="tabla-asesores"><thead>
      <tr>
        <th>Asesor</th>
        <th class="center">Evaluaciones</th>
        <th class="center">Promedio</th>
        <th class="center">Última eval</th>
        <th class="center">Tendencia</th>
        <th class="center">Última fecha</th>
        <th class="center">📨 Hoy</th>
      </tr></thead>
      <tbody id="tabla-body"></tbody>
    </table>`;
  }
  const tbodyNew = document.getElementById("tabla-body");

  tbodyNew.innerHTML = asesores.map(a => {
    const ini = getIniciales(a.asesor);
    const pCls = getPuntajeClase(a.promedio);
    const uCls = getPuntajeClase(a.ultima_puntaje);
    const tIcon = a.tendencia === "up" ? "↗" : a.tendencia === "down" ? "↘" : "→";
    const tCls = "tendencia-" + a.tendencia;
    const tLabel = a.tendencia === "up" ? "Mejora" : a.tendencia === "down" ? "Baja" : "Estable";
    const fechaStr = a.ultima_fecha ? formatearFecha(a.ultima_fecha) : "—";

    // Indicador de mensaje del día (Slack)
    const msgHoy = getMensajeHoyDeAsesor(a.asesor);
    let msgIcon, msgTitle;
    if (!msgHoy) {
      msgIcon = '<span style="color:#555;font-size:18px" title="Sin mensaje hoy">○</span>';
      msgTitle = "Sin mensaje generado hoy";
    } else if (msgHoy.estado === "copiado" || msgHoy.estado === "enviado") {
      msgIcon = '<span style="color:var(--verde);font-size:18px" title="Mensaje copiado/enviado hoy">✓</span>';
      msgTitle = "Mensaje del día copiado";
    } else {
      msgIcon = '<span style="color:#A5B4FC;font-size:18px" title="Mensaje generado, pendiente copiar">●</span>';
      msgTitle = "Mensaje generado (pendiente copiar)";
    }

    return `<tr onclick="abrirDetalle('${escapeHTML(a.asesor).replace(/'/g,"\\'")}')">
      <td>
        <div class="asesor-cell">

          <div class="asesor-info">
            <div class="asesor-name">${escapeHTML(a.asesor)}</div>
            <div class="asesor-meta">${escapeHTML(a.area_nivel_label||a.area||'')}</div>
          </div>
        </div>
      </td>
      <td class="center"><strong>${a.total_evaluaciones}</strong></td>
      <td class="center"><span class="puntaje-badge puntaje-${pCls}">${a.promedio.toFixed(1)}</span></td>
      <td class="center">
        <span class="puntaje-badge puntaje-${uCls}" title="Puntaje automático SONAR">🔊 ${a.ultima_puntaje.toFixed(1)}</span>
        ${a.ultima_sup_puntaje !== null ? `<span class="puntaje-badge" style="background:rgba(99,102,241,.20);border:1px solid var(--morado);color:#A5B4FC;margin-left:4px" title="Calificación Supervisor de Calidad">👤 ${a.ultima_sup_puntaje.toFixed(1)}</span>` : ''}
      </td>
      <td class="center"><span class="tendencia ${tCls}">${tIcon} ${tLabel}</span></td>
      <td class="center" style="color:var(--muted);font-size:12px">${fechaStr}</td>
      <td class="center" title="${msgTitle}">${msgIcon}</td>
    </tr>`;
  }).join("");
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return "—";
  try {
    const d = new Date(fechaStr + "T00:00:00");
    return d.toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" });
  } catch(e) { return fechaStr; }
}

// VISTA DE DETALLE DEL ASESOR
// ════════════════════════════════════════════════

function abrirDetalle(nombreAsesor) {
  const todasEvals = getEvaluaciones();
  const evals = todasEvals.filter(e => (e.asesor||"").trim().toLowerCase() === nombreAsesor.trim().toLowerCase());
  if (evals.length === 0) return;

  const coachings = getCoachingsDeAsesor(nombreAsesor);
  window._asesorActualDetalle = nombreAsesor;

  // Ordenar cronológicamente
  evals.sort((a,b) => (a.fecha_llamada||"").localeCompare(b.fecha_llamada||""));

  const promedio = evals.reduce((s,e)=>s+(e.puntaje_total||0),0)/evals.length;
  const ultima = evals[evs_len(evals)-1];
  const primera = evals[0];
  const diferenciaTotal = (ultima.puntaje_total||0) - (primera.puntaje_total||0);

  // ───── MEJORA 1: Ranking del asesor en el equipo ─────
  // Filtramos asesores del MISMO área/nivel para que la comparativa sea justa
  const todosAsesoresMismaArea = agruparPorAsesor(
    todasEvals.filter(e => e.area === ultima.area && (ultima.area !== "cobranza" || e.nivel === ultima.nivel))
  );
  todosAsesoresMismaArea.sort((a,b) => b.promedio - a.promedio);
  const totalEquipo = todosAsesoresMismaArea.length;
  const posicionAsesor = todosAsesoresMismaArea.findIndex(a => (a.asesor||"").trim().toLowerCase() === nombreAsesor.trim().toLowerCase()) + 1;
  const porcentajePos = totalEquipo > 1 ? Math.round((posicionAsesor / totalEquipo) * 100) : 100;
  let rankingTexto, rankingColor, rankingSub;
  if (totalEquipo < 2) {
    rankingTexto = "Único";
    rankingColor = "var(--muted)";
    rankingSub = "Solo asesor evaluado";
  } else if (porcentajePos <= 25) {
    rankingTexto = "Top 25%";
    rankingColor = "var(--verde)";
    rankingSub = `${posicionAsesor} de ${totalEquipo} asesores`;
  } else if (porcentajePos <= 50) {
    rankingTexto = "Top 50%";
    rankingColor = "var(--azul)";
    rankingSub = `${posicionAsesor} de ${totalEquipo} asesores`;
  } else if (porcentajePos <= 75) {
    rankingTexto = "Medio";
    rankingColor = "var(--dorado)";
    rankingSub = `${posicionAsesor} de ${totalEquipo} asesores`;
  } else {
    rankingTexto = "Necesita apoyo";
    rankingColor = "var(--rojo)";
    rankingSub = `${posicionAsesor} de ${totalEquipo} asesores`;
  }

  // ───── MEJORA 2: Tendencia con diferencia numérica más rica ─────
  // Comparamos últimas 3 vs anteriores 3, y damos el delta exacto
  let tendenciaTexto = "Estable";
  let tendenciaIcon = "→";
  let tendenciaColor = "var(--muted)";
  let tendenciaSub = "Sin datos suficientes";
  if (evals.length >= 4) {
    const ult3 = evals.slice(-3);
    const ant3 = evals.slice(-6,-3);
    if (ant3.length > 0) {
      const avgUlt = ult3.reduce((s,e)=>s+(e.puntaje_total||0),0)/ult3.length;
      const avgAnt = ant3.reduce((s,e)=>s+(e.puntaje_total||0),0)/ant3.length;
      const dif = avgUlt - avgAnt;
      const difAbs = Math.abs(dif).toFixed(1);
      if (dif > 0.5) {
        tendenciaTexto = `↑ +${difAbs}`;
        tendenciaColor = "var(--verde)";
        tendenciaSub = "vs período anterior";
      } else if (dif < -0.5) {
        tendenciaTexto = `↓ -${difAbs}`;
        tendenciaColor = "var(--rojo)";
        tendenciaSub = "vs período anterior";
      } else {
        tendenciaTexto = `≈ ${dif >= 0 ? '+' : '-'}${difAbs}`;
        tendenciaColor = "var(--muted)";
        tendenciaSub = "Variación mínima";
      }
    }
  } else if (evals.length >= 2) {
    const dif = (ultima.puntaje_total||0) - (primera.puntaje_total||0);
    const difAbs = Math.abs(dif).toFixed(1);
    if (dif > 1) {
      tendenciaTexto = `↑ +${difAbs}`;
      tendenciaColor = "var(--verde)";
      tendenciaSub = "desde primera eval";
    } else if (dif < -1) {
      tendenciaTexto = `↓ -${difAbs}`;
      tendenciaColor = "var(--rojo)";
      tendenciaSub = "desde primera eval";
    } else {
      tendenciaSub = "Sin cambios notables";
    }
  }

  // Criterios débiles recurrentes (def + cri)
  const conteoCriterios = {};
  evals.forEach(e => {
    (e.criterios||[]).forEach(c => {
      if (c.nivel === "def" || c.nivel === "cri") {
        const key = c.criterio;
        if (!conteoCriterios[key]) conteoCriterios[key] = {nombre: c.criterio, seccion: c.seccion, cuenta: 0, ejemplos: []};
        conteoCriterios[key].cuenta++;
        if (conteoCriterios[key].ejemplos.length < 2 && c.razon) conteoCriterios[key].ejemplos.push(c.razon);
      }
    });
  });
  const debiles = Object.values(conteoCriterios).sort((a,b)=>b.cuenta-a.cuenta).slice(0,5);

  // Fortalezas (criterios donde es consistentemente excelente)
  const conteoFortalezas = {};
  evals.forEach(e => {
    (e.criterios||[]).forEach(c => {
      if (c.nivel === "exc") {
        const key = c.criterio;
        if (!conteoFortalezas[key]) conteoFortalezas[key] = {nombre: c.criterio, cuenta: 0};
        conteoFortalezas[key].cuenta++;
      }
    });
  });
  const fortalezas = Object.values(conteoFortalezas)
    .filter(f => f.cuenta >= Math.ceil(evals.length * 0.5))
    .sort((a,b)=>b.cuenta-a.cuenta).slice(0,3);

  // Última recomendación
  const ultimaRecom = ultima.recomendaciones || "Sin recomendación registrada en la última evaluación.";

  const ini = getIniciales(ultima.asesor);
  const modal = document.getElementById("detalle-modal");

  modal.innerHTML = `
    <div class="detalle-head">
      <div class="detalle-asesor">
        <div class="avatar avatar-lg">${ini}</div>
        <div>
          <h2>${escapeHTML(ultima.asesor)}</h2>
          <div class="sub">${escapeHTML(ultima.area_nivel_label||ultima.area||'')} · Supervisor: ${escapeHTML(ultima.supervisor||'—')}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="exportarPDFAsesor()" title="Imprimir o guardar perfil del asesor como PDF" style="background:transparent;color:var(--morado);border:1px solid var(--morado);padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:Arial">⬇ Exportar PDF</button>

    <div class="detalle-body">

      <!-- KPIs del asesor -->
      <div class="detalle-kpis">
        <div class="detalle-kpi"><div class="lbl">Total evaluaciones</div><div class="val">${evals.length}</div><div class="sub">Desde ${formatearFecha(primera.fecha_llamada)}</div></div>
        <div class="detalle-kpi ${promedio>=7?'up':promedio<4?'down':''}"><div class="lbl">Promedio</div><div class="val">${promedio.toFixed(1)}</div><div class="sub">${getPuntajeLabel(promedio)}</div></div>
        <div class="detalle-kpi ${(ultima.puntaje_total||0)>=7?'up':(ultima.puntaje_total||0)<4?'down':''}"><div class="lbl">Última evaluación</div><div class="val">${(ultima.puntaje_total||0).toFixed(1)}</div><div class="sub">${formatearFecha(ultima.fecha_llamada)}</div></div>
        <div class="detalle-kpi"><div class="lbl">Posición en equipo</div><div class="val" style="color:${rankingColor};font-size:18px">${rankingTexto}</div><div class="sub">${rankingSub}</div></div>
        <div class="detalle-kpi"><div class="lbl">Tendencia</div><div class="val" style="color:${tendenciaColor};font-size:18px">${tendenciaTexto}</div><div class="sub">${tendenciaSub}</div></div>
      </div>

      <!-- Gráfico de evolución -->
      <div class="detalle-section">
        <h3>📈 Evolución del desempeño</h3>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-style:italic">Las líneas verticales moradas marcan sesiones de coaching registradas.</div>
        <div class="chart-wrap"><canvas id="chart-evolucion"></canvas></div>
      </div>

      <!-- Sesiones de coaching -->
      <div class="detalle-section">
        <h3>🎯 Sesiones de coaching registradas</h3>
        <div id="coachings-lista" style="margin-bottom:14px">${renderCoachingsLista(coachings, ultima.asesor)}</div>
        <div style="background:var(--negro);border:1px dashed var(--morado);border-radius:7px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:140px">
            <label style="display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:600">Fecha</label>
            <input type="date" id="coaching-fecha" value="${new Date().toISOString().split('T')[0]}" style="width:100%;padding:7px 10px;background:var(--negro-c);color:var(--text);border:1px solid var(--negro-b);border-radius:5px;font-family:Arial;font-size:13px;outline:none">
          </div>
          <div style="flex:3;min-width:200px">
            <label style="display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:600">Nota (opcional)</label>
            <input type="text" id="coaching-nota" placeholder="Ej: Refuerzo en cierre y confirmación de acuerdos" style="width:100%;padding:7px 10px;background:var(--negro-c);color:var(--text);border:1px solid var(--negro-b);border-radius:5px;font-family:Arial;font-size:13px;outline:none">
          </div>
          <button onclick="agregarCoachingDesdeModal('${escapeHTML(ultima.asesor).replace(/'/g,"\\'")}')" style="padding:8px 16px;background:var(--morado);color:white;border:none;border-radius:5px;font-weight:700;font-size:13px;cursor:pointer;font-family:Arial">+ Agregar coaching</button>
        </div>
      </div>

      <!-- ★ NUEVO: Plan de Acción + Programar Siguiente Sesión ★ -->
      <div class="detalle-section">
        <h3>📋 Plan de acción y siguiente sesión</h3>
        <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
          <button class="action-btn" onclick="abrirFormularioPlanAccion('${escapeHTML(ultima.asesor).replace(/'/g,"\\'")}')">📝 Generar plan de acción</button>
          <button class="action-btn action-btn-soft" onclick="abrirFormularioSiguienteSesion('${escapeHTML(ultima.asesor).replace(/'/g,"\\'")}')">📅 Programar siguiente sesión</button>
        </div>

        <!-- Lista de planes de acción existentes -->
        <div id="planes-accion-lista">${renderPlanesAccionLista(getPlanesAccionDeAsesor(ultima.asesor), ultima.asesor)}</div>

        <!-- Lista de sesiones programadas -->
        <div id="siguientes-sesiones-lista" style="margin-top:14px">${renderSiguientesSesionesLista(getSiguienteSesionDeAsesor(ultima.asesor), ultima.asesor)}</div>

        <!-- Contenedor para los formularios (se llenan dinámicamente) -->
        <div id="form-plan-accion-cont" style="display:none;margin-top:14px"></div>
        <div id="form-sig-sesion-cont" style="display:none;margin-top:14px"></div>
      </div>


      <!-- Criterios débiles + Fortalezas -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">

        <div class="detalle-section">
          <h3>⚠ Criterios donde falla recurrentemente</h3>
          ${debiles.length > 0 ? `<div class="weak-list">${debiles.map(d => `
            <div class="weak-item">
              <div>
                <div class="weak-name">${escapeHTML(d.nombre)}</div>
                <div style="font-size:11px;color:#FFB0B0;margin-top:2px;opacity:.8">${escapeHTML(d.seccion||'')}</div>
              </div>
              <span class="weak-freq">${d.cuenta} de ${evals.length}</span>
            </div>
          `).join("")}</div>` : '<div style="color:var(--muted);font-style:italic;font-size:13px">No tiene criterios débiles recurrentes. Excelente.</div>'}
        </div>

        <div class="detalle-section">
          <h3>✓ Fortalezas consistentes</h3>
          ${fortalezas.length > 0 ? `<div class="weak-list">${fortalezas.map(f => `
            <div class="weak-item" style="background:var(--verde-l);border-color:var(--verde)">
              <div class="weak-name" style="color:var(--verde)">${escapeHTML(f.nombre)}</div>
              <span class="weak-freq" style="color:var(--verde)">${f.cuenta} de ${evals.length}</span>
            </div>
          `).join("")}</div>` : '<div style="color:var(--muted);font-style:italic;font-size:13px">Necesita más evaluaciones para identificar fortalezas consistentes.</div>'}
        </div>

      </div>

      <!-- Recomendación dinámica de SONAR con IA -->
      <div class="detalle-section">
        <h3>💡 Recomendación personalizada de SONAR</h3>
        <div id="recomendacion-ia-panel">${renderRecomendacionPanel(ultima.asesor, evals, coachings, debiles, fortalezas, promedio)}</div>
      </div>

      <!-- ★ NUEVO: Mensaje diario para Slack ★ -->
      <div class="detalle-section">
        <h3>📨 Mensaje del día para Slack</h3>
        <div id="mensaje-slack-panel">${renderMensajeSlackPanel(ultima.asesor, evals, coachings, debiles, fortalezas, promedio)}</div>
      </div>

      <!-- Historial -->
      <div class="detalle-section">
        <h3>📋 Historial de evaluaciones</h3>
        <div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:8px">El badge morado muestra la calificación del Supervisor de Calidad (cuando existe), junto al puntaje automático de SONAR.</div>
        <div style="max-height:280px;overflow-y:auto;padding-right:6px">
          ${[...evals].reverse().map(e => {
            const supCal = e.supervisor_calidad || {};
            const supP = (supCal.puntaje !== null && supCal.puntaje !== undefined && !isNaN(supCal.puntaje)) ? parseFloat(supCal.puntaje) : null;
            const supBadge = (supP !== null)
              ? `<span class="puntaje-badge puntaje-${getPuntajeClase(supP)}" style="background:rgba(99,102,241,.20);border:1.5px solid var(--morado);color:#A5B4FC;margin-left:4px" title="Calificación del Supervisor de Calidad">👤 ${supP.toFixed(1)}</span>`
              : '';
            const supComment = (supCal.comentarios||"").trim();
            const supCommentLine = supComment
              ? `<div style="font-size:11px;color:#A5B4FC;margin-top:6px;padding:6px 8px;background:rgba(99,102,241,.08);border-left:2px solid var(--morado);border-radius:3px;line-height:1.4">💬 <strong>Supervisor:</strong> ${escapeHTML(supComment.length > 180 ? supComment.substring(0,180)+'…' : supComment)}</div>`
              : '';
            return `
            <div class="eval-row">
              <div class="eval-info">
                <div class="eval-fecha">${formatearFecha(e.fecha_llamada)}</div>
                <div class="eval-id">ID: ${escapeHTML(e.id_llamada||'—')}</div>
                <div class="eval-area">${escapeHTML(e.area_nivel_label||'')} · Sup: ${escapeHTML(e.supervisor||'—')}</div>
                ${supCommentLine}
              </div>
              <div style="text-align:right">
                <div style="display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:wrap">
                  <span class="puntaje-badge puntaje-${getPuntajeClase(e.puntaje_total||0)}" title="Puntaje automático SONAR">🔊 ${(e.puntaje_total||0).toFixed(1)}</span>
                  ${supBadge}
                </div>
                <div style="font-size:11px;color:var(--muted);margin-top:4px">${getPuntajeLabel(e.puntaje_total||0)}</div>
              </div>
            </div>
          `;}).join("")}
        </div>
      </div>

    </div>
  `;

  document.getElementById("detalle-overlay").classList.add("active");
  document.body.style.overflow = "hidden";

  // Crear gráfico de evolución
  setTimeout(() => {
    const ctx = document.getElementById("chart-evolucion");
    if (!ctx) return;
    if (chartInstance) chartInstance.destroy();

    // ───── MEJORA 3: Plugin para marcar fechas de coaching en el gráfico ─────
    // Mapeamos cada coaching a la fecha de evaluación más cercana (o intermedio)
    const fechasEvals = evals.map(e => e.fecha_llamada);
    const marcasCoaching = coachings.map(c => {
      // Encontrar la posición X aproximada del coaching basado en las fechas
      const fechaC = c.fecha;
      let xIndex = -1;
      // Buscar la posición exacta o entre dos evaluaciones
      for (let i = 0; i < fechasEvals.length; i++) {
        if (fechasEvals[i] >= fechaC) {
          if (i === 0) {
            xIndex = 0;
          } else {
            // Coaching está entre evaluación i-1 e i, calcular posición proporcional
            const prevDate = new Date(fechasEvals[i-1] + "T00:00:00").getTime();
            const nextDate = new Date(fechasEvals[i] + "T00:00:00").getTime();
            const targetDate = new Date(fechaC + "T00:00:00").getTime();
            const ratio = nextDate > prevDate ? (targetDate - prevDate) / (nextDate - prevDate) : 0;
            xIndex = (i - 1) + Math.max(0, Math.min(1, ratio));
          }
          break;
        }
      }
      if (xIndex === -1) xIndex = fechasEvals.length - 1;
      return { xIndex, fecha: c.fecha, nota: c.nota || "Sesión de coaching" };
    });

    // Plugin custom para dibujar líneas verticales de coaching
    const coachingMarkerPlugin = {
      id: 'coachingMarkers',
      afterDraw: (chart) => {
        if (!marcasCoaching.length) return;
        const ctx = chart.ctx;
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        ctx.save();
        marcasCoaching.forEach(m => {
          // Calcular X usando el índice fraccionario
          const lower = Math.floor(m.xIndex);
          const upper = Math.ceil(m.xIndex);
          const frac = m.xIndex - lower;
          let xPos;
          if (lower === upper || lower >= chart.data.labels.length) {
            xPos = xScale.getPixelForValue(Math.min(lower, chart.data.labels.length - 1));
          } else {
            const xLow = xScale.getPixelForValue(lower);
            const xHigh = xScale.getPixelForValue(upper);
            xPos = xLow + (xHigh - xLow) * frac;
          }
          // Línea vertical morada punteada
          ctx.beginPath();
          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#A5B4FC';
          ctx.moveTo(xPos, yScale.top);
          ctx.lineTo(xPos, yScale.bottom);
          ctx.stroke();
          // Etiqueta "Coaching" arriba
          ctx.setLineDash([]);
          ctx.fillStyle = '#6366F1';
          ctx.fillRect(xPos - 32, yScale.top - 2, 64, 16);
          ctx.fillStyle = 'white';
          ctx.font = 'bold 9px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('🎯 COACHING', xPos, yScale.top + 9);
        });
        ctx.restore();
      }
    };

    chartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: evals.map(e => formatearFecha(e.fecha_llamada)),
        datasets: [{
          label: "Puntaje",
          data: evals.map(e => e.puntaje_total||0),
          borderColor: "#6366F1",
          backgroundColor: "rgba(99,102,241,.15)",
          borderWidth: 2.5,
          tension: 0.25,
          pointRadius: 5,
          pointBackgroundColor: evals.map(e => {
            const p = e.puntaje_total||0;
            return p >= 9 ? "#00C170" : p >= 7 ? "#D4A017" : p >= 4 ? "#E05050" : "#FF6060";
          }),
          pointBorderColor: "#0D0D0D",
          pointBorderWidth: 2,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 20 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: "#1A1A1A",
            titleColor: "#6366F1",
            bodyColor: "#E8E8E8",
            borderColor: "#2A2A2A",
            borderWidth: 1,
            callbacks: {
              label: ctx => "Puntaje: " + ctx.parsed.y.toFixed(1) + "/10"
            }
          }
        },
        scales: {
          x: {
            ticks: { color: "#888", font: { size: 11 } },
            grid: { color: "rgba(150,150,150,.08)" }
          },
          y: {
            min: 0, max: 10,
            ticks: { color: "#888", font: { size: 11 }, stepSize: 2 },
            grid: { color: "rgba(150,150,150,.08)" }
          }
        }
      },
      plugins: [coachingMarkerPlugin]
    });
  }, 50);
}

function cerrarDetalle() {
  document.getElementById("detalle-overlay").classList.remove("active");
  document.body.style.overflow = "";
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

function renderCoachingsLista(coachings, asesor) {
  if (!coachings || coachings.length === 0) {
    return '<div style="color:var(--muted);font-style:italic;font-size:12px;padding:8px 0">Aún no hay sesiones de coaching registradas para este asesor. Agrega la primera abajo.</div>';
  }
  return coachings.map(c => `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 12px;background:rgba(99,102,241,.10);border:1px solid var(--morado);border-radius:6px;margin-bottom:6px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
          <span style="font-size:12px;font-weight:700;color:#A5B4FC">📅 ${formatearFecha(c.fecha)}</span>
        </div>
        ${c.nota ? `<div style="font-size:12px;color:var(--text);line-height:1.4">${escapeHTML(c.nota)}</div>` : '<div style="font-size:11px;color:var(--muted);font-style:italic">Sin notas</div>'}
      </div>
      <button onclick="quitarCoaching('${c.id}','${escapeHTML(asesor).replace(/'/g,"\\'")}')" title="Eliminar este coaching" style="background:transparent;color:var(--rojo);border:1px solid var(--rojo);width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:14px;flex-shrink:0">✕</button>
    </div>
  `).join("");
}

function agregarCoachingDesdeModal(asesor) {
  const fecha = document.getElementById("coaching-fecha")?.value;
  const nota = document.getElementById("coaching-nota")?.value || "";
  if (!fecha) {
    alert("Selecciona una fecha para el coaching.");
    return;
  }
  registrarCoaching(asesor, fecha, nota.trim());
  // Re-abrir detalle para refrescar
  abrirDetalle(asesor);
}

function quitarCoaching(idCoaching, asesor) {
  if (!confirm("¿Eliminar este registro de coaching? La marca desaparecerá del gráfico.")) return;
  eliminarCoaching(idCoaching);
  abrirDetalle(asesor);
}

function renderPlanesAccionLista(planes, asesor) {
  if (!planes || planes.length === 0) {
    return '<div style="color:var(--muted);font-style:italic;font-size:12px;padding:6px 0">Sin planes de acción registrados. Genera el primero con el botón de arriba.</div>';
  }
  return '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px">Planes de acción</div>' +
    planes.map(p => {
      const fechaFmt = formatearFecha(p.fecha_creacion ? p.fecha_creacion.split("T")[0] : "");
      const compromisosHtml = (p.compromisos || []).map(c => `<li style="margin-bottom:2px">${escapeHTML(c)}</li>`).join("");
      return `
        <div style="background:rgba(99,102,241,.08);border:1px solid var(--morado);border-radius:7px;padding:12px 14px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">
            <div style="font-size:12px;font-weight:700;color:#A5B4FC">📋 Plan del ${escapeHTML(fechaFmt)}</div>
            <button onclick="quitarPlanAccion('${p.id}','${escapeHTML(asesor).replace(/'/g,"\\'")}')" title="Eliminar plan" style="background:transparent;color:var(--rojo);border:1px solid var(--rojo);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px;flex-shrink:0">✕</button>
          </div>
          <div style="font-size:12px;color:var(--text);margin-bottom:6px"><strong style="color:#A5B4FC">Área a mejorar:</strong> ${escapeHTML(p.area_mejora||"—")}</div>
          ${p.compromisos && p.compromisos.length ? `<div style="font-size:12px;color:var(--text)"><strong style="color:#A5B4FC">Compromisos:</strong><ul style="margin:4px 0 0 18px;padding:0;color:var(--text)">${compromisosHtml}</ul></div>` : ""}
          ${p.fecha_revision ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">Revisión: ${escapeHTML(formatearFecha(p.fecha_revision))}</div>` : ""}
        </div>
      `;
    }).join("");
}

function renderSiguientesSesionesLista(sesiones, asesor) {
  if (!sesiones || sesiones.length === 0) {
    return '<div style="color:var(--muted);font-style:italic;font-size:12px;padding:6px 0">Sin sesiones programadas.</div>';
  }
  const hoy = new Date().toISOString().split("T")[0];
  return '<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px">Sesiones programadas</div>' +
    sesiones.map(s => {
      const fechaFmt = formatearFecha(s.fecha);
      const pasada = s.fecha < hoy;
      return `
        <div style="background:${pasada?'rgba(150,150,150,.08)':'rgba(0,193,112,.08)'};border:1px solid ${pasada?'var(--negro-b)':'var(--verde)'};border-radius:7px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;color:${pasada?'var(--muted)':'var(--verde)'}">📅 ${escapeHTML(fechaFmt)} ${s.hora ? '· '+escapeHTML(s.hora) : ''} ${pasada ? '<span style="font-size:10px;color:var(--muted);font-style:italic">(pasada)</span>' : ''}</div>
            ${s.tema ? `<div style="font-size:12px;color:var(--text);margin-top:3px"><strong>Tema:</strong> ${escapeHTML(s.tema)}</div>` : ""}
            ${s.modalidad ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">Modalidad: ${escapeHTML(s.modalidad)}</div>` : ""}
          </div>
          <button onclick="quitarSiguienteSesion('${s.id}','${escapeHTML(asesor).replace(/'/g,"\\'")}')" title="Eliminar sesión" style="background:transparent;color:var(--rojo);border:1px solid var(--rojo);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px">✕</button>
        </div>
      `;
    }).join("");
}

function abrirFormularioPlanAccion(asesor) {
  const cont = document.getElementById("form-plan-accion-cont");
  if (!cont) return;
  // Sugerir el criterio débil principal como área de mejora (si existe)
  const todasEvals = getEvaluaciones();
  const evals = todasEvals.filter(e => (e.asesor||"").trim().toLowerCase() === asesor.trim().toLowerCase());
  let sugerencia = "";
  const conteo = {};
  evals.forEach(e => (e.criterios||[]).forEach(c => {
    if (c.nivel === "def" || c.nivel === "cri") {
      conteo[c.criterio] = (conteo[c.criterio]||0) + 1;
    }
  }));
  const top = Object.entries(conteo).sort((a,b)=>b[1]-a[1])[0];
  if (top) sugerencia = top[0];

  const hoy = new Date().toISOString().split("T")[0];
  const enUnaSemana = new Date(Date.now() + 7*86400000).toISOString().split("T")[0];

  cont.style.display = "block";
  cont.innerHTML = `
    <div style="background:var(--negro);border:1.5px dashed var(--morado);border-radius:8px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:#A5B4FC">📝 Nuevo plan de acción para ${escapeHTML(asesor)}</div>
        <button onclick="cerrarFormularioPlanAccion()" style="background:transparent;color:var(--muted);border:1px solid var(--negro-b);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label style="display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:600">Fecha de creación</label>

function getRecomendacionCacheada(nombreAsesor) {
  try {

    return cache[key] || null;
  } catch(e) { return null; }
}

function guardarRecomendacionEnCache(nombreAsesor, recomendacion, conteoEvals) {
  try {
    const cache = JSON.parse(localStorage.getItem(RECOMENDACIONES_CACHE_KEY) || "{}");

    cache[key] = {
      texto: recomendacion,
      fecha_generada: new Date().toISOString(),

}

async function generarRecomendacionIA(nombreAsesor, esRegeneracion) {
  if (!anthropicEstaConfigurado()) {
    alert("La API Key no está configurada en este archivo. Edita el código.");
    return;
  }

  const panel = document.getElementById("recomendacion-ia-panel");
  if (!panel) return;
  panel.innerHTML = `
    <div style="background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));border:1px solid var(--morado);border-radius:8px;padding:24px;text-align:center">
      <div style="font-size:32px;margin-bottom:8px">⚙️</div>
      <div style="font-size:14px;color:#A5B4FC;font-weight:700;margin-bottom:4px">SONAR analizando el histórico...</div>
      <div style="font-size:11px;color:var(--muted);font-style:italic">Identificando patrones, tendencias y oportunidades de coaching</div>
    </div>
  `;

  try {
    const todasEvals = getEvaluaciones();
    const evals = todasEvals.filter(e => (e.asesor||"").trim().toLowerCase() === nombreAsesor.trim().toLowerCase());
    evals.sort((a,b) => (a.fecha_llamada||"").localeCompare(b.fecha_llamada||""));
    const coachings = getCoachingsDeAsesor(nombreAsesor);
    const ultima = evals[evals.length-1];
    const promedio = evals.reduce((s,e)=>s+(e.puntaje_total||0),0)/evals.length;

    // Conteo de criterios débiles
    const conteoCriterios = {};
    evals.forEach(e => {
      (e.criterios||[]).forEach(c => {
        if (c.nivel === "def" || c.nivel === "cri") {
          const key = c.criterio;
          if (!conteoCriterios[key]) conteoCriterios[key] = {nombre: c.criterio, cuenta: 0};
          conteoCriterios[key].cuenta++;
        }
      });
    });
    const debiles = Object.values(conteoCriterios).sort((a,b)=>b.cuenta-a.cuenta).slice(0,5);

    // Conteo de fortalezas
    const conteoFortalezas = {};
    evals.forEach(e => {
      (e.criterios||[]).forEach(c => {
        if (c.nivel === "exc") {
          const key = c.criterio;
          if (!conteoFortalezas[key]) conteoFortalezas[key] = {nombre: c.criterio, cuenta: 0};
          conteoFortalezas[key].cuenta++;
        }
      });
    });
    const fortalezas = Object.values(conteoFortalezas)
      .filter(f => f.cuenta >= Math.ceil(evals.length * 0.5))
      .sort((a,b)=>b.cuenta-a.cuenta).slice(0,3);

    // Calcular impacto de coachings (puntaje promedio antes/después de cada coaching)
    let impactoCoaching = "Sin coachings registrados";
    if (coachings.length > 0) {
      const ultCoaching = coachings[coachings.length-1];
      const evalsAntes = evals.filter(e => e.fecha_llamada < ultCoaching.fecha);
      const evalsDespues = evals.filter(e => e.fecha_llamada >= ultCoaching.fecha);
      if (evalsAntes.length > 0 && evalsDespues.length > 0) {
        const promAntes = evalsAntes.reduce((s,e)=>s+(e.puntaje_total||0),0)/evalsAntes.length;
        const promDespues = evalsDespues.reduce((s,e)=>s+(e.puntaje_total||0),0)/evalsDespues.length;
        const dif = promDespues - promAntes;
        impactoCoaching = `Después del último coaching (${formatearFecha(ultCoaching.fecha)}), el promedio cambió de ${promAntes.toFixed(1)} a ${promDespues.toFixed(1)} (${dif>=0?'+':''}${dif.toFixed(1)} puntos).`;
      }
    }

    // Construir contexto histórico
    const contextoEvals = evals.map((e,i) => `Eval ${i+1} (${e.fecha_llamada}): ${(e.puntaje_total||0).toFixed(1)}/10 - ${e.nivel_general}`).join("\n");
    const contextoCoachings = coachings.length ? coachings.map(c => `- ${c.fecha}: ${c.nota || 'Sin nota'}`).join("\n") : "Ninguno";

    const prompt = `Eres un coach experto en calidad de llamadas para MultiMoney México.

CONTEXTO DEL ASESOR:
- Nombre: ${nombreAsesor}
- Área: ${ultima.area_nivel_label || ultima.area || 'Desconocida'}
- Total evaluaciones: ${evals.length}
- Promedio general: ${promedio.toFixed(1)}/10
- Última evaluación: ${(ultima.puntaje_total||0).toFixed(1)}/10 (${formatearFecha(ultima.fecha_llamada)})
- Supervisor: ${ultima.supervisor || 'No registrado'}

HISTÓRICO DE EVALUACIONES:
${contextoEvals}

SESIONES DE COACHING REGISTRADAS:
${contextoCoachings}

IMPACTO DEL COACHING: ${impactoCoaching}

CRITERIOS DONDE FALLA RECURRENTEMENTE (top 5):
${debiles.length ? debiles.map(d => `- ${d.nombre}: falla en ${d.cuenta} de ${evals.length} evaluaciones (${Math.round(d.cuenta/evals.length*100)}%)`).join("\n") : "Ninguno destacable"}

FORTALEZAS CONSISTENTES:
${fortalezas.length ? fortalezas.map(f => `- ${f.nombre}: excelente en ${f.cuenta} de ${evals.length} evaluaciones (${Math.round(f.cuenta/evals.length*100)}%)`).join("\n") : "Sin fortalezas consistentes aún"}

INSTRUCCIONES:
Genera un análisis personalizado de coaching para este asesor en español mexicano profesional. El análisis debe tener exactamente 4 párrafos cortos:

PÁRRAFO 1: Reconocimiento específico de fortalezas y/o mejoras (basado en datos reales).
PÁRRAFO 2: Identificación clara del problema principal a trabajar (criterio débil más recurrente, con dato porcentual).
PÁRRAFO 3: Recomendación concreta y accionable: qué decir, qué hacer, cómo practicarlo.
PÁRRAFO 4: Próximo paso medible y compromiso esperado para las próximas evaluaciones.

NO uses formato markdown. NO uses asteriscos. Texto plano, claro y empático.`;

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY_RECOMENDACIONES,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 800,
        messages: [{role: "user", content: prompt}]
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const recomendacion = data.content[0].text.trim();
    guardarRecomendacionEnCache(nombreAsesor, recomendacion, evals.length);
    // Re-renderizar panel
    panel.innerHTML = `
      <div class="recomendacion-box">
        <strong>🤖 Análisis SONAR personalizado para ${escapeHTML(nombreAsesor)}:</strong>
        <div style="margin:8px 0;line-height:1.7">${escapeHTML(recomendacion).replace(/\n/g,"<br>")}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,193,112,.25);flex-wrap:wrap;gap:8px">
          <span style="font-size:11px;color:var(--muted);font-style:italic">✓ Generada con IA · Basada en ${evals.length} evaluaciones</span>
          <button onclick="generarRecomendacionIA('${escapeHTML(nombreAsesor).replace(/'/g,"\\'")}', true)" style="background:transparent;color:var(--verde);border:1px solid var(--verde);padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:Arial">↻ Regenerar</button>
        </div>
      </div>
    `;
  } catch (err) {
    panel.innerHTML = `
      <div style="background:rgba(224,80,80,.1);border:1px solid var(--rojo);border-radius:7px;padding:14px 16px;color:#FFB0B0">
        <strong>⚠ Error al generar recomendación:</strong><br>
        ${escapeHTML(err.message)}<br><br>
        <button onclick="abrirDetalle('${escapeHTML(nombreAsesor).replace(/'/g,"\\'")}')" style="background:var(--rojo);color:white;border:none;padding:6px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer">Volver</button>
      </div>
    `;
  }
}

function getMensajesEnviados() {
  try { return JSON.parse(localStorage.getItem(MENSAJES_SLACK_KEY) || "{}"); }
  catch(e) { return {}; }
}

function fechaHoy() {
  return new Date().toISOString().split("T")[0];
}

function getMensajeHoyDeAsesor(nombreAsesor) {
  const todos = getMensajesEnviados();
  const key = (nombreAsesor||"").trim().toLowerCase();
  const reg = todos[key];
  if (!reg) return null;
  if (reg.fecha !== fechaHoy()) return null;  // si es de otro día, no cuenta
  return reg;
}

function guardarMensajeSlack(nombreAsesor, mensaje, estado) {

async function generarMensajeSlack(nombreAsesor) {
  if (!anthropicEstaConfigurado()) {
    alert("La API Key no está configurada. Edita el código.");
    return;
  }
  const panel = document.getElementById("mensaje-slack-panel");
  if (!panel) return;
  panel.innerHTML = `
    <div style="background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));border:1px solid #6366F1;border-radius:8px;padding:20px;text-align:center">
      <div style="font-size:28px;margin-bottom:6px">⚙️</div>
      <div style="font-size:13px;color:#A5B4FC;font-weight:700;margin-bottom:4px">Generando mensaje para ${escapeHTML(nombreAsesor)}...</div>
      <div style="font-size:11px;color:var(--muted);font-style:italic">SONAR está analizando el histórico para crear un mensaje breve y personalizado</div>
    </div>
  `;

  try {
    const todasEvals = getEvaluaciones();
    const evals = todasEvals.filter(e => (e.asesor||"").trim().toLowerCase() === nombreAsesor.trim().toLowerCase());
    evals.sort((a,b) => (a.fecha_llamada||"").localeCompare(b.fecha_llamada||""));
    const coachings = getCoachingsDeAsesor(nombreAsesor);
    const ultima = evals[evals.length-1];
    const promedio = evals.reduce((s,e)=>s+(e.puntaje_total||0),0)/evals.length;

    // Calcular criterio débil principal
    const conteoCriterios = {};
    evals.forEach(e => {
      (e.criterios||[]).forEach(c => {
        if (c.nivel === "def" || c.nivel === "cri") {
          if (!conteoCriterios[c.criterio]) conteoCriterios[c.criterio] = 0;
          conteoCriterios[c.criterio]++;
        }
      });
    });
    const criterioPrincipal = Object.entries(conteoCriterios).sort((a,b)=>b[1]-a[1])[0];
    const criterioDebilTexto = criterioPrincipal ? `${criterioPrincipal[0]} (falla en ${criterioPrincipal[1]} de ${evals.length})` : "Sin criterio débil consistente";

    // Calcular fortaleza
    const conteoFortalezas = {};
    evals.forEach(e => {
      (e.criterios||[]).forEach(c => {
        if (c.nivel === "exc") {
          if (!conteoFortalezas[c.criterio]) conteoFortalezas[c.criterio] = 0;
          conteoFortalezas[c.criterio]++;
        }
      });
    });
    const fortalezaPrincipal = Object.entries(conteoFortalezas)
      .filter(([k,v]) => v >= Math.ceil(evals.length * 0.5))
      .sort((a,b)=>b[1]-a[1])[0];

    // Tendencia
    let tendenciaTexto = "estable";
    if (evals.length >= 4) {
      const ult3 = evals.slice(-3).reduce((s,e)=>s+(e.puntaje_total||0),0)/3;
      const ant3 = evals.slice(-6,-3).reduce((s,e)=>s+(e.puntaje_total||0),0)/Math.max(1,evals.slice(-6,-3).length);
      if (ult3 - ant3 > 0.5) tendenciaTexto = "mejorando";
      else if (ant3 - ult3 > 0.5) tendenciaTexto = "bajando";
    }

    const prompt = `Eres un coach experto de calidad de llamadas para MultiMoney México.

Genera un MENSAJE BREVE para enviar HOY por Slack al asesor ${nombreAsesor}.

CONTEXTO:
- Área: ${ultima.area_nivel_label || ultima.area || 'Desconocida'}
- Promedio actual: ${promedio.toFixed(1)}/10
- Última evaluación: ${(ultima.puntaje_total||0).toFixed(1)}/10
- Tendencia: ${tendenciaTexto}
- Criterio donde más falla: ${criterioDebilTexto}
- Fortaleza principal: ${fortalezaPrincipal ? fortalezaPrincipal[0] : "aún por identificar"}
- Coachings recibidos: ${coachings.length}

REQUISITOS DEL MENSAJE:
1. Máximo 4 líneas (cortas, fáciles de leer en Slack móvil)
2. Tono cercano y motivador pero profesional (de coach a asesor, no de jefe)
3. Estructura: saludo breve + 1 reconocimiento real + foco del día + cierre motivador
4. NO uses palabras técnicas internas (PRP, PAD, CSP, etc.) — usa lenguaje claro
5. Si tendencia es "mejorando", reconócelo. Si está "bajando", no reproches, motiva.
6. Termina con emoji apropiado (💪 🎯 🌟 ✨)
7. NO incluyas "Hola ${nombreAsesor}" — solo "Hola [primer nombre]" o algo similar
8. NO uses markdown ni formato — solo texto plano para Slack

Devuelve ÚNICAMENTE el mensaje, sin explicaciones ni comillas.`;

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY_RECOMENDACIONES,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 400,
        messages: [{role: "user", content: prompt}]
      })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);
    const mensaje = data.content[0].text.trim();
    guardarMensajeSlack(nombreAsesor, mensaje, "generado");

    // Re-renderizar panel con el mensaje
    panel.innerHTML = renderMensajeSlackPanel(nombreAsesor, evals, coachings, [], [], promedio);

  } catch (err) {
    panel.innerHTML = `
      <div style="background:rgba(224,80,80,.1);border:1px solid var(--rojo);border-radius:7px;padding:14px 16px;color:#FFB0B0">
        <strong>⚠ Error al generar mensaje:</strong><br>
        ${escapeHTML(err.message)}<br><br>
        <button onclick="abrirDetalle('${escapeHTML(nombreAsesor).replace(/'/g,"\\'")}')" style="background:var(--rojo);color:white;border:none;padding:6px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer">Volver</button>
      </div>
    `;
  }
}

function regenerarMensajeSlack(nombreAsesor) {
  if (!confirm("¿Generar un nuevo mensaje? Esto reemplazará el mensaje actual y consume otra llamada a la IA (~$0.02 USD).")) return;
  // Borrar el actual y regenerar
  const todos = getMensajesEnviados();
  const key = (nombreAsesor||"").trim().toLowerCase();
  delete todos[key];
  localStorage.setItem(MENSAJES_SLACK_KEY, JSON.stringify(todos));
  generarMensajeSlack(nombreAsesor);
}

async function copiarMensajeSlack(nombreAsesor) {
  const textarea = document.getElementById("mensaje-slack-textarea");
  if (!textarea) return;
  const mensaje = textarea.value;

  try {
    await navigator.clipboard.writeText(mensaje);
    // Actualizar estado a 'copiado'
    guardarMensajeSlack(nombreAsesor, mensaje, "copiado");
    // Feedback visual
    const btn = event.target;
    const txtOriginal = btn.textContent;
    btn.textContent = "✓ Copiado";
    btn.style.background = "var(--verde)";
    btn.style.color = "white";
    setTimeout(() => {
      btn.textContent = txtOriginal;
      btn.style.background = "#6366F1";
    }, 2000);
  } catch (err) {
    // Fallback para navegadores sin clipboard API
    textarea.select();
    document.execCommand("copy");
    alert("Mensaje copiado. Pégalo en Slack.");
  }
}

function exportarExcel() {
  const evals = getEvaluaciones();
  if (evals.length === 0) {
    alert("No hay evaluaciones para exportar.");
    return;
  }
  // Hoja 1: resumen de evaluaciones
  let rows = [["Fecha Llamada","Asesor","ID Llamada","Área","Nivel","Supervisor","Puntaje","Nivel General","Recomendación"]];
  evals.forEach(e => {
    rows.push([
      e.fecha_llamada||"",
      e.asesor||"",
      e.id_llamada||"",
      e.area_nivel_label||"",
      e.nivel||"",
      e.supervisor||"",
      (e.puntaje_total||0).toFixed(2),
      e.nivel_general||"",
      (e.recomendaciones||"").replace(/\n/g," ").substring(0,500)
    ]);
  });
  // Hoja 2: detalle de criterios (todo en una sola CSV con sección)
  rows.push(["","","","","","","","",""]);
  rows.push(["═══ DETALLE DE CRITERIOS ═══","","","","","","","",""]);
  rows.push(["Fecha","Asesor","ID Llamada","Sección","Criterio","Nivel","Puntaje","Justificación SONAR",""]);
  evals.forEach(e => {
    (e.criterios||[]).forEach(c => {
      rows.push([
        e.fecha_llamada||"",
        e.asesor||"",
        e.id_llamada||"",
        c.seccion||"",
        c.criterio||"",
        c.nivel||"",
        c.puntaje||0,
        (c.razon||"").replace(/\n/g," ").substring(0,300),
        ""
      ]);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const fecha = new Date().toISOString().split("T")[0];
  a.download = `SONAR_Seguimiento_Asesores_${fecha}.csv`;
  a.click();
}

// PERSISTENCIA (localStorage)
// ═════════════════════════════════════════════════════════════════════

function storageKey(scriptId, pais) {
  return STORAGE_PREFIX + scriptId + "_" + pais;
}

function cargarScript(scriptId, pais) {
  if (DEMO_MODE) {
    return JSON.parse(JSON.stringify(SCRIPTS_BASE_INICIAL[scriptId]));
  }
  const key = storageKey(scriptId, pais);
  const raw = localStorage.getItem(key);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      return data.versiones[0].script;
    } catch(e) { console.error("Error parsing storage", e); }
  }
  // Si es variante de país y no existe, heredar del script base
  if (pais !== "BASE") {
    const baseRaw = localStorage.getItem(storageKey(scriptId, "BASE"));
    if (baseRaw) {
      try {
        return JSON.parse(baseRaw).versiones[0].script;
      } catch(e) {}
    }
  }
  // Si no existe nada, devolver el seed inicial
  return JSON.parse(JSON.stringify(SCRIPTS_BASE_INICIAL[scriptId]));
}

function cargarHistorial(scriptId, pais) {
  if (DEMO_MODE) {
    return [
      { v: 3, script: null, autor: "Elizabeth Juárez", fecha: hoy(-1), current: true },
      { v: 2, script: null, autor: "María González (MX)", fecha: hoy(-7) },
      { v: 1, script: null, autor: "Elizabeth Juárez", fecha: hoy(-14) },
    ];
  }
  const key = storageKey(scriptId, pais);
  const raw = localStorage.getItem(key);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      return data.versiones;
    } catch(e) {}
  }
  return [];
}

function guardarVersion(scriptId, pais, scriptObj) {
  if (DEMO_MODE) {
    mostrarToast("Modo Demo: cambios no persistidos");
    return true;
  }
  const key = storageKey(scriptId, pais);
  const raw = localStorage.getItem(key);
  let data = { versiones: [] };
  if (raw) {
    try { data = JSON.parse(raw); } catch(e) {}
  }
  // Marcar versiones anteriores como no actuales
  data.versiones.forEach(v => v.current = false);
  // Nueva versión al inicio
  const nuevaV = data.versiones.length > 0 ? data.versiones[0].v + 1 : 1;
  data.versiones.unshift({
    v: nuevaV,
    script: JSON.parse(JSON.stringify(scriptObj)),
    autor: usuarioActual.nombre + (usuarioActual.pais ? ` (${usuarioActual.pais})` : ""),
    fecha: new Date().toISOString(),
    current: true
  });
  // Mantener solo las últimas MAX_VERSIONES
  data.versiones = data.versiones.slice(0, MAX_VERSIONES);
  try {
    localStorage.setItem(key, JSON.stringify(data));
    // ★ La pieza que conecta el Editor con la evaluación real ★
    // Publicar la variante BASE es lo que Evaluador/Lote leen de verdad.
    // Las variantes por país (MX/CR/GT/SV/NI) siguen viviendo solo aquí
    // en el Editor por ahora — Evaluador/Lote hoy no distinguen país.
    if (pais === "BASE") {
      publicarComoRubricaViva(scriptId, scriptObj);
    }
    return true;
  } catch(e) {
    mostrarToast("Error al guardar (¿memoria llena?)", true);
    return false;
  }
}

function publicarComoRubricaViva(scriptId, scriptObj) {
  const SCRIPT_PERSONALIZADO_KEY = "sonar_script_personalizado";
  let personalizados = {};
  try { personalizados = JSON.parse(localStorage.getItem(SCRIPT_PERSONALIZADO_KEY) || "{}"); } catch(e) {}
  personalizados[scriptId] = {
    nombre_archivo: "Editor de rúbricas · " + (usuarioActual?.nombre || "—"),
    cargado_en: new Date().toISOString(),
    secciones: JSON.parse(JSON.stringify(scriptObj.secciones)),
    ...(scriptObj.modoPuntaje === "puntos_directos" ? { modo_puntaje: "puntos_directos" } : {}),
    ...(scriptObj.erroresFatales && scriptObj.erroresFatales.length
      ? { errores_fatales: JSON.parse(JSON.stringify(scriptObj.erroresFatales)) }
      : {})
  };
  localStorage.setItem(SCRIPT_PERSONALIZADO_KEY, JSON.stringify(personalizados));
}

function hoy(diasAtras = 0) {
  const d = new Date();
  d.setDate(d.getDate() + diasAtras);
  return d.toISOString();
}

function formatearFecha(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const hoy = new Date();
  const diff = Math.floor((hoy - d) / (1000*60*60*24));
  if (diff === 0) return "Hoy, " + d.toTimeString().slice(0,5);
  if (diff === 1) return "Ayer, " + d.toTimeString().slice(0,5);
  if (diff < 7) return `Hace ${diff} días`;
  return d.toLocaleDateString("es-MX", { day:"numeric", month:"short" });
}

function iniciarEditorConSesionGlobal() {
  const session = (window.Sonar && window.Sonar.getSession) ? window.Sonar.getSession() : null;
  if (!session) {
    // No debería pasar (el router ya exige login antes de mostrar cualquier vista),
    // pero por seguridad mostramos un mensaje claro en vez de tronar en silencio.
    const cont = document.getElementById("editor-view");
    if (cont) cont.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray-500)">No se detectó una sesión activa. Vuelve a Configuración y recarga SONAR.</div>';
    return;
  }
  usuarioActual = { nombre: session.nombre, rol: session.rol, pais: session.pais, usuario: session.usuario };
  if (session.rol === "lider_pais") {
    paisActual = session.pais;
  }
  iniciarEditor();
}

function iniciarEditor() {
  poblarSelectores();
  actualizarUserPill();
  cargarScriptActual();
}

function actualizarUserPill() {
  const pill = document.getElementById("user-pill");
  const dot = document.getElementById("role-dot");
  const display = document.getElementById("user-display");
  if (!usuarioActual) return;
  if (usuarioActual.rol === "calidad_central") {
    dot.className = "role-dot";
    display.textContent = usuarioActual.nombre + " · Calidad Central";
  } else {
    dot.className = "role-dot lider";
    display.textContent = usuarioActual.nombre + " · Líder " + PAISES[usuarioActual.pais];
  }
}

function poblarSelectores() {
  const scriptSel = document.getElementById("script-select");
  scriptSel.innerHTML = SCRIPTS_DISPONIBLES.map(s =>
    `<option value="${s.id}" ${s.id===scriptActual?"selected":""}>${s.label}</option>`
  ).join("");

  const paisSel = document.getElementById("pais-select");
  // Calidad central puede ver base y todos los países
  // Líderes solo ven su propio país
  if (usuarioActual.rol === "calidad_central") {
    const opciones = [{ id: "BASE", nombre: "Script base (global)" }]
      .concat(Object.entries(PAISES).map(([k,v]) => ({ id: k, nombre: v })));
    paisSel.innerHTML = opciones.map(o =>
      `<option value="${o.id}" ${o.id===paisActual?"selected":""}>${o.nombre}</option>`
    ).join("");
    paisSel.disabled = false;
  } else {
    paisSel.innerHTML = `<option value="${usuarioActual.pais}">${PAISES[usuarioActual.pais]} (tu país)</option>`;
    paisSel.disabled = true;
    paisActual = usuarioActual.pais;
  }
}

function cambiarScript() {
  if (dirty && !confirm("Hay cambios sin publicar. ¿Cambiar de script?")) {
    document.getElementById("script-select").value = scriptActual;
    return;
  }
  scriptActual = document.getElementById("script-select").value;
  cargarScriptActual();
}

function cambiarPais() {
  if (dirty && !confirm("Hay cambios sin publicar. ¿Cambiar de país?")) {
    document.getElementById("pais-select").value = paisActual;
    return;
  }
  paisActual = document.getElementById("pais-select").value;
  cargarScriptActual();
}

function cargarScriptActual() {
  scriptData = cargarScript(scriptActual, paisActual);
  dirty = false;
  renderEditor();
  renderHistorial();
  actualizarVariantIndicator();
}

function actualizarVariantIndicator() {
  const ind = document.getElementById("variant-indicator");
  const key = storageKey(scriptActual, paisActual);
  const tieneVariante = !DEMO_MODE && localStorage.getItem(key) !== null;
  if (paisActual === "BASE") {
    ind.innerHTML = '<span class="variant-pill base">Script base · todos los países lo heredan</span>';
  } else if (tieneVariante) {
    ind.innerHTML = '<span class="variant-pill custom">Variante propia de ' + PAISES[paisActual] + '</span>';
  } else {
    ind.innerHTML = '<span class="variant-pill base">Heredado del script base</span>';
  }
}

function renderEditor() {

  const cont = document.getElementById("sections-list");

      <div class="sec-head" onclick="if(event.target.tagName!=='INPUT' && event.target.tagName!=='BUTTON')toggleSeccion(${si})">
        <span class="sec-drag" title="Arrastra para reordenar">⋮⋮</span>
        <span class="sec-num">${si+1}</span>
        <div class="sec-title">
          <input type="text" value="${escapeAttr(sec.titulo)}" onchange="setTituloSeccion(${si},this.value)" onclick="event.stopPropagation()">
        </div>
        ${modoPuntos
          ? `<span class="sec-peso" title="Se calcula solo, sumando los puntos de sus criterios">Peso (auto) <strong style="color:var(--verde)">${pesoAuto}%</strong></span>`
          : `<span class="sec-peso">Peso <input type="number" min="0" max="100" value="${sec.peso}" onchange="setPesoSeccion(${si},this.value)" onclick="event.stopPropagation()">%</span>`

        <span class="sec-actions">
          <button class="icon-btn danger" onclick="event.stopPropagation();eliminarSeccion(${si})" title="Eliminar sección">🗑</button>

        </div>
        <div class="lvl lvl-def">

function escapeAttr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function toggleSeccion(si) {

function setTituloSeccion(si, val) {
  scriptData.secciones[si].titulo = val;
  marcarDirty();
}

function setPesoSeccion(si, val) {
  scriptData.secciones[si].peso = Math.max(0, Math.min(100, parseInt(val) || 0));
  marcarDirty();
  validar();
}

function setCriterioNombre(si, ci, val) {
  scriptData.secciones[si].criterios[ci].n = val;
  marcarDirty();
  validar();
}

function setNivel(si, ci, nivel, val) {
  scriptData.secciones[si].criterios[ci][nivel] = val;

}

// ═════════════════════════════════════════════════════════════════════
// MODO DE PUNTAJE — clásico (peso por sección, criterios parejos)
// vs. puntos directos (cada criterio pesa lo que tú le asignes)
// ═════════════════════════════════════════════════════════════════════

function actualizarBarraModoPuntaje() {
  const modoPuntos = scriptData.modoPuntaje === "puntos_directos";
  const btnClasico = document.getElementById("btn-modo-clasico");
  const btnPuntos = document.getElementById("btn-modo-puntos");
  const help = document.getElementById("modo-puntaje-help");
  if (!btnClasico || !btnPuntos) return;
  btnClasico.classList.toggle("active", !modoPuntos);
  btnPuntos.classList.toggle("active", modoPuntos);
  help.textContent = modoPuntos
    ? "Cada criterio vale sus propios puntos — úsalo cuando algunos criterios importan más que otros dentro de la misma sección"
    : "Todos los criterios de una sección pesan igual entre sí — el peso se define por sección completa";
}

function cambiarModoPuntaje(modo) {
  if (scriptData.modoPuntaje === modo) return;
  if (modo === "puntos_directos") {
    // Al cambiar a puntos directos, reparte 100 puntos entre todos los
    // criterios existentes de forma proporcional al peso de su sección,
    // para no dejar todo en 0 de golpe.
    const totalCriterios = scriptData.secciones.reduce((s,sec)=>s+sec.criterios.length,0) || 1;
    scriptData.secciones.forEach(sec => {
      const puntosPorCriterio = Math.round((sec.peso || 0) / (sec.criterios.length || 1));
      sec.criterios.forEach(c => { if (c.puntosMax == null) c.puntosMax = puntosPorCriterio; });
    });
  }
  scriptData.modoPuntaje = modo;
  marcarDirty();
  renderEditor();
}

function setCriterioPuntos(si, ci, val) {
  scriptData.secciones[si].criterios[ci].puntosMax = Math.max(0, Math.min(100, parseInt(val) || 0));
  // El peso de la sección se recalcula solo, como suma de sus criterios
  scriptData.secciones[si].peso = scriptData.secciones[si].criterios.reduce((s,c)=>s+(parseInt(c.puntosMax)||0),0);
  marcarDirty();
  renderEditor();
}
