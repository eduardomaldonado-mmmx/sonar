            if (razonEl && r.razon) {
              razonEl.textContent = "SONAR: " + r.razon;
              razonEl.className = "ia-razon has-razon";
            }
          }
        });
      });
      // Mostrar recomendaciones
      document.getElementById("recomendaciones-panel").style.display="block";
      document.getElementById("recomendaciones-content").textContent = "[MODO DEMO] " + demo.recomendaciones;
      setStep(5, 100);
      document.getElementById("prog-spinner").style.display="none";
      document.getElementById("prog-title").textContent="✓ Evaluación demo completada — esto es una simulación con datos de ejemplo";
      setTimeout(()=>{document.getElementById("ai-progress").style.display="none";},2500);
      document.getElementById("btn-evaluar").disabled=false;
      return;
    } catch (e) {
      showError("Error en modo demo: " + e.message);
      return;
    }
  }
  // ───── FIN RAMA MODO DEMO ─────

  if(!audioFile && !textoTranscripcion){showError("Pega la transcripción o sube un archivo Word/TXT primero.");return;}
  const areaKey = currentArea === "credito" ? API_KEYS.credito : API_KEYS.cobranza;
  if(!areaKey || areaKey === _PH_ANTHROPIC){showError("La API Key del área " + (currentArea==="credito"?"Crédito":"Cobranza") + " no está configurada. Edita el archivo HTML y pega tu API Key de Anthropic.");return;}
  document.getElementById("error-box").style.display="none";
  if(document.getElementById("btn-evaluar"))document.getElementById("btn-evaluar").disabled=true;
  if(document.getElementById("btn-evaluar-texto"))document.getElementById("btn-evaluar-texto").disabled=true;
  document.getElementById("ai-progress").style.display="block";
  document.getElementById("resultado-panel").style.display="none";
  setStep(1,5);
  try{
    // ───── NUEVA LÓGICA: usa transcripción directa (no audio) ─────
    // Obtener transcripción: del textarea o del archivo subido
    let transcript = "";
    if (textoTranscripcion && textoTranscripcion.trim().length > 0) {
      transcript = textoTranscripcion.trim();
    } else if (audioFile) {
      transcript = await leerArchivoTranscripcion(audioFile);
    }

    if (!transcript || transcript.length < 50) {
      throw new Error("La transcripción está vacía o es muy corta (mínimo 50 caracteres). Pega una transcripción real de la llamada.");
    }

    setStep(2,25);
    document.getElementById("transcript-section").style.display="block";
    document.getElementById("transcript-content").textContent=transcript;
    setStep(3,50);

    const areaData=getAreaData()||(currentArea==="credito"?SCRIPTS.credito:SCRIPTS.cobranza[currentNivel]);
    const criteriaList=currentSecciones.flatMap(sec=>sec.criterios.map(c=>`- ID: ${c.id} | Sección: ${sec.titulo} | Criterio: ${c.n} | Excelente: ${c.exc} | Aceptable: ${c.ace} | Deficiente: ${c.def} | Crítico: ${c.cri}`)).join("\n");
    const allIds=currentSecciones.flatMap(sec=>sec.criterios.map(c=>c.id));
    const tieneErroresFatales = areaData && areaData.errores_fatales && areaData.errores_fatales.length;
    const erroresFatalesList = tieneErroresFatales
      ? areaData.errores_fatales.map(ef=>`- ID: ${ef.id} | ${ef.n}: ${ef.desc}`).join("\n")
      : "";

    // ★ NUEVO: cargar el script oficial asociado a la cédula, si existe.
    // El script NO altera la rúbrica ni agrega criterios — es contexto normativo.
    const _cedulaId = currentArea === "credito" ? "credito"
                     : currentArea === "ventas"  ? "ventas"
                     : "cobranza_" + (currentNivel || "");
    const _scriptOficial = (window.SonarScripts && typeof window.SonarScripts.toPromptBlock === "function")
      ? window.SonarScripts.toPromptBlock(_cedulaId) : null;
    const scriptBlock = _scriptOficial ? `
SCRIPT OFICIAL DE REFERENCIA (cédula "${_scriptOficial.cedula_label}", ${_scriptOficial.nombre} v${_scriptOficial.version}):
${_scriptOficial.texto}

REGLAS DE USO DEL SCRIPT (LEE ANTES DE EVALUAR):
- La RÚBRICA de arriba es la única fuente de qué se evalúa y cómo se califica.
- Este SCRIPT es material normativo consultivo. Úsalo SOLO cuando un criterio de la rúbrica pregunte por apego a guion, uso de frases específicas u omisión de pasos oficiales.
- NO crees criterios nuevos derivados del script. NO puntúes nada que no esté explícitamente en la rúbrica.
- Si un criterio de la rúbrica NO se refiere al script, ignora el script para ese criterio.
- Cuando cites el script en una "razon", indícalo explícitamente (por ejemplo: "según el script oficial, en Perfilamiento debía preguntar por...").
` : "";

    setStep(4,65);

    const evalPrompt=`Eres un experto evaluador de calidad de llamadas para MultiMoney México.

ÁREA A EVALUAR: ${areaData.label}
DESCRIPCIÓN: ${areaData.descripcion}
TONO ESPERADO: ${areaData.tono}

TRANSCRIPCIÓN DE LA LLAMADA:
${transcript}

CRITERIOS DE EVALUACIÓN:
${criteriaList}
${tieneErroresFatales ? `
ERRORES FATALES (si detectas CUALQUIERA de estos, el puntaje total de la llamada se anula a 0 — sé estricto pero justo, solo márcalos si realmente ocurrieron):
${erroresFatalesList}
` : ""}
${scriptBlock}

INSTRUCCIONES:
1. Extrae los METADATOS de la llamada analizando la transcripción.
2. Evalúa CADA criterio con uno de estos niveles: exc (Excelente=10), ace (Aceptable=7), def (Deficiente=4), cri (Crítico=1).
3. Sé objetivo y específico citando momentos reales de la transcripción.
4. Para el ID de llamada, genera uno con formato YYYYMMDD-HHMM-XXX (si no tienes hora, usa 0000).
5. Para el asesor: extrae el nombre que se identifica al inicio. Si no se identifica, escribe "No identificado".
6. Para la fecha: si la transcripción menciona fecha úsala, si no usa la fecha actual ${new Date().toISOString().split("T")[0]}.
${tieneErroresFatales ? "7. Revisa la lista de ERRORES FATALES y devuelve los IDs de los que SÍ ocurrieron (lista vacía si ninguno)." : ""}

Responde ÚNICAMENTE con JSON válido (sin markdown) con esta estructura:
{
  "metadatos": {
    "asesor": "Nombre completo del asesor extraído de la transcripción",
    "cliente": "Nombre del cliente si se menciona, o 'Cliente' genérico",
    "id_llamada": "20260518-1430-001",
    "fecha": "2026-05-18",
    "duracion_estimada_minutos": 8
  },
  "evaluacion": {
    ${allIds.map(id=>`"${id}": {"nivel": "exc|ace|def|cri", "razon": "Justificación citando la llamada"}`).join(",\n    ")}
  },${tieneErroresFatales ? `
  "errores_fatales_detectados": ["ID_del_error_fatal_si_ocurrió"],` : ""}
  "recomendaciones": "Coaching de 4-5 oraciones: 1 reconocimiento específico, 2-3 áreas críticas con el guion exacto que debió usar según el script del área, y 1 compromiso concreto para las próximas llamadas."
}`;

    const evalResp=await callAPI([{role:"user",content:evalPrompt}],3500,false,areaKey);
    setStep(5,90);
    let data;
    try{const clean=evalResp.replace(/```json|```/g,"").trim();data=JSON.parse(clean);}
    catch(e){const m=evalResp.match(/\{[\s\S]*\}/);if(m)data=JSON.parse(m[0]);else throw new Error("No se pudo interpretar la respuesta de la IA.");}

    // ───── NUEVO: Autollenado de metadatos sugeridos por IA ─────
    if (data.metadatos) {
      const meta = data.metadatos;
      const campoAsesor = document.getElementById("f-asesor");
      const campoId = document.getElementById("f-id");
      const campoFecha = document.getElementById("f-fecha");
      // Solo llenar si están vacíos (no pisar valores que el usuario ya escribió)
      if (campoAsesor && !campoAsesor.value && meta.asesor) campoAsesor.value = meta.asesor;
      if (campoId && !campoId.value && meta.id_llamada) campoId.value = meta.id_llamada;
      if (campoFecha && !campoFecha.value && meta.fecha) campoFecha.value = meta.fecha;
      // Guardar metadatos para uso posterior (al guardar evaluación)
      window._sonarMetadatosSugeridos = meta;
      // Mostrar panel de confirmación
      mostrarConfirmacionMetadatos(meta);
    }

    const ev=data.evaluacion||{};
    currentSecciones.forEach((sec,si)=>{
      sec.criterios.forEach(c=>{
        const r=ev[c.id];
        if(r&&r.nivel&&SCORES[r.nivel]!==undefined){
          pick(c.id,r.nivel,si);
          const razonEl=document.getElementById("razon-"+c.id);
          if(razonEl&&r.razon){razonEl.textContent="SONAR: "+r.razon;razonEl.className="ia-razon has-razon";}
        }
      });
    });
    // Aplicar errores fatales sugeridos por la IA (el supervisor puede corregir con un clic)
    if (Array.isArray(data.errores_fatales_detectados)) {
      data.errores_fatales_detectados.forEach(efId => {
        erroresFatalesMarcados[efId] = true;
        const btn = document.getElementById("ef-btn-" + efId);
        if (btn) { btn.textContent = "🚫 SÍ ocurrió"; btn.style.background = "#d63333"; btn.style.color = "white"; }
      });
      if (data.errores_fatales_detectados.length) updateResultado();
    }
    if(data.recomendaciones){
      document.getElementById("recomendaciones-panel").style.display="block";
      document.getElementById("recomendaciones-content").textContent=data.recomendaciones;
    }
    // Guardar datos completos de la evaluación para botón "Guardar para seguimiento"
    window._sonarEvaluacionActual = data;
    mostrarBotonGuardar();

    setStep(5,100);
    document.getElementById("prog-spinner").style.display="none";
    document.getElementById("prog-title").textContent="✓ Evaluación completada — revisa, ajusta y guarda para el seguimiento del asesor";
    setTimeout(()=>{document.getElementById("ai-progress").style.display="none";},2000);
    if(document.getElementById("btn-evaluar"))document.getElementById("btn-evaluar").disabled=false;
    if(document.getElementById("btn-evaluar-texto"))document.getElementById("btn-evaluar-texto").disabled=false;
  }catch(err){showError(err.message);if(document.getElementById("btn-evaluar"))document.getElementById("btn-evaluar").disabled=false;if(document.getElementById("btn-evaluar-texto"))document.getElementById("btn-evaluar-texto").disabled=false;}
}

async function callAPI(messages,maxTokens,_unused,apiKey){
  const headers={"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages})});
  const data=await resp.json();
  if(data.error)throw new Error(data.error.message);
  return data.content[0].text;
}

function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}

function escapeHTML(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function guardarEvaluacion() {
  if (!window._sonarEvaluacionActual) {
    mostrarToast("No hay evaluación para guardar", true);
    return;
  }
  const asesor = (document.getElementById("f-asesor")?.value || "").trim();
  const idLlamada = (document.getElementById("f-id")?.value || "").trim();
  const fecha = (document.getElementById("f-fecha")?.value || "").trim();
  const supervisor = (document.getElementById("f-supervisor")?.value || "").trim();

  if (!asesor) {
    mostrarToast("Ingresa el nombre del asesor antes de guardar", true);
    document.getElementById("f-asesor")?.focus();
    return;
  }
  if (!fecha) {
    mostrarToast("Ingresa la fecha de la llamada", true);
    document.getElementById("f-fecha")?.focus();
    return;
  }

  // Construir registro completo
  const areaNivel = currentArea === "credito" ? "Validación de Crédito" : (currentArea === "ventas" ? "Ventas Nuevas — Digital" : (SCRIPTS.cobranza[currentNivel]?.label || "Cobranza"));
  const totalScore = parseFloat(calcTotal()) || 0;
  const erroresFatalesActivos = Object.keys(erroresFatalesMarcados).filter(k => erroresFatalesMarcados[k]);
  const areaDataGuardar = getAreaData();
  const erroresFatalesNombres = erroresFatalesActivos.map(efId => {
    const ef = areaDataGuardar?.errores_fatales?.find(e => e.id === efId);
    return ef ? ef.n : efId;
  });

  // Recolectar criterios evaluados con sus razones
  const criterios = [];
  // También capturar las observaciones por criterio que el supervisor pudo escribir
  currentSecciones.forEach(sec => {
    sec.criterios.forEach(c => {
      const nivel = evaluacion[c.id];
      const razon = document.getElementById("razon-"+c.id)?.textContent.replace(/^SONAR: /,"") || "";
      const observacion = (document.getElementById("obs-"+c.id)?.value || "").trim();
      criterios.push({
        id: c.id,
        seccion: sec.titulo,
        criterio: c.n,
        nivel: nivel || "",
        puntaje: nivel ? SCORES[nivel] : 0,
        razon: razon,
        observacion_supervisor: observacion
      });
    });
  });

  // ★ NUEVO: capturar criterios extra que el supervisor agregó por rubro
  const rubrosSupervisor = currentSecciones
    .filter(sec => sec.criterios_supervisor && sec.criterios_supervisor.trim())
    .map(sec => ({ rubro: sec.titulo, criterios_extra: sec.criterios_supervisor.trim() }));

  // ★ NUEVO: capturar comentarios y calificación del supervisor de calidad
  const supComentarios = (document.getElementById("sup-calidad-comentarios")?.value || "").trim();
  const supNivel = document.getElementById("sup-calidad-nivel")?.value || "";
  const supPuntajeRaw = document.getElementById("sup-calidad-puntaje")?.value;
  const supPuntaje = (supPuntajeRaw !== "" && supPuntajeRaw != null) ? parseFloat(supPuntajeRaw) : null;

  const registro = {
    id: "EV" + Date.now(),
    fecha_guardado: new Date().toISOString(),
    asesor: asesor,
    id_llamada: idLlamada || ("LL" + Date.now()),
    fecha_llamada: fecha,
    supervisor: supervisor || "—",
    area: currentArea,
    nivel: currentNivel,
    area_nivel_label: areaNivel,
    puntaje_total: totalScore,
    nivel_general: erroresFatalesNombres.length ? "Crítico — Error Fatal" : (totalScore >= 9 ? "Excelente" : totalScore >= 7 ? "Aceptable" : totalScore >= 4 ? "Deficiente" : "Crítico"),
    errores_fatales_detectados: erroresFatalesNombres,
    criterios: criterios,
    rubros_supervisor: rubrosSupervisor,
    // Evaluación complementaria del Supervisor de Calidad
    supervisor_calidad: {
      comentarios: supComentarios,
      nivel_asignado: supNivel,
      puntaje: (supPuntaje !== null && !isNaN(supPuntaje)) ? supPuntaje : null
    },
    recomendaciones: document.getElementById("recomendaciones-content")?.textContent.replace(/^\[MODO DEMO\] /,"") || "",
    metadatos_sugeridos: window._sonarMetadatosSugeridos || {}
  };

  // Guardar en localStorage
  let historico = [];
  try { historico = JSON.parse(localStorage.getItem(SEGUIMIENTO_KEY) || "[]"); } catch(e) { historico = []; }
  historico.unshift(registro); // Más recientes primero
  // Limitar a 500 evaluaciones (más que suficiente para demo + meses de uso)
  if (historico.length > 500) historico = historico.slice(0, 500);
  try {
    localStorage.setItem(SEGUIMIENTO_KEY, JSON.stringify(historico));
    mostrarToast("✓ Evaluación guardada para seguimiento de " + asesor);
    const btn = document.getElementById("btn-guardar-seguimiento");
    if (btn) {
      btn.textContent = "✓ Guardada";
      btn.style.background = "#00995A";
      btn.disabled = true;
    }
  } catch (e) {
    mostrarToast("Error al guardar: " + e.message, true);
  }
}

function mostrarToast(msg, isError) {
  // Crear toast si no existe
  let toast = document.getElementById("sonar-toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "sonar-toast";
    toast.style.cssText = "position:fixed;bottom:24px;right:24px;padding:14px 22px;border-radius:8px;font-weight:700;font-size:14px;box-shadow:0 4px 24px rgba(0,0,0,.6);z-index:9999;font-family:Arial;display:none;animation:slideUp .3s ease-out;max-width:380px";
    document.body.appendChild(toast);
    const style = document.createElement("style");
    style.textContent = "@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}";
    document.head.appendChild(style);
  }
  toast.style.background = isError ? "#E05050" : "#00C170";
  toast.style.color = isError ? "white" : "#0D0D0D";
  toast.textContent = msg;
  toast.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { toast.style.display = "none"; }, 3500);
}

function exportarCSV(){
  if(!currentSecciones.length){alert("Selecciona un área y completa una evaluación primero.");return;}
  const asesor=document.getElementById("f-asesor").value||"";
  // ID se autogenera (ya no hay campo manual)
  const fecha=document.getElementById("f-fecha").value||"";
  const id="LL"+Date.now();
  const sup=document.getElementById("f-supervisor").value||"";
  const areaNivel=currentArea==="credito"?"Validación de Crédito":(currentArea==="ventas"?"Ventas Nuevas — Digital":(SCRIPTS.cobranza[currentNivel]?.label||"Cobranza"));
  let rows=[["Área","Asesor","ID Llamada","Fecha","Supervisor","Sección","Criterio","Nivel","Puntaje","Justificación SONAR","Observaciones"]];
  currentSecciones.forEach(sec=>{
    sec.criterios.forEach(c=>{
      const nivel=evaluacion[c.id];
      const razon=document.getElementById("razon-"+c.id)?.textContent.replace(/^SONAR: /,"")||"";
      const obs=document.getElementById("obs-"+c.id)?.value||"";
      rows.push([areaNivel,asesor,id,fecha,sup,sec.titulo,c.n,nivel?LABELS[nivel]:"",nivel?SCORES[nivel]:"",razon,obs]);
    });
  });
  rows.push(["","","","","","","","TOTAL",calcTotal()||"","",""]);
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`SONAR_evaluacion_${areaNivel.replace(/\s/g,"_")}_${(asesor||"asesor").replace(/\s/g,"_")}_${fecha||"sin_fecha"}.csv`;
  a.click();
}

}

// Genera evaluación demo simulada para una fila
function generarEvalDemo(currentSecciones, area, nivel, asesor) {
  const r = Math.random();
  let perfil;
  if (area === "credito") {
    perfil = r < 0.55 ? "exc" : (r < 0.85 ? "mixto" : "def");
  } else if (nivel === "m30" || nivel === "inbound") {
    perfil = r < 0.65 ? "exc" : "mixto";
  } else if (nivel === "m90") {
    perfil = r < 0.3 ? "exc" : (r < 0.7 ? "mixto" : "def");
  } else {
    perfil = r < 0.2 ? "mixto" : "def";
  }
  let transcripcion;
  if (area === "credito") {
    transcripcion = perfil === "def" ? DEMO_TRANSCRIPCIONES.deficiente : DEMO_TRANSCRIPCIONES.buena_credito;
  } else if (perfil === "exc") {
    transcripcion = DEMO_TRANSCRIPCIONES.buena_cobranza;
  } else if (perfil === "mixto") {
    transcripcion = DEMO_TRANSCRIPCIONES.regular;
  } else {
    transcripcion = DEMO_TRANSCRIPCIONES.deficiente;
  }
  transcripcion = transcripcion.replace(/\[asesor\]/g, asesor || "Asesor").replace(/\[cliente\]/g, "Cliente");
  const distribucion = {
    exc: {exc: 0.7, ace: 0.25, def: 0.05, cri: 0},
    mixto: {exc: 0.35, ace: 0.4, def: 0.2, cri: 0.05},
    def: {exc: 0.05, ace: 0.2, def: 0.45, cri: 0.3}
  };
  const dist = distribucion[perfil];
  const razones = {
    exc: ["Cumple con el script siguiendo las frases requeridas.", "Ejecuta correctamente este criterio.", "Aplica el procedimiento sin omisiones."],
    ace: ["Cumple parcialmente, le falta algún detalle del script.", "Realiza la acción sin la fluidez total.", "Cubre el criterio aceptablemente."],
    def: ["Omite elementos importantes del script.", "Cumplimiento incompleto del criterio.", "Pasa rápido sin profundizar como pide el script."],
    cri: ["Omisión total de este criterio crítico.", "No se ejecuta el procedimiento requerido.", "Falta grave: no aparece en la llamada."]
  };
  const evaluacion = {};
  currentSecciones.forEach(sec => {
    sec.criterios.forEach(c => {
      const rnd = Math.random();
      let nivelAsig;
      if (rnd < dist.exc) nivelAsig = "exc";
      else if (rnd < dist.exc + dist.ace) nivelAsig = "ace";
      else if (rnd < dist.exc + dist.ace + dist.def) nivelAsig = "def";
      else nivelAsig = "cri";
      const arr = razones[nivelAsig];
      evaluacion[c.id] = { nivel: nivelAsig, razon: "[DEMO] " + arr[Math.floor(Math.random() * arr.length)] };
    });
  });
  const recomendaciones = {
    exc: `Excelente desempeño de ${asesor}. Domina el script y mantiene tono profesional sostenido. Refinar detalles donde obtuvo Aceptable mediante role-play.`,
    mixto: `Llamada con desempeño aceptable. ${asesor} cumple parcialmente del script. Áreas críticas detectadas requieren atención. Compromiso: revisar guion y practicar frases exactas en role-play.`,
    def: `Llamada con incumplimiento crítico. ${asesor} omitió pasos esenciales del script. Acción URGENTE: coaching antes de próxima jornada y acompañamiento de las primeras 5-10 llamadas del próximo turno.`
  };
  return { transcripcion, evaluacion, recomendaciones: "[DEMO] " + recomendaciones[perfil] };
}

function toggleDemoMode() {
  DEMO_MODE = !DEMO_MODE;
  const toggle = document.getElementById("demo-toggle");
  const label = document.getElementById("demo-toggle-label");
  const banner = document.getElementById("demo-banner");
  if (DEMO_MODE) {
    toggle.classList.add("active");
    label.textContent = "Modo Demo";
    banner.classList.add("active");
  } else {
    toggle.classList.remove("active");
    label.textContent = "Modo Real";
    banner.classList.remove("active");
  }
  updateAll();
}

// Llena las primeras N filas con datos de ejemplo (sin audio, marcado como demo)

  const cantidad = 5; // Llenamos 5 filas como ejemplo

    const ej = DEMO_FILAS_EJEMPLO[i];
    filas[i].asesor = ej.asesor;
    filas[i].area = ej.area;
    filas[i].nivel = ej.nivel;
    filas[i].idLlamada = ej.idLlamada;
    filas[i].transcripcion = "DEMO_TEXTO_PLACEHOLDER"; // marcador especial para modo demo

  }
  renderFilas();
  updateAll();
}

function aaiEstaConfiguradoBatch() {
  if (!ASSEMBLYAI_API_KEY) return false;
  const k = ASSEMBLYAI_API_KEY.trim();
  return k && k !== _PH_ASSEMBLYAI && k.length >= 20;
}

function setBatchAaiStep(title, sub, progress) {
  const t = document.getElementById('batch-aai-step-title');
  const s = document.getElementById('batch-aai-step-sub');
  const p = document.getElementById('batch-aai-progress-fill');

// ─── Transcribir audio con AssemblyAI desde el editor modal del Batch ───
async function transcribirAudioBatch(idx, file) {
  if (!file) return;
  if (!aaiEstaConfiguradoBatch()) {
    alert('La API Key de AssemblyAI no está configurada en la zona de configuración.');
    return;
  }
  // Validar tamaño
  const MAX_SIZE = 100 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    alert(`Archivo demasiado grande (${(file.size/1024/1024).toFixed(1)} MB). Máximo recomendado: 100 MB.`);
    return;
  }

  const progressEl = document.getElementById('batch-aai-progress');
  if (progressEl) progressEl.style.display = 'block';

  try {
    // PASO 1: Subir
    setBatchAaiStep('📤 Subiendo audio...', 'Transferencia a AssemblyAI', 15);
    const uploadResp = await fetch('https://api.assemblyai.com/v2/upload', {
      method: 'POST',
      headers: { 'authorization': ASSEMBLYAI_API_KEY, 'content-type': 'application/octet-stream' },
      body: file
    });
    if (!uploadResp.ok) {
      const errText = await uploadResp.text();
      throw new Error(`Error al subir (${uploadResp.status}): ${errText.slice(0,200)}`);
    }
    const uploadData = await uploadResp.json();
    const audioUrl = uploadData.upload_url;
    if (!audioUrl) throw new Error('AssemblyAI no devolvió URL');

    // PASO 2: Solicitar transcripción
    setBatchAaiStep('🤖 AssemblyAI procesando...', 'Identificando hablantes', 35);
    const submitResp = await fetch('https://api.assemblyai.com/v2/transcript', {
      method: 'POST',
      headers: { 'authorization': ASSEMBLYAI_API_KEY, 'content-type': 'application/json' },
      body: JSON.stringify({
        audio_url: audioUrl,
        speech_models: ['universal-3-pro', 'universal-2'],
        language_code: 'es',
        speaker_labels: true,
        punctuate: true,
        format_text: true
      })
    });
    if (!submitResp.ok) {
      const errText = await submitResp.text();
      throw new Error(`Error al solicitar transcripción: ${errText.slice(0,200)}`);
    }
    const submitData = await submitResp.json();
    const transcriptId = submitData.id;

    // PASO 3: Polling
    let intentos = 0;
    const maxIntentos = 120;
    let transcriptData = null;
    while (intentos < maxIntentos) {
      await new Promise(r => setTimeout(r, 3000));
      intentos++;
      const progresoUI = 35 + Math.min(50, intentos * 2);
      setBatchAaiStep('🤖 AssemblyAI transcribiendo...', `Procesando audio (${intentos * 3}s transcurridos)`, progresoUI);
      const pollResp = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}`, {
        headers: { 'authorization': ASSEMBLYAI_API_KEY }
      });
      if (!pollResp.ok) {
        const errText = await pollResp.text();
        throw new Error(`Error consultando transcripción: ${errText.slice(0,200)}`);
      }
      transcriptData = await pollResp.json();
      if (transcriptData.status === 'completed') break;
      if (transcriptData.status === 'error') {
        throw new Error('AssemblyAI error: ' + (transcriptData.error || 'desconocido'));
      }
    }
    if (!transcriptData || transcriptData.status !== 'completed') {
      throw new Error('Transcripción excedió tiempo máximo (6 min)');
    }

    // PASO 4: Construir texto con ASESOR/CLIENTE
    setBatchAaiStep('✓ Transcripción lista', 'Insertando en el editor', 95);
    let textoTranscrito = '';
    if (transcriptData.utterances && transcriptData.utterances.length > 0) {
      const speakers = {};
      transcriptData.utterances.forEach(u => {
        if (!speakers[u.speaker]) speakers[u.speaker] = [];
        speakers[u.speaker].push(u.text);
      });
      let asesorSpeaker = Object.keys(speakers)[0];
      for (const sid of Object.keys(speakers)) {
        const todo = speakers[sid].join(' ').toLowerCase();
        if (todo.includes('multimoney') || todo.includes('multi money') ||
            todo.includes('le saluda') || todo.includes('le habla')) {
          asesorSpeaker = sid;
          break;
        }
      }
      textoTranscrito = transcriptData.utterances.map(u => {
        const etiqueta = u.speaker === asesorSpeaker ? 'ASESOR' : 'CLIENTE';
        return `${etiqueta}: ${u.text}`;
      }).join('\n');
    } else {
      textoTranscrito = transcriptData.text || '';
    }

    // Insertar en el textarea
    const ta = document.getElementById('editor-textarea');
    if (ta) {
      ta.value = textoTranscrito;
      ta.dispatchEvent(new Event('input'));
    }

    // Ocultar progreso
    setTimeout(() => {
      if (progressEl) progressEl.style.display = 'none';
    }, 1200);

  } catch (err) {
    if (progressEl) progressEl.style.display = 'none';
    alert('Error procesando audio: ' + err.message);
  }
}

function cerrarEditorTexto() {
  const overlay = document.getElementById('editor-texto-overlay');
  if (overlay) overlay.remove();
}

  const uploadResp = await fetch('https://api.assemblyai.com/v2/upload', {

  }

  if (onProgress) onProgress('Procesando con AssemblyAI...');
  const submitResp = await fetch('https://api.assemblyai.com/v2/transcript', {
    method: 'POST',
    headers: { 'authorization': ASSEMBLYAI_API_KEY, 'content-type': 'application/json' },
    body: JSON.stringify({
      audio_url: audioUrl,
      speech_models: ['universal-3-pro', 'universal-2'],
      language_code: 'es',
      speaker_labels: true,
      punctuate: true,
      format_text: true
    })
  });
  if (!submitResp.ok) {
    const errText = await submitResp.text();
    throw new Error(`Error al solicitar transcripción: ${errText.slice(0,150)}`);
  }
  const submitData = await submitResp.json();
  const transcriptId = submitData.id;

  let intentos = 0;
  const maxIntentos = 120;
  let transcriptData = null;
  while (intentos < maxIntentos) {
    await new Promise(r => setTimeout(r, 3000));
    intentos++;
    if (onProgress) onProgress(`Transcribiendo... (${intentos * 3}s)`);
    const pollResp = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}`, {
      headers: { 'authorization': ASSEMBLYAI_API_KEY }
    });
    if (!pollResp.ok) {
      const errText = await pollResp.text();
      throw new Error(`Error consultando transcripción: ${errText.slice(0,150)}`);
    }
    transcriptData = await pollResp.json();
    if (transcriptData.status === 'completed') break;
    if (transcriptData.status === 'error') {
      throw new Error('AssemblyAI: ' + (transcriptData.error || 'error desconocido'));
    }
  }
  if (!transcriptData || transcriptData.status !== 'completed') {
    throw new Error('Transcripción excedió tiempo máximo (6 min)');
  }

  // Construir texto con ASESOR/CLIENTE
  let texto = '';
  if (transcriptData.utterances && transcriptData.utterances.length > 0) {
    const speakers = {};
    transcriptData.utterances.forEach(u => {
      if (!speakers[u.speaker]) speakers[u.speaker] = [];
      speakers[u.speaker].push(u.text);
    });
    let asesorSpeaker = Object.keys(speakers)[0];
    for (const sid of Object.keys(speakers)) {
      const todo = speakers[sid].join(' ').toLowerCase();
      if (todo.includes('multimoney') || todo.includes('multi money') ||
          todo.includes('le saluda') || todo.includes('le habla')) {
        asesorSpeaker = sid;
        break;
      }
    }
    texto = transcriptData.utterances.map(u => {
      const etiqueta = u.speaker === asesorSpeaker ? 'ASESOR' : 'CLIENTE';
      return `${etiqueta}: ${u.text}`;
    }).join('\n');
  } else {
    texto = transcriptData.text || '';
  }

  // Asignar a la fila

  fila.audio_pendiente = false;
  return texto;
}

function guardarTexto(idx) {
  const ta = document.getElementById('editor-textarea');
  if (!ta) return;
  const txt = ta.value.trim();
  filas[idx].transcripcion = txt.length > 0 ? txt : null;
  filas[idx].status = 'pending';
  cerrarEditorTexto();
  renderFilas();
  updateAll();
}

async function cargarArchivoBatch(idx, file) {
  if (!file) return;
  const nombre = file.name.toLowerCase();
  const ta = document.getElementById('editor-textarea');
  try {
    let texto = '';
    if (nombre.endsWith('.txt')) {
      texto = await file.text();
    } else if (nombre.endsWith('.docx')) {
      if (typeof mammoth === 'undefined') {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('No se pudo cargar el lector de Word.'));
          document.head.appendChild(script);
        });
      }
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      texto = result.value;
    } else {
      alert('Formato no soportado. Usa .txt o .docx.');
      return;
    }
    if (ta) {
      ta.value = texto.trim();
      ta.dispatchEvent(new Event('input'));
    }
  } catch (e) {
    alert('Error al leer el archivo: ' + e.message);
  }
}

function escapeAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function isFilaComplete(f){
  // Lista cuando tiene transcripción O un audio pendiente Y la config global del lote está completa
  const tieneContenido = !!f.transcripcion || (!!f.audio_pendiente && aaiEstaConfiguradoBatch());
  if (!tieneContenido) return false;
  if (!loteConfig.asesor || !loteConfig.area) return false;
  if (loteConfig.area === 'cobranza' && !loteConfig.nivel) return false;
  return true;
}

function setField(idx, field, value){
  filas[idx][field] = value;
  filas[idx].status = 'pending';
  updateAll();
}

function setArea(idx, area){
  // Compatibilidad: si alguien aún la llama, aplicamos al lote global
  loteConfig.area = area;
  if (area === 'credito') loteConfig.nivel = 'credito';
  updateAll();
}

async function ensureMammoth() {
  if (typeof mammoth !== 'undefined') return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar Mammoth'));
    document.head.appendChild(s);
  });
}

async function cargarArchivosMultiples(fileList) {
  if (!fileList || fileList.length === 0) return;
  const arr = Array.from(fileList);
  let agregados = 0, errores = 0;

  for (const file of arr) {
    try {
      const nombre = file.name;
      const nombreLower = nombre.toLowerCase();
      let transcripcion = null;
      let audioPendiente = false;

      if (nombreLower.endsWith('.txt')) {
        transcripcion = (await file.text()).trim();
      } else if (nombreLower.endsWith('.docx')) {
        await ensureMammoth();
        const arrBuf = await file.arrayBuffer();
        const result = await mammoth.extractRawText({arrayBuffer: arrBuf});
        transcripcion = (result.value || "").trim();
      } else if (/\.(mp3|wav|m4a|mp4|ogg|webm|flac)$/i.test(nombreLower)) {
        // Audio: queda pendiente de transcripción (el usuario puede abrir editor y procesarlo)
        audioPendiente = true;
      } else {
        console.warn("Tipo de archivo no soportado:", nombre);
        errores++;
        continue;
      }

      filas.push({
        idx: filas.length,
        idLlamada: 'LB' + Date.now() + '-' + filas.length,
        transcripcion: transcripcion,
        audio_pendiente: audioPendiente,
        archivo_nombre: nombre,
        archivo_tipo: audioPendiente ? 'audio' : 'texto',
        archivo_blob: audioPendiente ? file : null,
        status: 'pending',
        transcript: '',
        evaluacion: null,
        recomendaciones: '',
        total: null,
        error: null,
        metadatos: null
      });
      agregados++;
    } catch (e) {
      console.error("Error al procesar archivo:", file.name, e);
      errores++;
    }
  }

  renderFilas();
  updateAll();

  if (agregados > 0) {
    const msg = `✓ ${agregados} archivo(s) agregados al lote` + (errores > 0 ? ` · ${errores} omitidos por formato no soportado` : '');
    showToast(msg);
  } else if (errores > 0) {
    showWarn(`No se pudo cargar ningún archivo. Formatos soportados: .txt, .docx, .mp3, .wav, .m4a, .ogg, .webm, .flac`);
  }

  document.getElementById("multi-file-input").value = "";
}

      } else {

        status.innerHTML = `<span style="color:var(--green-dark)">✓ Staff cargado</span> (${staff.total_supervisores} sup., ${staff.total_asesores} asesores) · ${fecha}`;
      }
    }
  }

  // ★ Leer los scripts que el Editor de rúbricas haya publicado ★
  // Antes el Lote no leía esto en absoluto — cada script personalizado
  // solo llegaba a Evaluar. Ahora ambos leen la misma fuente.
  const SCRIPT_PERSONALIZADO_KEY_BATCH = "sonar_script_personalizado";
  let personalizados = null;
  try { personalizados = JSON.parse(localStorage.getItem(SCRIPT_PERSONALIZADO_KEY_BATCH) || "null"); } catch(e) {}
  if (personalizados) {
    Object.entries(personalizados).forEach(([key, data]) => {
      let target = null;
      if (key === "credito") target = SCRIPTS.credito;
      else if (key === "ventas") target = SCRIPTS.ventas;
      else if (key.startsWith("cobranza_")) {
        const nivel = key.replace("cobranza_", "");
        if (SCRIPTS.cobranza[nivel]) target = SCRIPTS.cobranza[nivel];
      }
      if (!target) return;
      target.secciones = data.secciones;
      if (data.modo_puntaje) target.modo_puntaje = data.modo_puntaje;
      if (data.errores_fatales) target.errores_fatales = data.errores_fatales;
    });
  }
}

// ─── PROCESAMIENTO DEL LOTE ───
async function evaluarLote(){
  // Validar configuración global del lote
  if (!loteConfig.asesor) { showWarn('Selecciona el asesor a evaluar (toda el lote será de un solo asesor).'); return; }
  if (!loteConfig.area) { showWarn('Selecciona el área (Crédito o Cobranza) para el lote.'); return; }
  if (loteConfig.area === 'cobranza' && !loteConfig.nivel) { showWarn('Selecciona el nivel de cobranza para el lote.'); return; }
  if (filas.length === 0) { showWarn('Carga al menos un archivo antes de evaluar.'); return; }

  const completas = filas.filter(isFilaComplete);
  if(completas.length === 0){
    showWarn('No hay llamadas listas. Revisa que cada archivo tenga transcripción.');
    return;
  }
  if (!API_KEY || API_KEY === _PH_ANTHROPIC) {
    showError('La API Key de Anthropic no está configurada. Edita el archivo HTML en la ZONA DE CONFIGURACIÓN.');
    return;
  }

  hideWarn();
  hideError();
  document.getElementById('btn-evaluar-lote').disabled = true;
  document.getElementById('batch-progress').classList.add('active');
  document.getElementById('bp-total').textContent = completas.length;
  document.getElementById('results-section').classList.remove('active');
  resultados = [];

  for(let i=0; i<completas.length; i++){
    const fila = completas[i];
    document.getElementById('bp-current').textContent = i+1;
    document.getElementById('bp-fill').style.width = ((i / completas.length) * 100) + '%';
    fila.status = 'processing';
    renderFilas();

    try {
      await procesarFila(fila);
      fila.status = 'done';
      // Guardar automáticamente en sistema de seguimiento de asesores (Dashboard)
      guardarEnSeguimiento(fila);
    } catch(e){
      fila.status = 'error';
      fila.error = e.message;
      console.error(`Error en fila ${fila.idx+1}:`, e);
    }
    renderFilas();
  }

  document.getElementById('bp-fill').style.width = '100%';
  setTimeout(()=>{
    document.getElementById('batch-progress').classList.remove('active');
  }, 1500);

  // Construir resultados procesados
  resultados = filas.filter(f => f.status === 'done').map(f => buildResultado(f));

  if(resultados.length > 0){
    renderResults();
    document.getElementById('btn-csv').disabled = false;
    document.getElementById('btn-print').disabled = false;
  }
  document.getElementById('btn-evaluar-lote').disabled = false;
}

async function procesarFila(fila){
  // El área y nivel vienen de la configuración global del lote, no de la fila
  const area = loteConfig.area;
  const nivel = loteConfig.nivel;
  const areaData = area === 'credito' ? SCRIPTS.credito : (area === 'ventas' ? SCRIPTS.ventas : SCRIPTS.cobranza[nivel]);
  if(!areaData) throw new Error('Área/nivel inválido en la configuración del lote');

  // Si la fila es un audio pendiente, transcribirlo primero
  if (fila.audio_pendiente && !fila.transcripcion) {
    if (!aaiEstaConfiguradoBatch()) {
      throw new Error('No se puede transcribir: AssemblyAI no configurado. Sube .txt/.docx en su lugar.');
    }
    // Actualizar UI mostrando que está transcribiendo
    const subEl = document.getElementById('results-subtitle');
    await transcribirAudioFila(fila, (step) => {
      if (subEl) subEl.textContent = `🎙 ${fila.archivo_nombre || 'Audio'}: ${step}`;
      renderFilas();
    });
  }

  // ═══ Evaluación con texto ═══
  const transcript = fila.transcripcion || '';
  if (!transcript || transcript.length < 50) {
    throw new Error('Transcripción vacía o muy corta (mínimo 50 caracteres).');
  }
  fila.transcript = transcript;

  // Evaluar con IA (Anthropic procesa texto, no audio)
  const criteriaList = areaData.secciones.flatMap(sec =>
    sec.criterios.map(c => `- ID: ${c.id} | Sección: ${sec.titulo} | Criterio: ${c.n} | Excelente: ${c.exc} | Aceptable: ${c.ace} | Deficiente: ${c.def} | Crítico: ${c.cri}`)
  ).join('\n');
  const allIds = areaData.secciones.flatMap(sec => sec.criterios.map(c => c.id));
  const fechaHoy = new Date().toISOString().split('T')[0];
  const tieneErroresFatales = areaData.errores_fatales && areaData.errores_fatales.length;
  const erroresFatalesList = tieneErroresFatales
    ? areaData.errores_fatales.map(ef=>`- ID: ${ef.id} | ${ef.n}: ${ef.desc}`).join('\n')
    : '';

  // ★ NUEVO: script oficial asociado a la cédula (contexto normativo, no criterio)
  const _cedulaId = area === 'credito' ? 'credito'
                  : area === 'ventas'  ? 'ventas'
                  : 'cobranza_' + (nivel || '');
  const _scriptOficial = (window.SonarScripts && typeof window.SonarScripts.toPromptBlock === 'function')
    ? window.SonarScripts.toPromptBlock(_cedulaId) : null;
  const scriptBlock = _scriptOficial ? `
SCRIPT OFICIAL DE REFERENCIA (cédula "${_scriptOficial.cedula_label}", ${_scriptOficial.nombre} v${_scriptOficial.version}):
${_scriptOficial.texto}

REGLAS DE USO DEL SCRIPT:
- La RÚBRICA es la única fuente de qué se evalúa y cómo se califica.
- Este SCRIPT es contexto normativo. Úsalo SOLO cuando un criterio de la rúbrica pregunte por apego a guion u omisión de pasos oficiales.
- NO crees criterios nuevos derivados del script. NO puntúes nada que no esté en la rúbrica.
- Si un criterio no se refiere al script, ignóralo para ese criterio.
` : '';

  const evalPrompt = `Eres un experto evaluador de calidad de llamadas para MultiMoney México.

ÁREA: ${areaData.label}
DESCRIPCIÓN: ${areaData.descripcion}
TONO ESPERADO: ${areaData.tono}

TRANSCRIPCIÓN:
${transcript}

CRITERIOS:
${criteriaList}
${tieneErroresFatales ? `
ERRORES FATALES (si detectas CUALQUIERA de estos, el puntaje total se anula a 0 — sé estricto pero justo, solo márcalos si realmente ocurrieron):
${erroresFatalesList}
` : ''}
${scriptBlock}

INSTRUCCIONES:
1. Extrae metadatos (asesor, ID, fecha) si están en la transcripción.
2. Evalúa cada criterio con: exc (10), ace (7), def (4), cri (1).
3. Sé objetivo citando momentos reales de la transcripción.
${tieneErroresFatales ? '4. Revisa la lista de ERRORES FATALES y devuelve los IDs de los que SÍ ocurrieron (lista vacía si ninguno).' : ''}

Responde ÚNICAMENTE JSON válido (sin markdown):
{
  "metadatos": {
    "asesor": "Nombre del asesor o '' si no se identifica",
    "id_llamada": "ID si se menciona, sino formato YYYYMMDD-HHMM-XXX usando ${fechaHoy.replace(/-/g,'')}-0000-001",
    "duracion_estimada_minutos": 8
  },
  "evaluacion": {
    ${allIds.map(id => `"${id}": {"nivel": "exc|ace|def|cri", "razon": "Justificación breve citando la llamada"}`).join(',\n    ')}
  },${tieneErroresFatales ? `
  "errores_fatales_detectados": ["ID_del_error_fatal_si_ocurrió"],` : ''}
  "recomendaciones": "Coaching de 3-4 oraciones: 1 reconocimiento, 2 áreas críticas con el guion exacto que debió usar, 1 compromiso para próximas llamadas."
}`;

  const evalResp = await callAPI([{role:'user',content:evalPrompt}], 3500, false);
  let data;
  try {
    const clean = evalResp.replace(/```json|```/g,'').trim();
    data = JSON.parse(clean);
  } catch(e){
    const m = evalResp.match(/\{[\s\S]*\}/);
    if(m) data = JSON.parse(m[0]);
    else throw new Error('No se pudo interpretar la respuesta de la IA');
  }

  fila.evaluacion = data.evaluacion || {};
  fila.recomendaciones = data.recomendaciones || '';
  fila.metadatos = data.metadatos || {};
  fila.errores_fatales_detectados = Array.isArray(data.errores_fatales_detectados) ? data.errores_fatales_detectados : [];

  // El ID se autogenera: ya no hay campo manual de ID
  if (!fila.idLlamada && data.metadatos?.id_llamada) {
    fila.idLlamada = data.metadatos.id_llamada;
  }

  // Si se detectó cualquier error fatal, el total se anula a 0 sin excepción
  if (fila.errores_fatales_detectados.length > 0) {
    fila.total = 0;
    return;
  }

  if (areaData.modo_puntaje === 'puntos_directos') {
    // Modo Ventas: cada criterio pesa su propio puntosMax; se suma directo sobre /100
    // y se normaliza a /10 para mantener compatibilidad con el resto de SONAR.
    let obtenidos = 0, maxPosibles = 0, algunoEvaluado = false;
    areaData.secciones.forEach(sec => sec.criterios.forEach(c => {
      maxPosibles += c.puntosMax;
      const nivel = fila.evaluacion[c.id]?.nivel;
      if (nivel && SCORES[nivel] !== undefined) {
        algunoEvaluado = true;
        obtenidos += (SCORES[nivel] / 10) * c.puntosMax;
      }
    }));
    fila.total = (algunoEvaluado && maxPosibles > 0) ? Math.round((obtenidos / maxPosibles) * 100) / 10 : null;
    return;
  }

  // Calcular total ponderado (modo clásico: Crédito/Cobranza)
  let sumaPonderada = 0, totalPeso = 0;
  areaData.secciones.forEach(sec => {
    const vals = sec.criterios.map(c => fila.evaluacion[c.id]?.nivel ? SCORES[fila.evaluacion[c.id].nivel] : null).filter(v => v !== null);
    if(vals.length > 0){
      const promSec = vals.reduce((a,b)=>a+b,0) / vals.length;
      sumaPonderada += promSec * sec.peso;
      totalPeso += sec.peso;
    }
  });
  fila.total = totalPeso > 0 ? Math.round(sumaPonderada / totalPeso * 10) / 10 : null;
}

// GUARDAR EN SISTEMA DE SEGUIMIENTO DE ASESORES (localStorage)
// ═══════════════════════════════════════════════════════════
function guardarEnSeguimiento(fila) {
  const SEGUIMIENTO_KEY = 'sonar_seguimiento_evaluaciones';
  // El área y nivel vienen del lote global, no de la fila
  const area = loteConfig.area;
  const nivel = loteConfig.nivel;
  const areaData = area === 'credito' ? SCRIPTS.credito : (area === 'ventas' ? SCRIPTS.ventas : SCRIPTS.cobranza[nivel]);
  const areaNivel = areaData?.label || 'Desconocida';
  const totalScore = fila.total || 0;
  const erroresFatalesNombres = (fila.errores_fatales_detectados || []).map(efId => {
    const ef = areaData?.errores_fatales?.find(e => e.id === efId);
    return ef ? ef.n : efId;
  });
  const supervisor = (document.getElementById('f-supervisor')?.value || loteConfig.supervisor || 'Modo Lote').trim();
  const fechaLote = (document.getElementById('f-fecha-eval')?.value || new Date().toISOString().split('T')[0]);

  const criterios = [];
  if (areaData?.secciones) {
    areaData.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const ev = fila.evaluacion?.[c.id];
        criterios.push({
          id: c.id,
          seccion: sec.titulo,
          criterio: c.n,
          nivel: ev?.nivel || '',
          puntaje: ev?.nivel ? SCORES[ev.nivel] : 0,
          razon: ev?.razon || ''
        });
      });
    });
  }

  const registro = {
    id: 'EV' + Date.now() + '-' + fila.idx,
    fecha_guardado: new Date().toISOString(),
    asesor: loteConfig.asesor || 'Sin nombre',
    id_llamada: fila.idLlamada || ('LB' + Date.now() + '-' + fila.idx),
    fecha_llamada: fechaLote,
    supervisor: supervisor,
    area: area,
    nivel: nivel,
    area_nivel_label: areaNivel,
    puntaje_total: totalScore,
    nivel_general: erroresFatalesNombres.length ? 'Crítico — Error Fatal' : (totalScore >= 9 ? 'Excelente' : totalScore >= 7 ? 'Aceptable' : totalScore >= 4 ? 'Deficiente' : 'Crítico'),
    errores_fatales_detectados: erroresFatalesNombres,
    criterios: criterios,
    archivo_nombre: fila.archivo_nombre || '',
    recomendaciones: fila.recomendaciones || '',
    metadatos_sugeridos: fila.metadatos || {}
  };

  try {
    let historico = JSON.parse(localStorage.getItem(SEGUIMIENTO_KEY) || '[]');
    historico.unshift(registro);
    if (historico.length > 500) historico = historico.slice(0, 500);
    localStorage.setItem(SEGUIMIENTO_KEY, JSON.stringify(historico));
  } catch (e) {
    console.error('Error guardando en seguimiento:', e);
  }
}

function buildResultado(fila){
  const area = loteConfig.area;
  const nivel = loteConfig.nivel;
  const areaData = area === 'credito' ? SCRIPTS.credito : (area === 'ventas' ? SCRIPTS.ventas : SCRIPTS.cobranza[nivel]);
  return {
    idx: fila.idx,
    asesor: loteConfig.asesor,
    area: area,
    nivel: nivel,
    areaLabel: areaData?.label || '',
    idLlamada: fila.idLlamada || ('LB' + Date.now() + '-' + fila.idx),
    archivoNombre: fila.archivo_nombre || '',
    total: fila.total,
    evaluacion: fila.evaluacion,
    erroresFatalesDetectados: fila.errores_fatales_detectados || [],
    recomendaciones: fila.recomendaciones,
    transcript: fila.transcript,
    secciones: areaData?.secciones || []
  };
}

function renderResults(){
  document.getElementById('results-section').classList.add('active');
  const sup = document.getElementById('f-supervisor').value || 'Supervisor';
  const fecha = document.getElementById('f-fecha-eval').value || '—';
  const notas = document.getElementById('f-notas').value;
  document.getElementById('results-subtitle').textContent =
    `${resultados.length} evaluaciones · Supervisor: ${sup} · Fecha: ${fecha}` + (notas ? ` · ${notas}` : '');

  renderKPIs();
  renderAlerts();
  renderRanking();
}

function renderKPIs(){
  const totales = resultados.map(r => r.total).filter(t => t !== null);
  const promedio = totales.reduce((a,b)=>a+b,0) / totales.length;
  const max = Math.max(...totales);
  const min = Math.min(...totales);
  const criticos = totales.filter(t => t < 6).length;
  const pctCri = (criticos / totales.length * 100);
  const mejor = resultados.find(r => r.total === max);
  const peor = resultados.find(r => r.total === min);

  let promColor = 'verde', promBg = '';
  if(promedio < 6){ promColor = 'rojo'; promBg = 'warn'; }
  else if(promedio < 7.5){ promColor = 'amarillo'; }

  let criColor = 'verde', criBg = 'highlight';
  if(pctCri >= 30){ criColor = 'rojo'; criBg = 'warn'; }
  else if(pctCri > 0){ criColor = 'amarillo'; criBg = ''; }

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card ${promBg}">
      <div class="kpi-num ${promColor}">${promedio.toFixed(1)}<span style="font-size:18px;color:var(--muted)">/10</span></div>
      <div class="kpi-lbl">Promedio del lote</div>
      <div class="kpi-sub">${getNivel(promedio)}</div>
    </div>
    <div class="kpi-card highlight">
      <div class="kpi-num verde">${max.toFixed(1)}</div>
      <div class="kpi-lbl">Mejor evaluación</div>
      <div class="kpi-sub">${mejor.asesor}</div>
    </div>
    <div class="kpi-card warn">
      <div class="kpi-num rojo">${min.toFixed(1)}</div>
      <div class="kpi-lbl">Peor evaluación</div>
      <div class="kpi-sub">${peor.asesor}</div>
    </div>
    <div class="kpi-card ${criBg}">
      <div class="kpi-num ${criColor}">${pctCri.toFixed(0)}%</div>
      <div class="kpi-lbl">% en zona crítica</div>
      <div class="kpi-sub">${criticos} de ${totales.length} bajo 6.0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num azul">${resultados.length}</div>
      <div class="kpi-lbl">Llamadas evaluadas</div>
      <div class="kpi-sub">$${(resultados.length * COSTO_POR_LLAMADA).toFixed(2)} USD costo real</div>
    </div>
  `;
}

function getNivel(score){
  if(score >= 9) return '★ Excelente';
  if(score >= 7.5) return '◆ Aceptable';
  if(score >= 6) return '▼ Deficiente';
  return '✕ Crítico';
}

function renderAlerts(){
  // Patrón 1: criterios donde 50%+ del lote falló (def o cri)
  const criteriosFallidos = {};
  resultados.forEach(r => {
    r.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const ev = r.evaluacion[c.id];
        if(ev && (ev.nivel === 'def' || ev.nivel === 'cri')){
          const key = `${sec.titulo} → ${c.n}`;
          if(!criteriosFallidos[key]) criteriosFallidos[key] = {count: 0, total: 0, nivel: c.n, seccion: sec.titulo};
          criteriosFallidos[key].count++;
        }
      });
    });
  });
  // Total de veces que cada criterio aparece en el lote
  resultados.forEach(r => {
    r.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const key = `${sec.titulo} → ${c.n}`;
        if(criteriosFallidos[key]) criteriosFallidos[key].total++;
      });
    });
  });

  // Filtrar criterios donde 50%+ falló
  const fallosLote = Object.entries(criteriosFallidos)
    .filter(([k,v]) => v.total >= 2 && (v.count / v.total) >= 0.5)
    .sort((a,b) => (b[1].count/b[1].total) - (a[1].count/a[1].total))
    .slice(0, 5);

  // Patrón 2: criterios donde 70%+ obtuvo excelente
  const criteriosExcelentes = {};
  resultados.forEach(r => {
    r.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const ev = r.evaluacion[c.id];
        if(ev && ev.nivel === 'exc'){
          const key = `${sec.titulo} → ${c.n}`;
          if(!criteriosExcelentes[key]) criteriosExcelentes[key] = {count: 0, total: 0};
          criteriosExcelentes[key].count++;
        }
      });
    });
  });
  resultados.forEach(r => {
    r.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const key = `${sec.titulo} → ${c.n}`;
        if(criteriosExcelentes[key]) criteriosExcelentes[key].total++;
      });
    });
  });
  const fortalezas = Object.entries(criteriosExcelentes)
    .filter(([k,v]) => v.total >= 2 && (v.count / v.total) >= 0.7)
    .sort((a,b) => (b[1].count/b[1].total) - (a[1].count/a[1].total))
    .slice(0, 5);

  // Patrón 3: distribución por área
  const distribArea = {};
  resultados.forEach(r => {
    const key = r.area === 'credito' ? 'Crédito' : r.area === 'ventas' ? 'Ventas Digital' : `Cobranza ${r.nivel.toUpperCase()}`;
    if(!distribArea[key]) distribArea[key] = {count: 0, sum: 0};
    distribArea[key].count++;
    distribArea[key].sum += r.total;
  });

  const fallosHTML = fallosLote.length > 0 ? `
    <ul class="alert-list">
      ${fallosLote.map(([k,v]) => `
        <li>
          <span>${v.nivel}</span>
          <span class="freq">${v.count}/${v.total} (${Math.round(v.count/v.total*100)}%)</span>
        </li>
      `).join('')}
    </ul>
  ` : '<div class="alert-empty">No se detectaron patrones críticos generalizados.</div>';

  const fortalezasHTML = fortalezas.length > 0 ? `
    <ul class="alert-list">
      ${fortalezas.map(([k,v]) => `
        <li>
          <span>${k.split(' → ')[1]}</span>
          <span class="freq">${v.count}/${v.total}</span>
        </li>
      `).join('')}
    </ul>
  ` : '<div class="alert-empty">Sin fortalezas consistentes en este lote.</div>';

  const distribHTML = `
    <ul class="alert-list">
      ${Object.entries(distribArea).map(([k,v]) => `
        <li>
          <span>${k}</span>
          <span class="freq">${v.count} llam. · prom ${(v.sum/v.count).toFixed(1)}</span>
        </li>
      `).join('')}
    </ul>
  `;

  document.getElementById('alerts-grid').innerHTML = `
    <div class="alert-card critical">
      <div class="alert-header">⚠ Patrones críticos del lote (50%+ fallaron)</div>
      ${fallosHTML}
    </div>
    <div class="alert-card success">
      <div class="alert-header">★ Fortalezas consistentes (70%+ excelente)</div>
      ${fortalezasHTML}
    </div>
    <div class="alert-card warning">
      <div class="alert-header">📊 Distribución por área/nivel</div>
      ${distribHTML}
    </div>
  `;
}

function renderRanking(){
  // Header
  const headers = [
    {key:'rank', label:'#'},
    {key:'asesor', label:'Asesor'},
    {key:'area', label:'Área'},
    {key:'idLlamada', label:'ID Llamada'},
    {key:'total', label:'Puntaje', center:true},
    {key:'nivel', label:'Nivel', center:true},
    {key:'action', label:'Detalle', center:true},
  ];
  document.getElementById('rank-thead').innerHTML = headers.map(h =>
    `<th class="${h.center?'center':''} ${sortColumn===h.key?'sorted':''}" onclick="sortBy('${h.key}')">${h.label} ${sortColumn===h.key?(sortDir==='asc'?'↑':'↓'):''}</th>`
  ).join('');

  // Sort
  const sorted = [...resultados].sort((a,b) => {
    let av, bv;
    if(sortColumn === 'rank' || sortColumn === 'total'){
      av = a.total; bv = b.total;
      if(sortDir === 'desc') return bv - av;
      return av - bv;
    } else if(sortColumn === 'nivel'){
      av = a.total; bv = b.total;
      if(sortDir === 'asc') return av - bv;
      return bv - av;
    } else {
      av = (a[sortColumn]||'').toString().toLowerCase();
      bv = (b[sortColumn]||'').toString().toLowerCase();
      if(sortDir === 'asc') return av.localeCompare(bv);
      return bv.localeCompare(av);
    }
  });

  // Default: ordenado por puntaje descendente para el ranking
  if(sortColumn === 'rank'){
    sorted.sort((a,b) => b.total - a.total);
  }

  document.getElementById('rank-tbody').innerHTML = sorted.map((r,i) => {
    const pos = i + 1;
    const posClass = pos === 1 ? 'top1' : pos === 2 ? 'top2' : pos === 3 ? 'top3' : '';
    const scoreClass = r.total >= 9 ? 'exc' : r.total >= 7.5 ? 'ace' : r.total >= 6 ? 'def' : 'cri';
    const areaClass = r.area === 'credito' ? 'credito' : r.area === 'ventas' ? 'ventas' : 'cobranza';
    const areaShort = r.area === 'credito' ? 'CRÉDITO' : r.area === 'ventas' ? 'VENTAS DIGITAL' : `COB · ${r.nivel.toUpperCase()}`;
    return `
      <tr>
        <td><span class="rank-pos ${posClass}">#${pos}</span></td>
        <td><strong>${r.asesor}</strong></td>
        <td><span class="area-tag ${areaClass}">${areaShort}</span></td>
        <td style="color:var(--muted);font-family:monospace;font-size:11px">${r.idLlamada || '—'}</td>
        <td class="center"><span class="score-pill ${scoreClass}">${r.total.toFixed(1)}</span></td>
        <td class="center" style="color:var(--text);font-size:11px">${getNivel(r.total)}</td>
        <td class="center"><button class="btn-mini" onclick="openDetail(${r.idx})">Ver</button></td>
      </tr>
    `;
  }).join('');
}

function sortBy(col){
  if(sortColumn === col){
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortColumn = col;
    sortDir = col === 'total' ? 'desc' : 'asc';
  }
  renderRanking();
}

// Guardar comentarios del supervisor de calidad para esta llamada del lote
// Actualiza el registro en localStorage (Dashboard)
function guardarSupervisorCalidadBatch(idx) {
  const r = resultados.find(r => r.idx === idx);
  if (!r) return;

  const comentarios = (document.getElementById('batch-sup-comentarios-'+idx)?.value || '').trim();
  const nivel = document.getElementById('batch-sup-nivel-'+idx)?.value || '';
  const puntajeRaw = document.getElementById('batch-sup-puntaje-'+idx)?.value;
  const puntaje = (puntajeRaw !== '' && puntajeRaw != null) ? parseFloat(puntajeRaw) : null;

  // Actualizar también el objeto en memoria
  r.supervisor_calidad = {
    comentarios: comentarios,
    nivel_asignado: nivel,
    puntaje: (puntaje !== null && !isNaN(puntaje)) ? puntaje : null
  };

  // Actualizar el registro guardado en localStorage (Dashboard)
  try {
    const SEGUIMIENTO_KEY = 'sonar_seguimiento_evaluaciones';
    const historico = JSON.parse(localStorage.getItem(SEGUIMIENTO_KEY) || '[]');
    // Encontrar el registro de este lote por (asesor + id_llamada o archivo_nombre)
    const idxReg = historico.findIndex(h =>
      h.asesor === r.asesor &&
      ((r.idLlamada && h.id_llamada === r.idLlamada) ||
       (r.archivoNombre && h.archivo_nombre === r.archivoNombre))
    );
    if (idxReg !== -1) {
      historico[idxReg].supervisor_calidad = r.supervisor_calidad;
      localStorage.setItem(SEGUIMIENTO_KEY, JSON.stringify(historico));
      // Feedback visual
      const btn = event?.target;
      if (btn) {
        const txtOrig = btn.textContent;
        btn.textContent = '✓ Guardado en el Dashboard';
        btn.style.background = 'var(--green-dark)';
        btn.style.color = 'white';
        setTimeout(() => { btn.textContent = txtOrig; btn.style.background = 'var(--green)'; btn.style.color = 'var(--black)'; }, 2000);
      }
    } else {
      alert('No se encontró el registro en el Dashboard. Asegúrate de que el lote ya se haya evaluado.');
    }
  } catch (e) {
    console.error('Error guardando supervisor calidad:', e);
    alert('Error al guardar: ' + e.message);
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── EXPORT ───
function exportarCSVLote(){
  if(resultados.length === 0) return;
  const sup = document.getElementById('f-supervisor').value || '';
  const fecha = document.getElementById('f-fecha-eval').value || '';
  const notas = document.getElementById('f-notas').value || '';

  let rows = [['Supervisor','Fecha eval','Notas','#','Asesor','Área','Nivel','ID Llamada','Sección','Criterio','Nivel','Puntaje','Justificación SONAR']];
  resultados.forEach((r,i) => {
    r.secciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const ev = r.evaluacion[c.id];
        if(!ev) return;
        rows.push([sup, fecha, notas, i+1, r.asesor, r.areaLabel, r.nivel, r.idLlamada || '', sec.titulo, c.n, LABELS[ev.nivel] || '', SCORES[ev.nivel] || '', ev.razon || '']);
      });
    });
    rows.push([sup, fecha, notas, i+1, r.asesor, r.areaLabel, r.nivel, r.idLlamada || '', '', 'TOTAL PONDERADO', '', r.total, r.recomendaciones || '']);
    rows.push([]);
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `SONAR_Lote_${(sup||'lote').replace(/\s/g,'_')}_${fecha||'sin_fecha'}.csv`;
  a.click();
}

async function callAPI(messages, maxTokens, audioBeta){
  const headers = {
    'Content-Type':'application/json',
    'x-api-key':API_KEY,
    'anthropic-version':'2023-06-01',
    'anthropic-dangerous-direct-browser-access':'true'
  };
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers,
    body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:maxTokens, messages})
  });
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message);
  return data.content[0].text;
}

function toBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

  localStorage.setItem(SIGUIENTE_SESION_KEY, JSON.stringify(lista));
}

function escapeHTML(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getIniciales(nombre) {
  const p = (nombre||"").trim().split(/\s+/);
  if (p.length === 0) return "??";
  if (p.length === 1) return p[0].substring(0,2).toUpperCase();
  return (p[0][0] + p[1][0]).toUpperCase();
}

function getPuntajeClase(p) {
  if (p >= 9) return "exc";
  if (p >= 7) return "ace";
  if (p >= 4) return "def";
  return "cri";
}

function getPuntajeLabel(p) {
  if (p >= 9) return "Excelente";
  if (p >= 7) return "Aceptable";
  if (p >= 4) return "Deficiente";
  return "Crítico";
}

// Agrupar evaluaciones por asesor
function agruparPorAsesor(evals) {
  const map = {};
  evals.forEach(e => {
    const key = (e.asesor||"").trim().toLowerCase();
    if (!key) return;
    if (!map[key]) {
      map[key] = {
        asesor: e.asesor,
        evaluaciones: [],
        area: e.area,
        area_nivel_label: e.area_nivel_label
      };
    }
    map[key].evaluaciones.push(e);
  });
  // Calcular métricas
  return Object.values(map).map(grupo => {
    const evs = grupo.evaluaciones;
    // Ordenar por fecha de llamada
    evs.sort((a,b) => (a.fecha_llamada||"").localeCompare(b.fecha_llamada||""));
    const promedio = evs.reduce((s,e)=>s+(e.puntaje_total||0),0)/evs.length;
    const ultima = evs[evs.length-1];
    // Tendencia: comparar promedio de las últimas 3 vs las 3 anteriores
    let tendencia = "stable";
    if (evs.length >= 4) {
      const ult3 = evs.slice(-3);
      const ant3 = evs.slice(-6,-3);
      if (ant3.length > 0) {
        const avgUlt = ult3.reduce((s,e)=>s+(e.puntaje_total||0),0)/ult3.length;
        const avgAnt = ant3.reduce((s,e)=>s+(e.puntaje_total||0),0)/ant3.length;
        if (avgUlt - avgAnt > 0.5) tendencia = "up";
        else if (avgAnt - avgUlt > 0.5) tendencia = "down";
      }
    } else if (evs.length >= 2) {
      const dif = (evs[evs.length-1].puntaje_total||0) - (evs[0].puntaje_total||0);
      if (dif > 1) tendencia = "up";
      else if (dif < -1) tendencia = "down";
    }
    return {
      ...grupo,
      promedio: promedio,
      ultima_puntaje: ultima.puntaje_total||0,
      ultima_sup_puntaje: (ultima.supervisor_calidad && ultima.supervisor_calidad.puntaje !== null && ultima.supervisor_calidad.puntaje !== undefined && !isNaN(ultima.supervisor_calidad.puntaje)) ? parseFloat(ultima.supervisor_calidad.puntaje) : null,
      ultima_fecha: ultima.fecha_llamada,
      tendencia: tendencia,
      total_evaluaciones: evs.length
    };
  });
}

// ═══════════════════════════════════════════════════════════════
// VISTA EJECUTIVA — tendencia de calidad por área, semana vs semana
// ═══════════════════════════════════════════════════════════════

function getMondayDe(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const dia = d.getDay(); // 0=domingo
  const ajuste = (dia === 0 ? -6 : 1) - dia;
  d.setDate(d.getDate() + ajuste);
  d.setHours(0,0,0,0);
  return d.toISOString().split("T")[0]; // "2026-08-10" — lunes de esa semana
}

function labelSemana(mondayKey) {
  const lunes = new Date(mondayKey + "T00:00:00");
  const domingo = new Date(lunes); domingo.setDate(domingo.getDate() + 6);
  const fmt = d => d.toLocaleDateString("es-MX", { day: "numeric", month: "short" });
  return fmt(lunes) + " – " + fmt(domingo);
}

function areaNormalizada(e) {
  if (e.area === "credito") return "credito";
  if (e.area === "ventas") return "ventas";
  return "cobranza";
}

function calcularTendenciaEjecutiva() {
  const evals = getEvaluaciones();
  const porSemana = {}; // { "2026-08-10": { credito:[scores], cobranza:[scores], ventas:[scores] } }
  evals.forEach(e => {
    const fecha = e.fecha_llamada || (e.fecha_guardado || "").split("T")[0];
    const semana = getMondayDe(fecha);
    if (!semana) return;
    const area = areaNormalizada(e);
    if (!porSemana[semana]) porSemana[semana] = { credito: [], cobranza: [], ventas: [] };
    porSemana[semana][area].push(e.puntaje_total || 0);
  });
  const semanas = Object.keys(porSemana).sort(); // cronológico ascendente (las claves ISO ordenan bien como texto)
  return { semanas, porSemana };
}

function promedio(arr) {
  const validos = arr.filter(v => v != null);
  if (!validos.length) return null;
  return validos.reduce((a,b)=>a+b,0) / validos.length;
}

function promedioGlobalSemana(porSemana, semana) {
  const s = porSemana[semana];
  if (!s) return null;
  const todos = [...s.credito, ...s.cobranza, ...s.ventas];
  return promedio(todos);
}

let subvistaEjecutivaActual = "tendencia";
let kpiAreaActual = null;

function toggleVistaEjecutiva() {
  const ejecutiva = document.getElementById("vista-ejecutiva");
  const individual = document.getElementById("vista-individual");
  const btn = document.getElementById("btn-toggle-ejecutiva");
