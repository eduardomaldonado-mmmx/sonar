<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONAR — Plataforma de Calidad · MultiMoney México</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>

/* ════════════════════════════════════════════════════════════════════
   TEMA INTRANET MULTIMONEY — Consistente con Centro Comercial
   Sustituye los tokens oscuros/morados del sistema anterior
   ════════════════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  /* === COLORES INTRANET (autoritarios) === */
  --green: #00b100;
  --green-dark: #008c00;
  --green-light: #e8faea;
  --green-bg: #f5fcf5;
  --green-border: #d4f0d4;
  --black: #0a0a0a;
  --gray-900: #1a1a1a;
  --gray-700: #3a3a3a;
  --gray-500: #7a7a7a;
  --gray-400: #9a9a9a;
  --gray-300: #cccccc;
  --gray-200: #ececec;
  --gray-100: #f5f5f5;
  --gray-50: #fafafa;
  --white: #ffffff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);

  /* === ALIAS para compatibilidad con código existente === */
  /* Anteriores tokens oscuros mapeados a esquema claro intranet */
  --bg:           var(--white);
  --negro:        var(--gray-50);
  --negro-s:      var(--white);
  --negro-c:      var(--white);
  --negro-b:      var(--gray-200);
  --text:         var(--gray-900);
  --muted:        var(--gray-500);

  /* Acento principal: el morado se vuelve VERDE intranet */
  --morado:       var(--green);
  --morado-dark:  var(--green-dark);

  /* Estados semánticos */
  --verde:        var(--green);
  --verde-l:      var(--green-light);
  --verde-m:      var(--green-border);
  --azul:         #0a66c2;
  --azul-l:       #e7f1fb;
  --dorado:       #d4a017;
  --dorado-l:     #fff7e0;
  --rojo:         #d63333;
  --rojo-l:       #fbeaea;
  --rojo-d:       #b02020;

  /* Niveles de criterio (Excelente / Aceptable / Deficiente / Crítico) */
  --exc:          var(--green);
  --ace:          #d4a017;
  --def:          #e07030;
  --cri:          var(--rojo);
}

/* === TIPOGRAFÍA === */
html, body {
  font-family: 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
  background: var(--white) !important;
  color: var(--gray-900) !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

input, select, textarea, button, .nivel-btn, .nivel-area-btn, .area-btn, .canal-btn {
  font-family: 'Figtree', system-ui, sans-serif !important;
}

/* Mono solo para IDs, código, tokens técnicos */
.mono, code, pre, .id-llamada, .api-key-display, [data-mono] {
  font-family: 'JetBrains Mono', ui-monospace, monospace !important;
}

/* === OVERRIDES GLOBALES === */
.container, .main-card, .header, .section, .detalle-section, .seccion, .config-tools {
  background: var(--white) !important;
  border-color: var(--gray-200) !important;
  color: var(--gray-900) !important;
  box-shadow: var(--shadow-sm);
}

.header h1, h1, h2, h3 {
  color: var(--gray-900) !important;
}

.header h1 .accent, .accent {
  color: var(--green) !important;
}

.header .subtitle, .subtitle {
  color: var(--gray-500) !important;
}

/* Botones */
.btn-primary, button.btn-primary, .action-btn {
  background: var(--green) !important;
  color: var(--black) !important;
  border: none !important;
  font-weight: 700 !important;
}
.btn-primary:hover, .action-btn:hover {
  background: var(--green-dark) !important;
  color: var(--white) !important;
}

.btn-ghost {
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--gray-300) !important;
}
.btn-ghost:hover {
  border-color: var(--green) !important;
  color: var(--green-dark) !important;
}

.btn-danger {
  background: var(--white) !important;
  color: var(--rojo) !important;
  border: 1px solid var(--rojo) !important;
}
.btn-danger:hover {
  background: var(--rojo-l) !important;
}

/* Botones de canal */
.canal-btn {
  background: var(--white) !important;
  color: var(--gray-700) !important;
  border: 1px solid var(--gray-300) !important;
}
.canal-btn:hover {
  border-color: var(--green) !important;
  color: var(--gray-900) !important;
}
.canal-btn.active {
  background: var(--green) !important;
  border-color: var(--green) !important;
  color: var(--black) !important;
}

/* Tarjetas KPI */
.kpi-card {
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  border-left: 3px solid var(--green) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-sm);
}
.kpi-card.verde { border-left-color: var(--green) !important; }
.kpi-card.azul  { border-left-color: var(--azul) !important; }
.kpi-card.dorado{ border-left-color: var(--dorado) !important; }
.kpi-card.rojo  { border-left-color: var(--rojo) !important; }
.kpi-card.morado{ border-left-color: var(--green) !important; }

.kpi-label { color: var(--gray-500) !important; }
.kpi-value { color: var(--gray-900) !important; }
.kpi-card.verde .kpi-value  { color: var(--green-dark) !important; }
.kpi-card.azul  .kpi-value  { color: var(--azul) !important; }
.kpi-card.dorado .kpi-value { color: var(--dorado) !important; }
.kpi-card.rojo  .kpi-value  { color: var(--rojo) !important; }
.kpi-sub { color: var(--gray-500) !important; }

/* Tabla */
.tabla-asesores {
  background: var(--white) !important;
}
.tabla-asesores th {
  background: var(--gray-50) !important;
  color: var(--gray-700) !important;
  border-bottom: 1px solid var(--gray-200) !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 11px;
}
.tabla-asesores td {
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border-bottom: 1px solid var(--gray-100) !important;
}
.tabla-asesores tr:hover td {
  background: var(--green-bg) !important;
}

/* Inputs */
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="email"], input:not([type]), select, textarea, .filtro-input {
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--gray-300) !important;
  border-radius: var(--radius-sm) !important;
  font-family: 'Figtree', sans-serif !important;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--green) !important;
  outline: none !important;
  box-shadow: 0 0 0 3px var(--green-light);
}

label {
  color: var(--gray-700) !important;
  font-weight: 600;
}

/* Section titles */
.section-title, .sec-title {
  color: var(--gray-900) !important;
  font-weight: 700 !important;
}
.section-title::before, h3::before {
  background: var(--green) !important;
}

/* Áreas y niveles */
.area-btn {
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--gray-300) !important;
}
.area-btn:hover {
  border-color: var(--green) !important;
  background: var(--green-bg) !important;
}
.area-btn.active {
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.nivel-area-btn {
  background: var(--white) !important;
  color: var(--gray-700) !important;
  border: 1px solid var(--gray-300) !important;
}
.nivel-area-btn:hover {
  border-color: var(--green) !important;
}
.nivel-area-btn.active {
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.script-info, .selector-label, .nivel-label {
  background: var(--green-bg) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--green-border) !important;
  border-left: 3px solid var(--green) !important;
}

.selector-label, .nivel-label {
  background: transparent !important;
  border: none !important;
  color: var(--gray-700) !important;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Rubricas y criterios */
.seccion {
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  border-radius: var(--radius-sm) !important;
}
.sec-header {
  background: var(--gray-50) !important;
  color: var(--gray-900) !important;
  border-bottom: 1px solid var(--gray-200) !important;
}
.sec-num {
  background: var(--green) !important;
  color: var(--black) !important;
}
.sec-peso { color: var(--gray-500) !important; }
.sec-badge {
  background: var(--gray-100) !important;
  color: var(--gray-700) !important;
}

.criterio-row {
  background: var(--white) !important;
  border-bottom: 1px solid var(--gray-100) !important;
}
.criterio-name { color: var(--gray-900) !important; font-weight: 600 !important; }
.ia-razon {
  background: var(--gray-50) !important;
  color: var(--gray-700) !important;
  border-left: 3px solid var(--gray-300) !important;
}

.nivel-btn {
  background: var(--white) !important;
  border: 1px solid var(--gray-300) !important;
  color: var(--gray-900) !important;
}
.nivel-btn:hover { background: var(--gray-50) !important; }
.nivel-btn .nlabel { font-weight: 700; }
.nivel-btn .ndesc { color: var(--gray-500); font-size: 11px; }

.nivel-btn.sel-exc { background: var(--green-light) !important; border-color: var(--green) !important; color: var(--green-dark) !important; }
.nivel-btn.sel-ace { background: #fff7e0 !important; border-color: var(--dorado) !important; color: var(--dorado) !important; }
.nivel-btn.sel-def { background: #ffece0 !important; border-color: var(--def) !important; color: var(--def) !important; }
.nivel-btn.sel-cri { background: var(--rojo-l) !important; border-color: var(--rojo) !important; color: var(--rojo) !important; }

.obs-input {
  background: var(--white) !important;
  border: 1px solid var(--gray-300) !important;
  color: var(--gray-900) !important;
}

/* Badges de puntaje */
.puntaje-badge {
  font-family: 'JetBrains Mono', monospace !important;
  font-weight: 600;
  border-radius: 6px;
  padding: 3px 10px;
  display: inline-block;
}
.puntaje-badge.puntaje-excelente, .puntaje-excelente { background: var(--green-light) !important; color: var(--green-dark) !important; }
.puntaje-badge.puntaje-aceptable, .puntaje-aceptable { background: #fff7e0 !important; color: var(--dorado) !important; }
.puntaje-badge.puntaje-deficiente, .puntaje-deficiente { background: #ffece0 !important; color: var(--def) !important; }
.puntaje-badge.puntaje-critico, .puntaje-critico { background: var(--rojo-l) !important; color: var(--rojo) !important; }

/* Tendencia */
.tendencia-up   { color: var(--green-dark) !important; background: var(--green-light) !important; }
.tendencia-down { color: var(--rojo) !important; background: var(--rojo-l) !important; }
.tendencia-flat { color: var(--gray-500) !important; background: var(--gray-100) !important; }

/* Modal */
.detalle-overlay {
  background: rgba(0,0,0,0.5) !important;
}
.detalle-card {
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-lg);
}

/* Footer */
.footer {
  color: var(--gray-500) !important;
  font-size: 12px;
}

/* Avatares */
.avatar {
  background: var(--gray-100) !important;
  color: var(--gray-700) !important;
  font-weight: 700;
  border: 1px solid var(--gray-200) !important;
}
.asesor-name { color: var(--gray-900) !important; font-weight: 600 !important; }
.asesor-meta { color: var(--gray-500) !important; }

/* Resultado banner */
.resultado-banner {
  border-radius: var(--radius) !important;
  border-width: 1px !important;
}

/* Cards de score mini */
.score-mini-card {
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
}
.score-mini-num { font-family: 'JetBrains Mono', monospace !important; font-weight: 700; }
.score-mini-lbl { color: var(--gray-500) !important; }
.mini-bar { background: var(--gray-100) !important; }

/* Toast */
.toast {
  background: var(--gray-900) !important;
  color: var(--white) !important;
  border-radius: var(--radius-sm) !important;
}

/* Diag keys */
#diag-keys, #key-status {
  background: var(--green-bg) !important;
  border: 1px solid var(--green-border) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius-sm) !important;
}

/* Demo banner (oculto, ya no se usa) */
.demo-banner { display: none !important; }
#tab-audio, #tab-archivo, #tab-pegar {
  background: var(--white) !important;
  color: var(--gray-700) !important;
  border: 1px solid var(--gray-300) !important;
}
.tab-btn.active, #tab-pegar.active, #tab-archivo.active, #tab-audio.active {
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.zona-input, #zona-pegar, #zona-archivo, #zona-audio {
  background: var(--white) !important;
  border: 1px dashed var(--gray-300) !important;
  border-radius: var(--radius-sm) !important;
  color: var(--gray-700) !important;
}

.transcript-box {
  background: var(--gray-50) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
  font-family: 'JetBrains Mono', monospace !important;
}

#recomendaciones-content {
  background: var(--green-bg) !important;
  border: 1px solid var(--green-border) !important;
  color: var(--gray-900) !important;
}

/* Box labels */
.box-label, .field label {
  color: var(--gray-700) !important;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.empty-state {
  background: var(--gray-50) !important;
  border: 1px dashed var(--gray-300) !important;
  color: var(--gray-700) !important;
  border-radius: var(--radius) !important;
}
.empty-state h3 { color: var(--gray-900) !important; }
.empty-state p  { color: var(--gray-500) !important; }
.empty-state .icon { color: var(--gray-400) !important; }

/* Listas semana / fechas */
.weak-list .weak-item {
  background: var(--rojo-l) !important;
  border: 1px solid #f5c8c8 !important;
  color: var(--rojo) !important;
  border-radius: var(--radius-sm) !important;
}
.weak-list .weak-item .weak-name { color: var(--rojo) !important; }
.weak-list .weak-item .weak-freq { color: var(--rojo) !important; font-family: 'JetBrains Mono', monospace !important; }

/* Eval rows en historial */
.eval-row {
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius-sm) !important;
}
.eval-fecha { color: var(--gray-900) !important; font-weight: 600 !important; }
.eval-id    { color: var(--gray-500) !important; font-family: 'JetBrains Mono', monospace !important; font-size: 11px; }
.eval-area  { color: var(--gray-500) !important; }

/* Filtros */
.filtro-area-destacado {
  border-color: var(--green) !important;
  background: var(--green-bg) !important;
  color: var(--green-dark) !important;
  font-weight: 700;
}

/* Scrollbars suaves */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--gray-50); }
::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }


@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

body { min-height: 100vh; }
.sonar-header { background: var(--white); border-bottom: 1px solid var(--gray-200); padding: 14px 24px; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; }
.sonar-header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.sonar-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.sonar-brand .logo { width: 36px; height: 36px; background: var(--green); color: var(--black); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
.sonar-brand .title { font-size: 17px; color: var(--gray-900); }
.sonar-brand .title span { color: var(--green); }
.sonar-brand .sub { font-size: 11px; color: var(--gray-500); font-weight: 500; }
.sonar-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.sonar-tab { padding: 9px 18px; background: var(--white); color: var(--gray-700); border: 1px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
.sonar-tab:hover { border-color: var(--green); color: var(--gray-900); }
.sonar-tab.active { background: var(--green); color: var(--black); border-color: var(--green); }

/* ===== SYNC (backend compartido) ===== */
.sonar-sync-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
  background: var(--gray-100); color: var(--gray-500); border: 1px solid var(--gray-200);
  cursor: pointer; transition: all .15s;
}
.sonar-sync-pill:hover { border-color: var(--green); }
.sonar-sync-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-400); flex-shrink: 0; }
.sonar-sync-pill.ok { background: var(--green-bg); color: var(--green-dark); border-color: var(--green-border); }
.sonar-sync-pill.ok .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
.sonar-sync-pill.err { background: #fbeaea; color: #b02020; border-color: #f5c8c8; }
.sonar-sync-pill.err .dot { background: #d63333; }
.sonar-sync-pill.syncing .dot { animation: sonarPulse 1s ease-in-out infinite; }
@keyframes sonarPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.sonar-sync-overlay {
  position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 500;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
}
.sonar-sync-overlay .spin {
  width: 32px; height: 32px; border: 3px solid var(--gray-200); border-top-color: var(--green);
  border-radius: 50%; animation: sonarSpin .8s linear infinite;
}
@keyframes sonarSpin { to { transform: rotate(360deg); } }
.sonar-sync-overlay .txt { font-size: 13px; color: var(--gray-700); font-weight: 600; }

/* ===== LOGIN GLOBAL ===== */
.sonar-user-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 12px 4px 4px; border-radius: 20px; font-size: 11px; font-weight: 600;
  background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200);
  cursor: pointer; transition: all .15s;
}
.sonar-user-pill:hover { border-color: #d63333; color: #b02020; }
.sonar-user-pill .avatar {
  width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: var(--black);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10px; flex-shrink: 0;
}
.sonar-login-overlay {
  position: fixed; inset: 0; background: var(--gray-50); z-index: 900;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.sonar-login-card {
  background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 36px 34px; max-width: 400px; width: 100%;
}
.sonar-login-card .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.sonar-login-card .logo-row .logo {
  width: 40px; height: 40px; background: var(--green); color: var(--black); border-radius: 9px;
  display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px;
}
.sonar-login-card .logo-row .title { font-size: 18px; font-weight: 700; color: var(--gray-900); }
.sonar-login-card .logo-row .title span { color: var(--green); }
.sonar-login-card h2 { font-size: 15px; color: var(--gray-900); margin-bottom: 3px; }
.sonar-login-card .sub { font-size: 12px; color: var(--gray-500); margin-bottom: 22px; }
.sonar-login-field { margin-bottom: 13px; }
.sonar-login-field label { display: block; font-size: 11px; font-weight: 700; color: var(--gray-700); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.sonar-login-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; color: var(--gray-900); }
.sonar-login-field input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-light); }
.sonar-login-error { background: #fbeaea; border: 1px solid #f5c8c8; color: #b02020; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 13px; display: none; }
.sonar-login-error.active { display: block; }
.sonar-login-btn { width: 100%; padding: 11px; background: var(--green); color: var(--black); border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 4px; }
.sonar-login-btn:hover { background: var(--green-dark); color: var(--white); }
.sonar-login-hint { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 11px; color: var(--gray-700); margin-top: 18px; line-height: 1.6; }
.sonar-login-hint code { background: var(--white); padding: 1px 6px; border-radius: 3px; color: var(--green-dark); font-family: 'JetBrains Mono', monospace; }

#view-config .cfg-field.small { max-width: 340px; }
#view-config .cfg-sync-log { font-size: 11px; color: var(--gray-500); margin-top: 10px; line-height: 1.6; max-height: 140px; overflow-y: auto; background: var(--gray-50); border-radius: 8px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; }

.sonar-view-container { min-height: 60vh; }
#view-config { max-width: 780px; margin: 24px auto; padding: 0 20px; }
#view-config .cfg-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 24px 28px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
#view-config .cfg-card h2 { font-size: 15px; color: var(--gray-900); margin-bottom: 4px; }
#view-config .cfg-card .desc { font-size: 12px; color: var(--gray-500); margin-bottom: 16px; line-height: 1.5; }
#view-config .cfg-field { margin-bottom: 14px; }
#view-config .cfg-field label { display: block; font-size: 11px; color: var(--gray-700); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
#view-config .cfg-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gray-900); }
#view-config .cfg-btn { background: var(--green); color: var(--black); border: none; padding: 10px 22px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; margin-right: 6px; }
#view-config .cfg-btn.ghost { background: transparent; color: var(--gray-700); border: 1px solid var(--gray-300); }
#view-config .cfg-btn.editor { background: var(--gray-900); color: var(--white); font-size: 14px; padding: 12px 24px; }
#view-config .cfg-btn.editor:hover { background: var(--black); }
#view-config .cfg-status { padding: 10px 14px; border-radius: 8px; font-size: 12px; margin-top: 10px; }
#view-config .cfg-status.ok { background: var(--green-bg); color: var(--green-dark); border: 1px solid var(--green-border); }
#view-config .cfg-status.warn { background: #fff7e0; color: #b8860b; border: 1px solid #d4a017; }
#view-config .cfg-danger { background: #fbeaea; border: 1px solid #d63333; padding: 14px 16px; border-radius: 8px; margin-top: 10px; }
#view-config .cfg-danger strong { color: #b02020; }



/* .view-evaluador ===== EVALUADOR ===== */

*, .view-evaluador *::before, .view-evaluador *::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --negro-h:#252525;
  --verde-d:#00995A;
  --bg-exc:#00C17018;
  --bg-ace:#FFF3C020;
  --bg-def:#FF6B0018;
  --bg-cri:#FF202018;
  --bd-exc:#00C17060;
  --bd-ace:#D4A01760;
  --bd-def:#C0500060;
  --bd-cri:#B0202060;
  --bg-alt:#161616;
  --border:#2E2E2E;
}
.view-evaluador body{font-family:Arial,sans-serif;font-size:14px;color:var(--text);background:var(--negro)}
@media print{
  .view-evaluador body{background:white;color:#111}
  .view-evaluador .no-print{display:none!important}
  .view-evaluador .seccion, .view-evaluador .main-card{border-color:#CCC!important;background:white!important}
  .view-evaluador .sec-header{background:#1A1A1A!important}
  .view-evaluador .criterio-row{background:white!important;border-color:#EEE!important}
  .view-evaluador .criterio-name{color:#111!important}
  .view-evaluador .nivel-btn{border-color:#CCC!important;background:#FAFAFA!important}
  .view-evaluador .nivel-btn .ndesc{color:#555!important}
  .view-evaluador .ia-razon.has-razon{background:#EEF5FF!important;color:#1A3A5C!important;border-left-color:#1A3A5C!important}
}
.view-evaluador .container{max-width:1100px;margin:0 auto;padding:24px 16px}
.view-evaluador .top-bar{background:var(--negro-s);border-bottom:2px solid var(--verde);padding:16px 24px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.view-evaluador .top-bar-left h1{font-size:19px;font-weight:700;color:white;display:flex;align-items:center;gap:10px;margin-bottom:2px}
.view-evaluador .mm-logo{color:var(--verde);font-weight:900;font-size:21px}
.view-evaluador .ai-badge{background:var(--verde);color:var(--negro);font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.view-evaluador .top-bar p{font-size:12px;color:var(--muted)}
.view-evaluador .top-bar-right{display:flex;gap:8px;flex-wrap:wrap}
.view-evaluador .main-card{background:var(--negro-c);border:1px solid var(--negro-b);border-radius:0 0 10px 10px;padding:24px;margin-bottom:20px}

/* AREA SELECTOR */
.view-evaluador .area-selector{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--negro-b)}
.view-evaluador .selector-label{font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.view-evaluador .area-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.view-evaluador .area-btn{padding:10px 22px;border-radius:8px;border:1.5px solid var(--negro-b);background:var(--negro-s);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:Arial}
.view-evaluador .area-btn:hover{border-color:#555;color:var(--text)}
.view-evaluador .area-btn.active{border-color:var(--verde);background:var(--verde-l);color:var(--verde)}
.view-evaluador .nivel-selector{display:none}
.view-evaluador .nivel-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.view-evaluador .nivel-btns{display:flex;gap:8px;flex-wrap:wrap}
.view-evaluador .nivel-area-btn{padding:7px 16px;border-radius:7px;border:1.5px solid var(--negro-b);background:var(--negro-s);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:Arial}
.view-evaluador .nivel-area-btn:hover{border-color:#555;color:var(--text)}
.view-evaluador .nivel-area-btn.active{color:var(--negro);font-weight:700}
.view-evaluador .n-inbound.active{background:#6366F1;border-color:#6366F1}
.view-evaluador .n-m30.active{background:#00C170;border-color:#00C170}
.view-evaluador .n-m60.active{background:#A3D900;border-color:#A3D900}
.view-evaluador .n-m90.active{background:#F59E0B;border-color:#F59E0B}
.view-evaluador .n-m120.active{background:#EF4444;border-color:#EF4444}
.view-evaluador .n-m150.active{background:#991B1B;border-color:#991B1B;color:white!important}
.view-evaluador .script-info{background:var(--negro-s);border:1px solid var(--negro-b);border-left:3px solid var(--verde);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:12px;font-size:12px;color:#AAA;line-height:1.6;display:none}
.view-evaluador .script-info strong{color:var(--verde)}
.view-evaluador .key-ok{color:var(--verde)!important}
.view-evaluador .key-ok-dot{background:var(--verde)!important}
.view-evaluador .key-err{color:#E05050!important}
.view-evaluador .key-err-dot{background:#E05050!important}

/* FIELDS */
.view-evaluador .fields-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--negro-b)}
.view-evaluador .field label{display:block;font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.view-evaluador .field input{width:100%;padding:8px 10px;border:1px solid var(--negro-b);border-radius:6px;font-size:13px;font-family:Arial;background:var(--negro-s);color:var(--text)}
.view-evaluador .field input:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde)}
.view-evaluador .field input::placeholder{color:#555}

/* BTNS */
.view-evaluador .btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.view-evaluador .btn{padding:9px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:Arial;border:1.5px solid;transition:all .15s}
.view-evaluador .btn:hover{opacity:.85}
.view-evaluador .btn:disabled{opacity:.35;cursor:not-allowed}
.view-evaluador .btn-primary{background:var(--negro-s);color:var(--verde);border-color:var(--verde)}
.view-evaluador .btn-green{background:var(--verde);color:var(--negro);border-color:var(--verde);font-weight:700}
.view-evaluador .btn-green:hover{background:var(--verde-d);border-color:var(--verde-d)}
.view-evaluador .btn-secondary{background:transparent;color:var(--verde);border-color:var(--verde)}
.view-evaluador .btn-reset{background:transparent;color:var(--muted);border-color:var(--negro-b)}

/* UPLOAD */
.view-evaluador .upload-zone{border:2px dashed var(--negro-b);border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:var(--negro-s)}
.view-evaluador .upload-zone:hover, .view-evaluador .upload-zone.drag{border-color:var(--verde);background:var(--verde-l)}
.view-evaluador .upload-zone input{display:none}
.view-evaluador .upload-zone h3{font-size:14px;font-weight:700;color:var(--verde);margin-bottom:4px}
.view-evaluador .upload-zone p{font-size:12px;color:var(--muted)}
.view-evaluador .file-selected{background:var(--verde-l);border:2px solid var(--verde);border-radius:10px;padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.view-evaluador .file-name{font-size:14px;font-weight:700;color:var(--verde)}
.view-evaluador .file-size{font-size:12px;color:var(--muted)}

/* PROGRESS */
.view-evaluador .ai-progress{background:var(--negro-s);border:1px solid var(--verde-m);border-radius:10px;padding:20px;margin-bottom:20px}
.view-evaluador .ai-progress h3{font-size:14px;font-weight:700;color:var(--verde);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.view-evaluador .spinner{width:16px;height:16px;border:2px solid var(--verde-m);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.view-evaluador .step-list{list-style:none}
.view-evaluador .step-list li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--muted)}
.view-evaluador .step-list li.active{color:var(--verde);font-weight:600}
.view-evaluador .step-list li.done{color:var(--exc)}
.view-evaluador .step-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--negro-b);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.view-evaluador .step-dot.active{border-color:var(--verde);background:var(--verde);color:var(--negro)}
.view-evaluador .step-dot.done{border-color:var(--exc);background:var(--exc);color:white}
.view-evaluador .prog-bar{height:6px;background:var(--negro-b);border-radius:3px;margin-top:12px;overflow:hidden}
.view-evaluador .prog-fill{height:100%;background:var(--verde);border-radius:3px;transition:width .5s}

/* TRANSCRIPT */
.view-evaluador .transcript-box{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:8px;padding:14px;font-size:12px;line-height:1.8;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:#CCC;margin-bottom:20px}
.view-evaluador .box-label{font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}

/* SECCIÓN */
.view-evaluador .seccion{margin-bottom:10px;border:1px solid var(--negro-b);border-radius:8px;overflow:hidden}
.view-evaluador .sec-header{background:var(--negro-s);border-left:4px solid var(--verde);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .15s}
.view-evaluador .sec-header:hover{background:var(--negro-h)}
.view-evaluador .sec-num{background:var(--verde);color:var(--negro);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.view-evaluador .sec-title{font-size:13px;font-weight:700;color:white}
.view-evaluador .sec-peso{font-size:11px;color:var(--muted)}
.view-evaluador .sec-badge{background:var(--negro-b);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700;min-width:60px;text-align:center;color:var(--muted)}
.view-evaluador .criterio-row{padding:12px 16px;border-bottom:1px solid var(--negro-b)}
.view-evaluador .criterio-row:last-child{border-bottom:none}
.view-evaluador .criterio-row:nth-child(even){background:var(--bg-alt)}
.view-evaluador .criterio-name{font-size:13px;font-weight:700;color:var(--verde);margin-bottom:7px}
.view-evaluador .ia-razon{font-size:11px;color:var(--muted);background:var(--negro-s);border-left:3px solid var(--negro-b);padding:5px 10px;border-radius:0 5px 5px 0;margin-bottom:8px;font-style:italic}
.view-evaluador .ia-razon.has-razon{border-left-color:var(--verde);background:var(--verde-l);color:#9CD;font-style:normal}
.view-evaluador .niveles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}
.view-evaluador .nivel-btn{padding:7px 5px;border:1.5px solid var(--negro-b);border-radius:6px;background:var(--negro-s);cursor:pointer;text-align:center;transition:all .15s;line-height:1.3}
.view-evaluador .nivel-btn:hover{border-color:#555;background:var(--negro-h)}
.view-evaluador .nivel-btn .nlabel{font-size:10px;font-weight:700;display:block;margin-bottom:2px}
.view-evaluador .nivel-btn .ndesc{font-size:9px;color:var(--muted);line-height:1.3;display:block}
.view-evaluador .nivel-btn.sel-exc{background:var(--bg-exc);border-color:var(--bd-exc)}
.view-evaluador .nivel-btn.sel-exc .nlabel{color:var(--verde)}
.view-evaluador .nivel-btn.sel-ace{background:var(--bg-ace);border-color:var(--bd-ace)}
.view-evaluador .nivel-btn.sel-ace .nlabel{color:#D4A017}
.view-evaluador .nivel-btn.sel-def{background:var(--bg-def);border-color:var(--bd-def)}
.view-evaluador .nivel-btn.sel-def .nlabel{color:#E07030}
.view-evaluador .nivel-btn.sel-cri{background:var(--bg-cri);border-color:var(--bd-cri)}
.view-evaluador .nivel-btn.sel-cri .nlabel{color:#E05050}
.view-evaluador .obs-input{width:100%;padding:5px 10px;border:1px solid var(--negro-b);border-radius:5px;font-size:11px;color:var(--text);font-family:Arial;font-style:italic;resize:vertical;min-height:30px;background:var(--negro-s)}
.view-evaluador .obs-input::placeholder{color:#555}

/* RESULTADO */
.view-evaluador #resultado-panel{display:none;margin-bottom:20px}
.view-evaluador .resultado-banner{border-radius:10px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;border:1px solid var(--negro-b)}
.view-evaluador .res-big{font-size:48px;font-weight:700;line-height:1}
.view-evaluador .res-label{font-size:17px;font-weight:700;margin-bottom:3px}
.view-evaluador .res-desc{font-size:13px;margin-top:2px}
.view-evaluador .res-action{font-size:12px;margin-top:5px;font-style:italic}
.view-evaluador .scores-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px;margin-bottom:14px}
.view-evaluador .score-mini-card{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:7px;padding:7px 9px;text-align:center}
.view-evaluador .score-mini-num{font-size:19px;font-weight:700;line-height:1}
.view-evaluador .score-mini-lbl{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.3}
.view-evaluador .mini-bar{height:4px;background:var(--negro-b);border-radius:2px;margin-top:4px;overflow:hidden}
.view-evaluador .mini-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.view-evaluador .legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.view-evaluador .leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text)}
.view-evaluador .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.view-evaluador .error-box{background:#200808;border:1px solid #6B2020;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#FF7070}
.view-evaluador .footer{text-align:center;font-size:11px;color:#444;padding:12px 0;font-style:italic}
.view-evaluador .warn-box{background:#1A1200;border:1px solid #5A4A00;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#D4A017}

/* MODO DEMO TOGGLE */
.view-evaluador .demo-toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--negro-s);border:1.5px solid var(--negro-b);border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}
.view-evaluador .demo-toggle:hover{border-color:var(--verde)}
.view-evaluador .demo-toggle.active{background:rgba(255,170,0,.12);border-color:#D4A017}
.view-evaluador .demo-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:all .15s}
.view-evaluador .demo-toggle.active .dot{background:#D4A017;box-shadow:0 0 8px #D4A017}
.view-evaluador .demo-toggle .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.view-evaluador .demo-toggle.active .label{color:#D4A017}
.view-evaluador .demo-banner{background:linear-gradient(90deg,rgba(255,170,0,.15),rgba(255,170,0,.05));border:1px solid #D4A01760;border-left:4px solid #D4A017;padding:10px 14px;border-radius:6px;font-size:12px;color:#D4A017;margin-bottom:16px;display:none;align-items:center;gap:10px}
.view-evaluador .demo-banner.active{display:flex}
.view-evaluador .demo-banner strong{color:#FFD700}


/* ════════════════════════════════════════════════════════════════════
   TEMA INTRANET MULTIMONEY — Consistente con Centro Comercial
   Sustituye los tokens oscuros/morados del sistema anterior
   ════════════════════════════════════════════════════════════════════ */

@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  /* === COLORES INTRANET (autoritarios) === */
  --green: #00b100;
  --green-dark: #008c00;
  --green-light: #e8faea;
  --green-bg: #f5fcf5;
  --green-border: #d4f0d4;
  --black: #0a0a0a;
  --gray-900: #1a1a1a;
  --gray-700: #3a3a3a;
  --gray-500: #7a7a7a;
  --gray-400: #9a9a9a;
  --gray-300: #cccccc;
  --gray-200: #ececec;
  --gray-100: #f5f5f5;
  --gray-50: #fafafa;
  --white: #ffffff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);

  /* === ALIAS para compatibilidad con código existente === */
  /* Anteriores tokens oscuros mapeados a esquema claro intranet */
  --bg:           var(--white);
  --negro:        var(--gray-50);
  --negro-s:      var(--white);
  --negro-c:      var(--white);
  --negro-b:      var(--gray-200);
  --text:         var(--gray-900);
  --muted:        var(--gray-500);

  /* Acento principal: el morado se vuelve VERDE intranet */
  --morado:       var(--green);
  --morado-dark:  var(--green-dark);

  /* Estados semánticos */
  --verde:        var(--green);
  --verde-l:      var(--green-light);
  --verde-m:      var(--green-border);
  --azul:         #0a66c2;
  --azul-l:       #e7f1fb;
  --dorado:       #d4a017;
  --dorado-l:     #fff7e0;

/* */.view-batch 
===== BATCH ===== */

*, .view-batch *::before, .view-batch *::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --negro-h:#252525;
  --verde-d:#00995A;
  --bg-exc:#00C17018;
  --bg-ace:#FFF3C020;
  --bg-def:#FF6B0018;
  --bg-cri:#FF202018;
  --bd-exc:#00C17060;
  --bd-ace:#D4A01760;
  --bd-def:#C0500060;
  --bd-cri:#B0202060;
  --bg-alt:#161616;
  --border:#2E2E2E;
}
.view-batch body{font-family:Arial,sans-serif;font-size:14px;color:var(--text);background:var(--negro)}
@media print{
  .view-batch body{background:white;color:#111}
  .view-batch .no-print{display:none!important}
}
.view-batch .container{max-width:1280px;margin:0 auto;padding:24px 16px}
.view-batch .top-bar{background:var(--negro-s);border-bottom:2px solid var(--verde);padding:16px 24px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.view-batch .top-bar-left h1{font-size:19px;font-weight:700;color:white;display:flex;align-items:center;gap:10px;margin-bottom:2px}
.view-batch .mm-logo{color:var(--verde);font-weight:900;font-size:21px}
.view-batch .batch-badge{background:var(--verde);color:var(--negro);font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.view-batch .top-bar p{font-size:12px;color:var(--muted)}
.view-batch .top-bar-right{display:flex;gap:8px;flex-wrap:wrap}
.view-batch .main-card{background:var(--negro-c);border:1px solid var(--negro-b);border-radius:0 0 10px 10px;padding:24px;margin-bottom:20px}

/* MODE SWITCHER */
.view-batch .mode-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--negro-s);border:1px solid var(--negro-b);border-radius:8px;padding:4px}
.view-batch .mode-tab{flex:1;padding:10px 16px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:Arial;transition:all .15s}
.view-batch .mode-tab.active{background:var(--verde);color:var(--negro)}
.view-batch .mode-tab:not(.active):hover{color:var(--text)}

/* SUPERVISOR INFO */
.view-batch .sup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--negro-b)}
.view-batch .field label{display:block;font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.view-batch .field input{width:100%;padding:8px 10px;border:1px solid var(--negro-b);border-radius:6px;font-size:13px;font-family:Arial;background:var(--negro-s);color:var(--text)}
.view-batch .field input:focus{outline:2px solid var(--verde);outline-offset:1px;border-color:var(--verde)}
.view-batch .field input::placeholder{color:#555}

/* BATCH TABLE */
.view-batch .batch-section-title{font-size:13px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.view-batch .batch-section-title .info{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.view-batch .batch-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.view-batch .batch-row{background:var(--negro-s);border:1px solid var(--negro-b);border-left:3px solid var(--negro-b);border-radius:8px;padding:12px;display:grid;grid-template-columns:30px 1fr 130px 160px 140px 130px auto;gap:10px;align-items:center;transition:all .15s}
.view-batch .batch-row.complete{border-left-color:var(--verde);background:#0F1A0F}
.view-batch .batch-row.processing{border-left-color:var(--azul);background:#0D1320}
.view-batch .batch-row.done{border-left-color:var(--verde);background:#0A1A0A}
.view-batch .batch-row.error{border-left-color:#E05050;background:#1A0808}
.view-batch .batch-row-num{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.view-batch .batch-row.complete .batch-row-num, .view-batch .batch-row.done .batch-row-num{color:var(--verde)}
.view-batch .batch-row.processing .batch-row-num{color:var(--azul)}
.view-batch .batch-row-audio{display:flex;align-items:center;gap:8px;min-width:0}
.view-batch .audio-label{padding:7px 10px;border:1px dashed var(--negro-b);border-radius:6px;background:var(--negro);color:var(--muted);font-size:11px;cursor:pointer;flex:1;text-align:center;transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-batch .audio-label:hover{border-color:var(--verde);color:var(--verde)}
.view-batch .audio-label.has-file{border-style:solid;border-color:var(--verde);background:var(--verde-l);color:var(--verde);font-weight:600}
.view-batch .batch-row input, .view-batch .batch-row select{padding:7px 8px;border:1px solid var(--negro-b);border-radius:5px;font-size:12px;background:var(--negro);color:var(--text);font-family:Arial;width:100%}
.view-batch .batch-row input:focus, .view-batch .batch-row select:focus{outline:1.5px solid var(--verde);border-color:var(--verde)}
.view-batch .batch-row select option{background:var(--negro-s)}
.view-batch .batch-row select.disabled{opacity:.4;cursor:not-allowed}
.view-batch .row-status{font-size:11px;color:var(--muted);text-align:center;padding:4px 8px;border-radius:12px;background:var(--negro);min-width:80px;font-weight:600}
.view-batch .row-status.complete{color:var(--verde);background:var(--verde-l)}
.view-batch .row-status.processing{color:var(--azul);background:var(--azul-l)}
.view-batch .row-status.done{color:var(--verde);background:var(--verde-l)}
.view-batch .row-status.error{color:#E05050;background:#3A1010}

/* BTNS */
.view-batch .actions-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:20px;padding:14px 18px;background:var(--negro-s);border:1px solid var(--negro-b);border-radius:8px}
.view-batch .actions-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.view-batch .actions-right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.view-batch .btn{padding:9px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:Arial;border:1.5px solid;transition:all .15s}
.view-batch .btn:hover{opacity:.85}
.view-batch .btn:disabled{opacity:.35;cursor:not-allowed}
.view-batch .btn-primary{background:var(--negro-s);color:var(--verde);border-color:var(--verde)}
.view-batch .btn-green{background:var(--verde);color:var(--negro);border-color:var(--verde);font-weight:700}
.view-batch .btn-green:hover{background:var(--verde-d);border-color:var(--verde-d)}
.view-batch .btn-secondary{background:transparent;color:var(--verde);border-color:var(--verde)}
.view-batch .btn-reset{background:transparent;color:var(--muted);border-color:var(--negro-b)}
.view-batch .cost-est{font-size:12px;color:var(--muted);padding:6px 12px;background:var(--negro);border-radius:6px;border:1px solid var(--negro-b)}
.view-batch .cost-est strong{color:var(--verde)}

/* PROGRESS */
.view-batch .batch-progress{background:var(--negro-s);border:1px solid var(--verde-m);border-radius:10px;padding:18px;margin-bottom:20px;display:none}
.view-batch .batch-progress.active{display:block}
.view-batch .bp-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.view-batch .bp-title{font-size:14px;font-weight:700;color:var(--verde);display:flex;align-items:center;gap:8px}
.view-batch .spinner{width:16px;height:16px;border:2px solid var(--verde-m);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.view-batch .bp-stats{font-size:13px;color:var(--text);font-weight:600}
.view-batch .bp-stats span{color:var(--verde)}
.view-batch .prog-bar{height:8px;background:var(--negro-b);border-radius:4px;overflow:hidden}
.view-batch .prog-fill{height:100%;background:linear-gradient(90deg,var(--verde),var(--verde-d));border-radius:4px;transition:width .5s}

/* RESULTS DASHBOARD */
.view-batch .results-section{display:none;margin-top:24px}
.view-batch .results-section.active{display:block}
.view-batch .results-title{font-size:18px;font-weight:700;color:white;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.view-batch .results-subtitle{font-size:12px;color:var(--muted);margin-bottom:20px}

/* KPIs */
.view-batch .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.view-batch .kpi-card{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:10px;padding:16px}
.view-batch .kpi-card.highlight{border-color:var(--verde);background:#0E1A0E}
.view-batch .kpi-card.warn{border-color:#B0202060;background:#1A0808}
.view-batch .kpi-num{font-size:32px;font-weight:700;line-height:1;margin-bottom:6px}
.view-batch .kpi-num.verde{color:var(--verde)}
.view-batch .kpi-num.amarillo{color:#D4A017}
.view-batch .kpi-num.rojo{color:#E05050}
.view-batch .kpi-num.azul{color:var(--azul)}
.view-batch .kpi-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
.view-batch .kpi-sub{font-size:11px;color:var(--text);margin-top:4px;font-style:italic}

/* RANKING TABLE */
.view-batch .ranking-section{margin-bottom:24px}
.view-batch .ranking-table{width:100%;border-collapse:collapse;background:var(--negro-s);border:1px solid var(--negro-b);border-radius:10px;overflow:hidden}
.view-batch .ranking-table thead{background:var(--negro)}
.view-batch .ranking-table th{padding:10px 12px;text-align:left;font-size:11px;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--negro-b);cursor:pointer;user-select:none}
.view-batch .ranking-table th:hover{color:white;background:var(--negro-h)}
.view-batch .ranking-table th.sorted{background:var(--verde-l);color:var(--verde)}
.view-batch .ranking-table th.center, .view-batch .ranking-table td.center{text-align:center}
.view-batch .ranking-table td{padding:10px 12px;font-size:12px;border-bottom:1px solid var(--negro-b)}
.view-batch .ranking-table tbody tr:hover{background:var(--negro-h)}
.view-batch .ranking-table tbody tr:last-child td{border-bottom:none}
.view-batch .rank-pos{font-weight:700;color:var(--muted);font-size:13px}
.view-batch .rank-pos.top1{color:#FFD700}
.view-batch .rank-pos.top2{color:#C0C0C0}
.view-batch .rank-pos.top3{color:#CD7F32}
.view-batch .score-pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:12px;min-width:48px;text-align:center}
.view-batch .score-pill.exc{background:var(--bg-exc);color:var(--verde);border:1px solid var(--bd-exc)}
.view-batch .score-pill.ace{background:var(--bg-ace);color:#D4A017;border:1px solid var(--bd-ace)}
.view-batch .score-pill.def{background:var(--bg-def);color:#E07030;border:1px solid var(--bd-def)}
.view-batch .score-pill.cri{background:var(--bg-cri);color:#E05050;border:1px solid var(--bd-cri)}
.view-batch .area-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:var(--negro);border:1px solid var(--negro-b);color:var(--muted)}
.view-batch .area-tag.credito{color:#6366F1;border-color:#6366F160;background:#6366F115}
.view-batch .area-tag.cobranza{color:var(--verde);border-color:var(--bd-exc);background:var(--verde-l)}
.view-batch .area-tag.ventas{color:#D97706;border-color:#D9770660;background:#D9770615}
.view-batch .btn-mini{padding:4px 10px;border-radius:5px;border:1px solid var(--verde);background:transparent;color:var(--verde);font-size:11px;font-weight:600;cursor:pointer;font-family:Arial}
.view-batch .btn-mini:hover{background:var(--verde);color:var(--negro)}

/* PATTERNS / ALERTS */
.view-batch .alerts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:24px}
.view-batch .alert-card{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:10px;padding:16px}
.view-batch .alert-card.critical{border-left:4px solid #E05050;background:#1A0808}
.view-batch .alert-card.warning{border-left:4px solid #D4A017;background:#1A1500}
.view-batch .alert-card.success{border-left:4px solid var(--verde);background:#0A1A0A}
.view-batch .alert-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
.view-batch .alert-card.critical .alert-header{color:#E05050}
.view-batch .alert-card.warning .alert-header{color:#D4A017}
.view-batch .alert-card.success .alert-header{color:var(--verde)}
.view-batch .alert-list{list-style:none}
.view-batch .alert-list li{padding:6px 0;border-bottom:1px solid var(--negro-b);font-size:12px;color:var(--text);display:flex;justify-content:space-between;gap:10px}
.view-batch .alert-list li:last-child{border-bottom:none}
.view-batch .alert-list .freq{color:var(--muted);font-weight:600;white-space:nowrap}
.view-batch .alert-card.critical .alert-list .freq{color:#E05050}
.view-batch .alert-card.warning .alert-list .freq{color:#D4A017}
.view-batch .alert-empty{font-size:12px;color:var(--muted);font-style:italic;padding:8px 0}

/* DETAIL MODAL */
.view-batch .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:1000;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.view-batch .modal-overlay.active{display:flex}
.view-batch .modal{background:var(--negro-c);border:1px solid var(--verde-m);border-radius:12px;max-width:900px;width:100%;padding:24px;position:relative}
.view-batch .modal-close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--negro-b);color:var(--muted);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:18px;font-family:Arial}
.view-batch .modal-close:hover{color:white;border-color:var(--verde)}
.view-batch .modal-header{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--negro-b)}
.view-batch .modal-title{font-size:16px;font-weight:700;color:white;margin-bottom:4px}
.view-batch .modal-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.view-batch .modal-section{margin-bottom:20px}
.view-batch .modal-section-title{font-size:11px;font-weight:700;color:var(--verde);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.view-batch .modal-criterio{padding:10px 14px;background:var(--negro-s);border:1px solid var(--negro-b);border-radius:7px;margin-bottom:6px}
.view-batch .modal-criterio-name{font-size:12px;font-weight:700;color:white;margin-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.view-batch .modal-criterio-razon{font-size:11px;color:#AAD;font-style:italic;line-height:1.5}
.view-batch .modal-coaching{padding:14px;background:#0D1A0D;border:1px solid var(--verde-m);border-left:4px solid var(--verde);border-radius:7px;font-size:12px;color:#AAD;line-height:1.6}
.view-batch .modal-transcript{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:7px;padding:12px;font-size:11px;line-height:1.7;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:#BBB}

/* MISC */
.view-batch .warn-box{background:#1A1200;border:1px solid #5A4A00;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#D4A017;display:none}
.view-batch .warn-box.active{display:block}
.view-batch .error-box{background:#200808;border:1px solid #6B2020;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#FF7070;display:none}
.view-batch .error-box.active{display:block}
.view-batch .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.view-batch .footer{text-align:center;font-size:11px;color:#444;padding:12px 0;font-style:italic}

/* MODO DEMO TOGGLE */
.view-batch .demo-toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--negro-s);border:1.5px solid var(--negro-b);border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}
.view-batch .demo-toggle:hover{border-color:var(--verde)}
.view-batch .demo-toggle.active{background:rgba(255,170,0,.12);border-color:#D4A017}
.view-batch .demo-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:all .15s}
.view-batch .demo-toggle.active .dot{background:#D4A017;box-shadow:0 0 8px #D4A017}
.view-batch .demo-toggle .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.view-batch .demo-toggle.active .label{color:#D4A017}
.view-batch .demo-banner{background:linear-gradient(90deg,rgba(255,170,0,.15),rgba(255,170,0,.05));border:1px solid #D4A01760;border-left:4px solid #D4A017;padding:10px 14px;border-radius:6px;font-size:12px;color:#D4A017;margin-bottom:16px;display:none;align-items:center;gap:10px}
.view-batch .demo-banner.active{display:flex}
.view-batch .demo-banner strong{color:#FFD700}
.view-batch .demo-fill-btn{background:transparent;border:1px dashed #D4A017;color:#D4A017;padding:4px 12px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:Arial;margin-left:auto}
.view-batch .demo-fill-btn:hover{background:rgba(212,160,23,.1)}

@media (max-width:900px){
  .view-batch .batch-row{grid-template-columns:30px 1fr;grid-template-rows:auto auto auto auto auto;gap:8px}
  .view-batch .batch-row > *:not(.batch-row-num):not(.batch-row-audio){grid-column:span 2}
}


/* ════════════════════════════════════════════════════════════════════
   TEMA INTRANET MULTIMONEY — Consistente con Centro Comercial
   Sustituye los tokens oscuros/morados del sistema anterior
   ════════════════════════════════════════════════════════════════════ */

@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  /* === COLORES INTRANET (autoritarios) === */
  --green: #00b100;
  --green-dark: #008c00;
  --green-light: #e8faea;
  --green-bg: #f5fcf5;
  --green-border: #d4f0d4;
  --black: #0a0a0a;
  --gray-900: #1a1a1a;
  --gray-700: #3a3a3a;
  --gray-500: #7a7a7a;
  --gray-400: #9a9a9a;
  --gray-300: #cccccc;
  --gray-200: #ececec;
  --gray-100: #f5f5f5;
  --gray-50: #fafafa;
  --white: #ffffff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);

  /* === ALIAS para compatibilidad con código existente === */
  /* Anteriores tokens oscuros mapeados a esquema claro intranet */
  --bg:           var(--white);
  --negro:        var(--gray-50);
  --negro-s:      var(--white);
  --negro-c:      var(--white);
  --negro-b:      var(--gray-200);
  --text:         var(--gray-900);
  --muted:        var(--gray-500);

  /* Acento principal: el morado se vuelve VERDE intranet */
  --morado:       var(--green);
  --morado-dark:  var(--green-dark);

  /* Estados semánticos */
  --verde:        var(--green);
  --verde-l:      var(--green-light);
  --verde-m:      var(--green-border);
  --azul:         #0a66c2;
  --azul-l:       #e7f1fb;
  --dorado:       #d4a017;
  --dorado-l:     #fff7e0;
  --rojo:         #d63333;
  --rojo-l:       #fbeaea;
  --rojo-d:       #b02020;

  /* Niveles de criterio (Excelente / Aceptable / Deficiente / Crítico) */
  --exc:          var(--green);
  --ace:          #d4a017;
  --def:          #e07030;
  --cri:          var(--rojo);
}

/* === TIPOGRAFÍA === */
.view-batch html, .view-batch body{
  font-family: "Figtree", system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
  background: var(--white) !important;
  color: var(--gray-900) !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.view-batch input, .view-batch select, .view-batch textarea, .view-batch button, .view-batch .nivel-btn, .view-batch .nivel-area-btn, .view-batch .area-btn, .view-batch .canal-btn{
  font-family: "Figtree", system-ui, sans-serif !important;
}

/* Mono solo para IDs, código, tokens técnicos */
.view-batch .mono, .view-batch code, .view-batch pre, .view-batch .id-llamada, .view-batch .api-key-display, .view-batch [data-mono]{
  font-family: "JetBrains Mono", ui-monospace, monospace !important;
}

/* === OVERRIDES GLOBALES === */
.view-batch .container, .view-batch .main-card, .view-batch .header, .view-batch .section, .view-batch .detalle-section, .view-batch .seccion, .view-batch .config-tools{
  background: var(--white) !important;
  border-color: var(--gray-200) !important;
  color: var(--gray-900) !important;
  box-shadow: var(--shadow-sm);
}

.view-batch .header h1, .view-batch h1, .view-batch h2, .view-batch h3{
  color: var(--gray-900) !important;
}

.view-batch .header h1 .accent, .view-batch .accent{
  color: var(--green) !important;
}

.view-batch .header .subtitle, .view-batch .subtitle{
  color: var(--gray-500) !important;
}

/* Botones */
.view-batch .btn-primary, .view-batch button.btn-primary, .view-batch .action-btn{
  background: var(--green) !important;
  color: var(--black) !important;
  border: none !important;
  font-weight: 700 !important;
}
.view-batch .btn-primary:hover, .view-batch .action-btn:hover{
  background: var(--green-dark) !important;
  color: var(--white) !important;
}

.view-batch .btn-ghost{
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--gray-300) !important;
}
.view-batch .btn-ghost:hover{
  border-color: var(--green) !important;
  color: var(--green-dark) !important;
}

.view-batch .btn-danger{
  background: var(--white) !important;
  color: var(--rojo) !important;
  border: 1px solid var(--rojo) !important;
}
.view-batch .btn-danger:hover{
  background: var(--rojo-l) !important;
}

/* Botones de canal */
.view-batch .canal-btn{
  background: var(--white) !important;
  color: var(--gray-700) !important;
  border: 1px solid var(--gray-300) !important;
}
.view-batch .canal-btn:hover{
  border-color: var(--green) !important;
  color: var(--gray-900) !important;
}
.view-batch .canal-btn.active{
  background: var(--green) !important;
  border-color: var(--green) !important;
  color: var(--black) !important;
}

/* Tarjetas KPI */
.view-batch .kpi-card{
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  border-left: 3px solid var(--green) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-sm);
}
.view-batch .kpi-card.verde{ border-left-color: var(--green) !important; }
.view-batch .kpi-card.azul{ border-left-color: var(--azul) !important; }
.view-batch .kpi-card.dorado{ border-left-color: var(--dorado) !important; }
.view-batch .kpi-card.rojo{ border-left-color: var(--rojo) !important; }
.view-batch .kpi-card.morado{ border-left-color: var(--green) !important; }

.view-batch .kpi-label{ color: var(--gray-500) !important; }
.view-batch .kpi-value{ color: var(--gray-900) !important; }
.view-batch .kpi-card.verde .kpi-value{ color: var(--green-dark) !important; }
.view-batch .kpi-card.azul  .kpi-value{ color: var(--azul) !important; }
.view-batch .kpi-card.dorado .kpi-value{ color: var(--dorado) !important; }
.view-batch .kpi-card.rojo  .kpi-value{ color: var(--rojo) !important; }
.view-batch .kpi-sub{ color: var(--gray-500) !important; }

/* Tabla */
.view-batch .tabla-asesores{
  background: var(--white) !important;
}
.view-batch .tabla-asesores th{
  background: var(--gray-50) !important;
  color: var(--gray-700) !important;
  border-bottom: 1px solid var(--gray-200) !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 11px;
}
.view-batch .tabla-asesores td{
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border-bottom: 1px solid var(--gray-100) !important;
}
.view-batch .tabla-asesores tr:hover td{
  background: var(--green-bg) !important;
}

/* Inputs */
.view-batch input[type="text"], .view-batch input[type="number"], .view-batch input[type="date"], .view-batch input[type="time"], .view-batch input[type="email"], .view-batch input:not([type]), .view-batch select, .view-batch textarea, .view-batch .filtro-input{
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--gray-300) !important;
  border-radius: var(--radius-sm) !important;
  font-family: "Figtree", sans-serif !important;
}
.view-batch input:focus, .view-batch select:focus, .view-batch textarea:focus{
  border-color: var(--green) !important;
  outline: none !important;

.view-batch label{

}

}
.view-batch .section-title::before, .view-batch h3::before{
  background: var(--green) !important;
}

/* Áreas y niveles */

}
.view-batch .area-btn:hover{
  border-color: var(--green) !important;
  background: var(--green-bg) !important;
}
.view-batch .area-btn.active{
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.view-batch .nivel-area-btn{

  color: var(--gray-700) !important;

}
.view-batch .nivel-area-btn:hover{
  border-color: var(--green) !important;
}
.view-batch .nivel-area-btn.active{
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.view-batch .script-info, .view-batch .selector-label, .view-batch .nivel-label{
  background: var(--green-bg) !important;
  color: var(--gray-900) !important;
  border: 1px solid var(--green-border) !important;
  border-left: 3px solid var(--green) !important;
}

.view-batch .selector-label, .view-batch .nivel-label{
