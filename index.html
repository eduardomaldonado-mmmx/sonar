}

/* Rubricas y criterios */
.view-batch .seccion{
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  border-radius: var(--radius-sm) !important;
}
.view-batch .sec-header{
  background: var(--gray-50) !important;
  color: var(--gray-900) !important;
  border-bottom: 1px solid var(--gray-200) !important;
}
.view-batch .sec-num{
  background: var(--green) !important;
  color: var(--black) !important;
}
.view-batch .sec-peso{ color: var(--gray-500) !important; }
.view-batch .sec-badge{
  background: var(--gray-100) !important;
  color: var(--gray-700) !important;
}

.view-batch .criterio-row{
  background: var(--white) !important;
  border-bottom: 1px solid var(--gray-100) !important;
}
.view-batch .criterio-name{ color: var(--gray-900) !important; font-weight: 600 !important; }
.view-batch .ia-razon{
  background: var(--gray-50) !important;
  color: var(--gray-700) !important;
  border-left: 3px solid var(--gray-300) !important;
}

.view-batch .nivel-btn{
  background: var(--white) !important;
  border: 1px solid var(--gray-300) !important;
  color: var(--gray-900) !important;
}
.view-batch .nivel-btn:hover{ background: var(--gray-50) !important; }
.view-batch .nivel-btn .nlabel{ font-weight: 700; }
.view-batch .nivel-btn .ndesc{ color: var(--gray-500); font-size: 11px; }

.view-batch .nivel-btn.sel-exc{ background: var(--green-light) !important; border-color: var(--green) !important; color: var(--green-dark) !important; }
.view-batch .nivel-btn.sel-ace{ background: #fff7e0 !important; border-color: var(--dorado) !important; color: var(--dorado) !important; }
.view-batch .nivel-btn.sel-def{ background: #ffece0 !important; border-color: var(--def) !important; color: var(--def) !important; }
.view-batch .nivel-btn.sel-cri{ background: var(--rojo-l) !important; border-color: var(--rojo) !important; color: var(--rojo) !important; }

.view-batch .obs-input{
  background: var(--white) !important;
  border: 1px solid var(--gray-300) !important;
  color: var(--gray-900) !important;
}

/* Badges de puntaje */
.view-batch .puntaje-badge{
  font-family: "JetBrains Mono", monospace !important;
  font-weight: 600;
  border-radius: 6px;
  padding: 3px 10px;
  display: inline-block;
}
.view-batch .puntaje-badge.puntaje-excelente, .view-batch .puntaje-excelente{ background: var(--green-light) !important; color: var(--green-dark) !important; }
.view-batch .puntaje-badge.puntaje-aceptable, .view-batch .puntaje-aceptable{ background: #fff7e0 !important; color: var(--dorado) !important; }
.view-batch .puntaje-badge.puntaje-deficiente, .view-batch .puntaje-deficiente{ background: #ffece0 !important; color: var(--def) !important; }
.view-batch .puntaje-badge.puntaje-critico, .view-batch .puntaje-critico{ background: var(--rojo-l) !important; color: var(--rojo) !important; }

/* Tendencia */
.view-batch .tendencia-up{ color: var(--green-dark) !important; background: var(--green-light) !important; }
.view-batch .tendencia-down{ color: var(--rojo) !important; background: var(--rojo-l) !important; }
.view-batch .tendencia-flat{ color: var(--gray-500) !important; background: var(--gray-100) !important; }

/* Modal */
.view-batch .detalle-overlay{
  background: rgba(0,0,0,0.5) !important;
}
.view-batch .detalle-card{
  background: var(--white) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-lg);
}

/* Footer */
.view-batch .footer{
  color: var(--gray-500) !important;
  font-size: 12px;
}

/* Avatares */
.view-batch .avatar{
  background: var(--gray-100) !important;
  color: var(--gray-700) !important;
  font-weight: 700;
  border: 1px solid var(--gray-200) !important;
}
.view-batch .asesor-name{ color: var(--gray-900) !important; font-weight: 600 !important; }
.view-batch .asesor-meta{ color: var(--gray-500) !important; }

/* Resultado banner */
.view-batch .resultado-banner{
  border-radius: var(--radius) !important;
  border-width: 1px !important;
}

/* Cards de score mini */
.view-batch .score-mini-card{
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
}
.view-batch .score-mini-num{ font-family: "JetBrains Mono", monospace !important; font-weight: 700; }
.view-batch .score-mini-lbl{ color: var(--gray-500) !important; }
.view-batch .mini-bar{ background: var(--gray-100) !important; }

/* Toast */
.view-batch .toast{
  background: var(--gray-900) !important;
  color: var(--white) !important;
  border-radius: var(--radius-sm) !important;
}

/* Diag keys */
.view-batch #diag-keys, .view-batch #key-status{
  background: var(--green-bg) !important;
  border: 1px solid var(--green-border) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius-sm) !important;
}

/* Demo banner (oculto, ya no se usa) */
.view-batch .demo-banner{ display: none !important; }
.view-batch #tab-audio, .view-batch #tab-archivo, .view-batch #tab-pegar{
  background: var(--white) !important;
  color: var(--gray-700) !important;
  border: 1px solid var(--gray-300) !important;
}
.view-batch .tab-btn.active, .view-batch #tab-pegar.active, .view-batch #tab-archivo.active, .view-batch #tab-audio.active{
  background: var(--green) !important;
  color: var(--black) !important;
  border-color: var(--green) !important;
}

.view-batch .zona-input, .view-batch #zona-pegar, .view-batch #zona-archivo, .view-batch #zona-audio{
  background: var(--white) !important;
  border: 1px dashed var(--gray-300) !important;
  border-radius: var(--radius-sm) !important;
  color: var(--gray-700) !important;
}

.view-batch .transcript-box{
  background: var(--gray-50) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
  font-family: "JetBrains Mono", monospace !important;
}

.view-batch #recomendaciones-content{
  background: var(--green-bg) !important;
  border: 1px solid var(--green-border) !important;
  color: var(--gray-900) !important;
}

/* Box labels */
.view-batch .box-label, .view-batch .field label{
  color: var(--gray-700) !important;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.view-batch .empty-state{
  background: var(--gray-50) !important;
  border: 1px dashed var(--gray-300) !important;
  color: var(--gray-700) !important;
  border-radius: var(--radius) !important;
}
.view-batch .empty-state h3{ color: var(--gray-900) !important; }
.view-batch .empty-state p{ color: var(--gray-500) !important; }
.view-batch .empty-state .icon{ color: var(--gray-400) !important; }

/* Listas semana / fechas */
.view-batch .weak-list .weak-item{
  background: var(--rojo-l) !important;
  border: 1px solid #f5c8c8 !important;
  color: var(--rojo) !important;
  border-radius: var(--radius-sm) !important;
}
.view-batch .weak-list .weak-item .weak-name{ color: var(--rojo) !important; }
.view-batch .weak-list .weak-item .weak-freq{ color: var(--rojo) !important; font-family: "JetBrains Mono", monospace !important; }

/* Eval rows en historial */
.view-batch .eval-row{
  background: var(--white) !important;
  border: 1px solid var(--gray-200) !important;
  color: var(--gray-900) !important;
  border-radius: var(--radius-sm) !important;
}
.view-batch .eval-fecha{ color: var(--gray-900) !important; font-weight: 600 !important; }
.view-batch .eval-id{ color: var(--gray-500) !important; font-family: "JetBrains Mono", monospace !important; font-size: 11px; }
.view-batch .eval-area{ color: var(--gray-500) !important; }

/* Filtros */
.view-batch .filtro-area-destacado{
  border-color: var(--green) !important;
  background: var(--green-bg) !important;
  color: var(--green-dark) !important;
  font-weight: 700;
}

/* Scrollbars suaves */
.view-batch ::-webkit-scrollbar{ width: 10px; height: 10px; }
.view-batch ::-webkit-scrollbar-track{ background: var(--gray-50); }
.view-batch ::-webkit-scrollbar-thumb{ background: var(--gray-300); border-radius: 5px; }
.view-batch ::-webkit-scrollbar-thumb:hover{ background: var(--gray-400); }


@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* */.view-dashboard 
===== DASHBOARD ===== */

*, .view-dashboard *::before, .view-dashboard *::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde-d:#00995A;
  --morado-l:#6366F115;
  --muted2:#666;
}
.view-dashboard body{font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--negro);line-height:1.5;padding:24px 20px;min-height:100vh}
.view-dashboard .container{max-width:1280px;margin:0 auto}

/* HEADER */
.view-dashboard .header{background:linear-gradient(135deg,var(--negro-s),var(--negro-c));border:1px solid var(--negro-b);border-top:3px solid var(--morado);border-radius:12px;padding:24px 28px;margin-bottom:20px}
.view-dashboard .header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.view-dashboard .header h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px}
.view-dashboard .header h1 .accent{color:var(--morado)}
.view-dashboard .header .subtitle{font-size:13px;color:var(--muted);font-style:italic}
.view-dashboard .header-actions{display:flex;gap:10px;flex-wrap:wrap}
.view-dashboard .btn{padding:9px 16px;border:none;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;font-family:Arial;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.view-dashboard .btn-primary{background:var(--morado);color:white}
.view-dashboard .btn-primary:hover{background:#4F46E5}
.view-dashboard .btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--negro-b)}
.view-dashboard .btn-ghost:hover{border-color:var(--morado);color:var(--morado)}
.view-dashboard .btn-danger{background:transparent;color:var(--rojo);border:1.5px solid var(--rojo)}
.view-dashboard .btn-danger:hover{background:var(--rojo-l)}

/* Selector de canal (Llamadas / WhatsApp / Correo) */
.view-dashboard .canal-btn{padding:7px 14px;border:1.5px solid var(--negro-b);background:transparent;color:var(--muted);border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;font-family:Arial;transition:.15s}
.view-dashboard .canal-btn:hover{border-color:var(--morado);color:var(--text)}
.view-dashboard .canal-btn.active{background:var(--morado);border-color:var(--morado);color:white}
.view-dashboard .canal-btn.disabled{opacity:.5;cursor:not-allowed;position:relative}
.view-dashboard .canal-btn.disabled::after{content:"Próximamente";position:absolute;top:-7px;right:-6px;background:#D4A017;color:#1A1500;font-size:8px;padding:1px 5px;border-radius:8px;font-weight:700}

/* Filtro de área destacado (cambia los resultados) */
.view-dashboard .filtro-area-destacado{background:var(--negro);border:1.5px solid var(--morado) !important;color:#A5B4FC !important;font-weight:700}

/* Botones de acción dentro del modal */
.view-dashboard .action-btn{padding:9px 16px;background:var(--morado);color:white;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;font-family:Arial;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.view-dashboard .action-btn:hover{background:#4F46E5}
.view-dashboard .action-btn-soft{background:transparent;color:#A5B4FC;border:1.5px solid var(--morado)}
.view-dashboard .action-btn-soft:hover{background:var(--morado);color:white}

/* KPI GLOBALES */
.view-dashboard .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.view-dashboard .kpi-card{background:var(--negro-s);border:1px solid var(--negro-b);border-left:3px solid var(--morado);border-radius:10px;padding:16px 18px}
.view-dashboard .kpi-card.verde{border-left-color:var(--verde)}
.view-dashboard .kpi-card.azul{border-left-color:var(--azul)}
.view-dashboard .kpi-card.dorado{border-left-color:var(--dorado)}
.view-dashboard .kpi-card.rojo{border-left-color:var(--rojo)}
.view-dashboard .kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-weight:600}
.view-dashboard .kpi-value{font-size:28px;font-weight:700;color:white;line-height:1.1}
.view-dashboard .kpi-card.verde .kpi-value{color:var(--verde)}
.view-dashboard .kpi-card.azul .kpi-value{color:var(--azul)}
.view-dashboard .kpi-card.dorado .kpi-value{color:var(--dorado)}
.view-dashboard .kpi-card.rojo .kpi-value{color:var(--rojo)}
.view-dashboard .kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

/* SECTION */
.view-dashboard .section{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:10px;padding:20px 24px;margin-bottom:20px}
.view-dashboard .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.view-dashboard .section-title{font-size:13px;font-weight:700;color:var(--morado);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.view-dashboard .section-title::before{content:"";display:inline-block;width:4px;height:18px;background:var(--morado);border-radius:2px}

/* TABLA DE ASESORES */
.view-dashboard .tabla-asesores{width:100%;border-collapse:collapse;font-size:13px}
.view-dashboard .tabla-asesores th{padding:11px 12px;text-align:left;background:var(--negro);color:var(--morado);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--negro-b);font-weight:700}
.view-dashboard .tabla-asesores th.center, .view-dashboard .tabla-asesores td.center{text-align:center}
.view-dashboard .tabla-asesores th.right, .view-dashboard .tabla-asesores td.right{text-align:right}
.view-dashboard .tabla-asesores td{padding:11px 12px;border-bottom:1px solid var(--negro-b)}
.view-dashboard .tabla-asesores tbody tr{cursor:pointer;transition:.15s}
.view-dashboard .tabla-asesores tbody tr:hover{background:rgba(99,102,241,.06)}
.view-dashboard .asesor-cell{display:flex;align-items:center;gap:10px}
.view-dashboard .avatar{width:36px;height:36px;border-radius:50%;background:var(--morado);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.view-dashboard .asesor-info{display:flex;flex-direction:column}
.view-dashboard .asesor-name{font-weight:600;color:white;font-size:13px}
.view-dashboard .asesor-meta{font-size:11px;color:var(--muted)}
.view-dashboard .puntaje-badge{display:inline-block;padding:4px 12px;border-radius:14px;font-weight:700;font-size:12px;min-width:48px;text-align:center}
.view-dashboard .puntaje-exc{background:var(--verde-l);color:var(--verde);border:1px solid var(--verde)}
.view-dashboard .puntaje-ace{background:var(--dorado-l);color:var(--dorado);border:1px solid var(--dorado)}
.view-dashboard .puntaje-def{background:var(--rojo-l);color:var(--rojo);border:1px solid var(--rojo)}
.view-dashboard .puntaje-cri{background:var(--rojo-l);color:#FF7070;border:1px solid #FF7070}
.view-dashboard .tendencia{font-size:12px;font-weight:700}
.view-dashboard .tendencia-up{color:var(--verde)}
.view-dashboard .tendencia-down{color:var(--rojo)}
.view-dashboard .tendencia-stable{color:var(--muted)}

/* EMPTY STATE */
.view-dashboard .empty-state{text-align:center;padding:60px 24px;color:var(--muted)}
.view-dashboard .empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.view-dashboard .empty-state h3{color:white;font-size:18px;margin-bottom:8px;font-weight:700}
.view-dashboard .empty-state p{font-size:14px;margin-bottom:16px;max-width:480px;margin-left:auto;margin-right:auto}

/* VISTA INDIVIDUAL ASESOR */
.view-dashboard .detalle-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.view-dashboard .detalle-overlay.active{display:flex}
.view-dashboard .detalle-modal{background:var(--negro);border:1px solid var(--morado);border-radius:14px;width:100%;max-width:1100px;padding:0;max-height:none}
.view-dashboard .detalle-head{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));border-bottom:1px solid var(--negro-b);padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;border-radius:14px 14px 0 0}
.view-dashboard .detalle-asesor{display:flex;align-items:center;gap:14px}
.view-dashboard .avatar-lg{width:60px;height:60px;font-size:20px}
.view-dashboard .detalle-asesor h2{font-size:22px;color:white;margin-bottom:4px;font-weight:700}
.view-dashboard .detalle-asesor .sub{font-size:13px;color:var(--muted)}
.view-dashboard .btn-close{background:transparent;border:1px solid var(--negro-b);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.view-dashboard .btn-close:hover{border-color:var(--rojo);color:var(--rojo)}
.view-dashboard .detalle-body{padding:24px 28px}

.view-dashboard .detalle-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.view-dashboard .detalle-kpi{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:8px;padding:12px 14px}
.view-dashboard .detalle-kpi .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:600}
.view-dashboard .detalle-kpi .val{font-size:22px;font-weight:700;color:white;line-height:1.1}
.view-dashboard .detalle-kpi.up .val{color:var(--verde)}
.view-dashboard .detalle-kpi.down .val{color:var(--rojo)}
.view-dashboard .detalle-kpi .sub{font-size:10px;color:var(--muted);margin-top:2px}

.view-dashboard .detalle-section{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.view-dashboard .detalle-section h3{font-size:12px;font-weight:700;color:var(--morado);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.view-dashboard .chart-wrap{height:220px;position:relative}

.view-dashboard .weak-list{display:flex;flex-direction:column;gap:8px}
.view-dashboard .weak-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--rojo-l);border:1px solid var(--rojo);border-radius:7px}
.view-dashboard .weak-name{font-weight:700;color:#FFB0B0;font-size:13px}
.view-dashboard .weak-freq{color:var(--rojo);font-weight:700;font-size:12px;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:10px}

.view-dashboard .eval-row{padding:12px 14px;background:var(--negro);border:1px solid var(--negro-b);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.view-dashboard .eval-info{flex:1;min-width:200px}
.view-dashboard .eval-fecha{font-size:11px;color:var(--muted);margin-bottom:2px}

/* ════════════════════════════════════════════════════════════════════
   TEMA INTRANET MULTIMONEY — Consistente con Centro Comercial
   Sustituye los tokens oscuros/morados del sistema anterior
   ════════════════════════════════════════════════════════════════════ */

@import url("https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap");

:root {
  /* === COLORES INTRANET (autoritarios) === */
  --green: #00b100;
  --green-dark: #008c00;
  --green-light: #e8faea;
  --green-bg: #f5fcf5;
  --green-border: #d4f0d4;
  --black: #0a0a0a;
  --gray-900: #1a1a1a;
  --gray-700: #3a3a3a;
  --gray-500: #7a7a7a;
  --gray-400: #9a9a9a;
  --gray-300: #cccccc;
  --gray-200: #ececec;
  --gray-100: #f5f5f5;
  --gray-50: #fafafa;
  --white: #ffffff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);

  /* === ALIAS para compatibilidad con código existente === */
  /* Anteriores tokens oscuros mapeados a esquema claro intranet */
  --bg:           var(--white);
  --negro:        var(--gray-50);
  --negro-s:      var(--white);
  --negro-c:      var(--white);
  --negro-b:      var(--gray-200);
  --text:         var(--gray-900);
  --muted:        var(--gray-500);

  /* Acento principal: el morado se vuelve VERDE intranet */
  --morado:       var(--green);
  --morado-dark:  var(--green-dark);

  /* Estados semánticos */
  --verde:        var(--green);
  --verde-l:      var(--green-light);
  --verde-m:      var(--green-border);
  --azul:         #0a66c2;
  --azul-l:       #e7f1fb;
  --dorado:       #d4a017;
  --dorado-l:     #fff7e0;
  --rojo:         #d63333;
  --rojo-l:       #fbeaea;
  --rojo-d:       #b02020;

  /* Niveles de criterio (Excelente / Aceptable / Deficiente / Crítico) */
  --exc:          var(--green);
  --ace:          #d4a017;
  --def:          #e07030;
  --cri:          var(--rojo);
}

/* */.view-editor

.view-editor body{font-family:Arial,sans-serif;font-size:14px;color:var(--text);background:var(--negro);line-height:1.5}

.view-editor .demo-toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--negro-s);border:1.5px solid var(--negro-b);border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}

/* LOGIN */

/* EDITOR LAYOUT */

.view-editor .btn-link{background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:Arial;text-decoration:underline;padding:0}

.view-editor .variant-pill{font-size:11px;padding:3px 10px;border-radius:14px;font-weight:600}

/* VALIDATOR */
.view-editor .validator{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:14px}
.view-editor .val-ok{background:var(--verde-l);border:1px solid var(--bd-exc);color:var(--verde)}
.view-editor .val-warn{background:var(--dorado-l);border:1px solid var(--bd-ace);color:var(--dorado)}

.view-editor .editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}

/* SECTIONS */
.view-editor .sec-card{background:var(--negro-s);border:1px solid var(--negro-b);border-radius:8px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}

.view-editor .sec-drag{color:var(--muted);font-size:16px;cursor:grab;flex-shrink:0;padding:0 2px}

.view-editor .sec-num{background:var(--verde);color:var(--negro);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.view-editor .sec-title{font-weight:700;color:white;flex:1;min-width:0}
.view-editor .sec-title input{background:transparent;border:none;color:white;font-weight:700;font-size:13px;width:100%;padding:2px 4px;border-radius:3px;font-family:Arial}
.view-editor .sec-title input:hover{background:rgba(255,255,255,.05)}
.view-editor .sec-title input:focus{outline:1px solid var(--verde);background:var(--negro)}
.view-editor .sec-peso{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.view-editor .sec-peso input{width:48px;font-size:12px;padding:4px 6px;text-align:center;border-radius:4px;border:1px solid var(--negro-b);background:var(--negro);color:var(--text);font-family:Arial}
.view-editor .sec-peso input:focus{outline:1.5px solid var(--verde);border-color:var(--verde)}
.view-editor .sec-chevron{color:var(--muted);font-size:14px;padding:0 4px}

.view-editor .icon-btn{background:transparent;border:1px solid var(--negro-b);border-radius:5px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--muted);font-family:Arial;transition:all .15s}
.view-editor .icon-btn:hover{background:var(--negro-h);color:var(--text);border-color:#444}
.view-editor .icon-btn.danger:hover{color:var(--rojo);border-color:var(--rojo)}
.view-editor .icon-btn.active{background:var(--verde);color:var(--negro);border-color:var(--verde);font-weight:700}
.view-editor .fatal-item{display:flex;align-items:flex-start;gap:10px;background:var(--rojo-l);border:1px solid var(--bd-cri);border-radius:7px;padding:10px 12px;margin-bottom:8px}
.view-editor .fatal-item input{background:var(--negro-c);border:1px solid var(--negro-b);color:var(--text);border-radius:5px;padding:6px 8px;font-size:12px;font-family:Arial;width:100%;margin-bottom:5px}

.view-editor .crit-puntos{width:56px;font-size:12px;padding:4px 6px;text-align:center;border-radius:4px;border:1px solid var(--negro-b);background:var(--negro);color:var(--verde);font-weight:700;font-family:Arial}

.view-editor .crit-actions{display:flex;gap:4px;flex-shrink:0}
.view-editor .levels-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}

.view-editor .lvl-def .lvl-text{color:#e6a674}
.view-editor .lvl-cri{background:var(--bg-cri);border-color:var(--bd-cri);color:var(--cri)}
.view-editor .lvl-cri .lvl-text{color:#e09090}
.view-editor .lvl textarea{width:100%;background:transparent;border:none;color:inherit;font-size:10px;line-height:1.4;font-family:Arial;resize:none;min-height:36px;padding:0}

.view-editor .btn-add{margin-top:8px;width:100%;padding:8px;font-size:12px;background:transparent;border:1px dashed var(--negro-b);border-radius:5px;color:var(--muted);cursor:pointer;font-family:Arial;transition:all .15s}

.view-editor .btn-add-section:hover{background:var(--negro-s);color:var(--verde);border-color:var(--verde)}

/* SIDE PANEL */

.view-editor .preview-sec{margin-bottom:14px;background:var(--negro-s);border:1px solid var(--negro-b);border-radius:6px;overflow:hidden}

.view-editor .preview-crit{padding:8px 0;border-top:1px solid var(--negro-b);font-size:11px}

.view-editor .preview-crit-name{font-weight:700;color:var(--verde);margin-bottom:4px}
.view-editor .preview-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}

.view-editor .toast{position:fixed;bottom:20px;right:20px;background:var(--verde);color:var(--negro);padding:12px 18px;border-radius:8px;font-weight:700;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;align-items:center;gap:10px;z-index:1100;font-family:Arial}

/* COMPARE MODAL */
.view-editor .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:11px}
.view-editor .compare-col-head{font-size:12px;font-weight:700;color:var(--verde);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--negro-b)}

  // Devuelve evaluación pre-generada según área/nivel. Para variedad
  // alterna entre casos buenos y deficientes basado en azar controlado.
  obtenerEvaluacionDemo(currentSecciones, area, nivel) {
    // Genera evaluaciones simuladas mapeando cada criterio a un nivel
    // basado en el "perfil" elegido aleatoriamente
    const r = Math.random();
    let perfil; // exc / mixto / def
    if (area === "credito") {
      perfil = r < 0.5 ? "exc" : (r < 0.8 ? "mixto" : "def");
    } else if (nivel === "m30" || nivel === "inbound") {
      perfil = r < 0.6 ? "exc" : "mixto";
    } else if (nivel === "m90") {
      perfil = r < 0.3 ? "exc" : (r < 0.7 ? "mixto" : "def");
    } else {
      perfil = r < 0.2 ? "mixto" : "def";
    }
    const evaluacion = {};
    let transcripcion;
    if (area === "credito") {
      transcripcion = perfil === "def" ? this.transcripciones.credito_deficiente : this.transcripciones.credito_buena;
    } else if (nivel === "m120" || nivel === "m150") {
      transcripcion = this.transcripciones.cobranza_m120_deficiente;
    } else if (nivel === "m90") {
      transcripcion = this.transcripciones.cobranza_m90_regular;
    } else {
      transcripcion = this.transcripciones.cobranza_m30_buena;
    }
    // Asignar nivel a cada criterio según perfil
    const distribucion = {
      exc: {exc: 0.7, ace: 0.25, def: 0.05, cri: 0},
      mixto: {exc: 0.35, ace: 0.4, def: 0.2, cri: 0.05},
      def: {exc: 0.05, ace: 0.2, def: 0.45, cri: 0.3}
    };
    const dist = distribucion[perfil];
    const razonesGenericas = {
      exc: [
        "Cumple con el script en este punto siguiendo las frases exactas requeridas.",
        "Ejecuta correctamente este criterio con el lenguaje y tono apropiados.",
        "Aplica el procedimiento del script sin omisiones notables.",
      ],
      ace: [
        "Cumple parcialmente: tiene el elemento principal pero le falta algún detalle del script.",
        "Realiza la acción pero sin la fluidez o precisión total que pide el script.",
        "Cubre el criterio aceptablemente, hay margen de mejora en los detalles.",
      ],
      def: [
        "Omite elementos importantes del script en este punto.",
        "Cumplimiento incompleto del criterio según los lineamientos oficiales.",
        "El asesor pasa rápidamente por este punto sin profundizar como pide el script.",
      ],
      cri: [
        "Omisión total de este criterio crítico del script.",
        "No se ejecuta el procedimiento requerido en este punto.",
        "Falta grave: este elemento del script no aparece en la llamada.",
      ]
    };
    currentSecciones.forEach(sec => {
      sec.criterios.forEach(c => {
        const rnd = Math.random();
        let nivelAsignado;
        if (rnd < dist.exc) nivelAsignado = "exc";
        else if (rnd < dist.exc + dist.ace) nivelAsignado = "ace";
        else if (rnd < dist.exc + dist.ace + dist.def) nivelAsignado = "def";
        else nivelAsignado = "cri";
        const razones = razonesGenericas[nivelAsignado];
        const razon = razones[Math.floor(Math.random() * razones.length)];
        evaluacion[c.id] = { nivel: nivelAsignado, razon: `[DEMO] ${razon}` };
      });
    });
    // Recomendación según perfil
    const recomendaciones = {
      exc: "Excelente desempeño. El asesor domina el script y mantiene un tono profesional sostenido durante toda la llamada. Punto destacable: cumplimiento sólido en los criterios clave del script. Como mejora menor, refinar los detalles en las secciones donde obtuvo Aceptable. Compromiso: ejercicios de role-play para llevar al 10/10 los puntos pendientes.",
      mixto: "Llamada con desempeño aceptable y áreas claras de mejora. Punto positivo: cumplimiento parcial del script en la mayoría de criterios. Áreas críticas: hay omisiones en pasos clave del script que deben atenderse. Compromiso: revisar el guion oficial sección por sección y practicar las frases exactas en role-play antes de la próxima jornada.",
      def: "Llamada con incumplimiento crítico del script. El asesor omitió pasos esenciales que ponen en riesgo la calidad y el cumplimiento normativo. Acción URGENTE: sesión de coaching antes de la próxima jornada con repaso completo del script y acompañamiento de las primeras 5-10 llamadas del próximo turno. Frase clave que debió aplicar: las definidas en cada criterio Crítico del reporte."
    };
    return {
      transcripcion: transcripcion,
      evaluacion: evaluacion,
      recomendaciones: recomendaciones[perfil]
    };
  }
};

// Toggle del modo demo desde el header
function toggleDemoMode() {
  DEMO_MODE = !DEMO_MODE;
  const toggle = document.getElementById("demo-toggle");
  const label = document.getElementById("demo-toggle-label");
  const banner = document.getElementById("demo-banner");
  const uploadH3 = document.getElementById("upload-h3");
  const uploadP = document.getElementById("upload-p");
  const demoZone = document.getElementById("demo-evaluar-zone");
  const uploadZone = document.getElementById("upload-zone");
  if (DEMO_MODE) {
    toggle.classList.add("active");
    label.textContent = "Modo Demo";
    banner.classList.add("active");
    if (uploadH3) uploadH3.textContent = "Modo Demo: simula evaluación de una llamada";
    if (uploadP) uploadP.textContent = "Sube cualquier audio (no será usado) o usa el botón naranja debajo para ver una demostración";
    if (demoZone) demoZone.style.display = "block";
  } else {
    toggle.classList.remove("active");
    label.textContent = "Modo Real";
    banner.classList.remove("active");
    if (uploadH3) uploadH3.textContent = "Arrastra el audio aquí o haz clic para seleccionar";
    if (uploadP) uploadP.textContent = "MP3, WAV, M4A — SONAR transcribirá y evaluará automáticamente según el script del área seleccionada";
    if (demoZone) demoZone.style.display = "none";
  }
}

// Simulación visual realista del progreso para el modo demo
async function simularProgresoDemo(setStepFn) {
  const pasos = [
    { paso: 1, pct: 15, ms: 600 },
    { paso: 2, pct: 35, ms: 1400 },
    { paso: 3, pct: 55, ms: 700 },
    { paso: 4, pct: 80, ms: 1500 },
    { paso: 5, pct: 95, ms: 800 },
  ];
  for (const p of pasos) {
    setStepFn(p.paso, p.pct);
    await new Promise(r => setTimeout(r, p.ms));
  }
}

// Carga la librería SheetJS si no está disponible
async function ensureSheetJS() {
  if (typeof XLSX !== 'undefined') return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar SheetJS'));
    document.head.appendChild(s);
  });
}

// Carga mammoth para leer .docx
async function ensureMammoth() {
  if (typeof mammoth !== 'undefined') return;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar Mammoth'));
    document.head.appendChild(s);
  });
}

function aplicarStaffAFormulario(staffData, filtroArea) {
  if (!staffData || !staffData.mapa) return;
  const selSup = document.getElementById("f-supervisor-select");
  const inpSup = document.getElementById("f-supervisor");
  const selAse = document.getElementById("f-asesor-select");
  const inpAse = document.getElementById("f-asesor");

  // Filtrar supervisores por área si se especifica
  const supervisores = Object.keys(staffData.mapa)
    .filter(sup => !filtroArea || staffData.mapa[sup].area === filtroArea)
    .sort();

  selSup.innerHTML = '<option value="">— Selecciona supervisor —</option>';
  supervisores.forEach(sup => {
    const opt = document.createElement("option");
    opt.value = sup;
    opt.textContent = sup;
    selSup.appendChild(opt);
  });
  // Mostrar el select, ocultar el input libre
  selSup.style.display = "block";
  inpSup.style.display = "none";
  inpSup.value = "";

  // El select de asesores se resetea al cambiar de área/supervisor
  selAse.innerHTML = '<option value="">— Selecciona supervisor primero —</option>';
  selAse.style.display = "block";
  inpAse.style.display = "none";
  inpAse.value = "";
}

async function cargarScriptDesdeArchivo(file) {
  if (!file) return;
  const status = document.getElementById("script-personalizado-status");
  status.textContent = "Procesando archivo...";
  status.style.color = "#A5B4FC";

  // Asegurar que un área esté seleccionada (para saber qué script reemplazar)
  if (!currentArea) {
    status.textContent = "⚠ Primero selecciona un área (Crédito o Cobranza+nivel)";
    status.style.color = "var(--dorado)";
    document.getElementById("script-file-input").value = "";
    return;
  }
  if (currentArea === "cobranza" && !currentNivel) {
    status.textContent = "⚠ Primero selecciona el nivel de cobranza (Premora, M30, etc.)";
    status.style.color = "var(--dorado)";
    document.getElementById("script-file-input").value = "";
    return;
  }

  try {
    const nombre = file.name.toLowerCase();
    let secciones = null;

    if (nombre.endsWith(".xlsx") || nombre.endsWith(".xls")) {
      // Excel: cada fila debe tener: Sección, Criterio, Excelente, Aceptable, Deficiente, Crítico (Peso opcional)
      await ensureSheetJS();
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type: 'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval: ""});
      secciones = parsearScriptDesdeExcel(rows);
    } else if (nombre.endsWith(".docx")) {
      await ensureMammoth();
      const arrBuf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: arrBuf});
      secciones = parsearScriptDesdeTexto(result.value);
    } else if (nombre.endsWith(".txt")) {
      const texto = await file.text();
      secciones = parsearScriptDesdeTexto(texto);
    } else {
      throw new Error("Formato no soportado. Usa .xlsx, .docx o .txt");
    }

    if (!secciones || !secciones.length) {
      throw new Error("No se detectaron secciones/criterios válidos en el archivo");
    }

    // Aplicar al script actual
    aplicarScriptPersonalizadoAlActual(secciones, file.name);
    status.textContent = `✓ Script aplicado: ${secciones.length} rubros, ${secciones.reduce((s,sec)=>s+sec.criterios.length,0)} criterios`;
    status.style.color = "var(--verde)";
  } catch(err) {
    console.error(err);
    status.textContent = "✕ Error: " + err.message;
    status.style.color = "var(--rojo)";
  }
  document.getElementById("script-file-input").value = "";
}

// Parser de Excel: detecta columnas Sección, Criterio, Excelente, Aceptable, Deficiente, Crítico
function parsearScriptDesdeExcel(rows) {
  if (!rows.length) return [];
  const cols = Object.keys(rows[0]);
  const colSec = cols.find(c => /secci[oó]n|rubro/i.test(c));
  const colCri = cols.find(c => /criterio|indicador/i.test(c));
  const colExc = cols.find(c => /excelente|excel/i.test(c));
  const colAce = cols.find(c => /aceptable/i.test(c));
  const colDef = cols.find(c => /deficiente|defic/i.test(c));
  const colCri2 = cols.find(c => /cr[ií]tico/i.test(c));
  const colPeso = cols.find(c => /peso|%/i.test(c));

  if (!colSec || !colCri) {
    // Formato no estricto: tomar las primeras dos columnas como Sección y Texto/descripción
    return parsearScriptDesdeExcelSimple(rows, cols);
  }

  const secMap = {};
  let idCount = 1;
  rows.forEach(r => {
    const secTitulo = String(r[colSec] || "").trim();
    const criNombre = String(r[colCri] || "").trim();
    if (!secTitulo || !criNombre) return;
    if (!secMap[secTitulo]) {
      secMap[secTitulo] = {
        titulo: secTitulo,
        peso: colPeso ? (parseInt(r[colPeso])||10) : 10,
        criterios: []
      };
    }
    secMap[secTitulo].criterios.push({
      id: "c" + (idCount++),
      n: criNombre,
      exc: String(r[colExc] || "Cumple óptimamente con el criterio").trim(),
      ace: String(r[colAce] || "Cumple parcialmente con margen de mejora").trim(),
      def: String(r[colDef] || "Cumple de forma incompleta").trim(),
      cri: String(r[colCri2] || "Omisión total del criterio").trim()
    });
  });
  return Object.values(secMap);
}

// Parser simple: dos columnas (Sección/Indicador en col1, descripción en col2)
// Útil para el formato del archivo SCRIPT_PREMORA.xlsx que envió Carlos
function parsearScriptDesdeExcelSimple(rows, cols) {
  const col1 = cols[0];
  const col2 = cols[1];
  const secciones = [];
  let secActual = null;
  let idCount = 1;

  // Helper: deriva un nombre corto desde el texto del descriptor (Excelente)
  // Toma las primeras palabras hasta el primer punto, máx 10 palabras / 75 chars
  function nombreDesdeTexto(txt) {
    if (!txt) return "";
    let s = String(txt).trim();
    // Cortar en el primer "." que no sea de "Sr." "Sra." etc.
    const m = s.match(/^([^.;]{15,75})/);
    if (m) s = m[1].trim();
    // Si quedó muy largo, cortar por palabra ~10
    const palabras = s.split(/\s+/);
    if (palabras.length > 12) s = palabras.slice(0, 10).join(" ") + "…";
    // Eliminar comillas iniciales/finales
    s = s.replace(/^["'«]+|["'»]+$/g, "").trim();
    return s;
  }

  rows.forEach(r => {
    const c1 = String(r[col1] || "").trim();
    const c2 = String(r[col2] || "").trim();
    if (!c1 && !c2) return;

    // Detectar si es un encabezado de sección (empieza con número + punto, o es solo c1 sin c2)
    const esEncabezado = /^\d+(\.\d+)?\.?\s+/.test(c1) || (c1 && !c2);

    if (esEncabezado) {
      const titulo = c1.replace(/^\d+(\.\d+)?\.?\s+/, "").trim() || c1;
      secActual = {titulo: titulo, peso: 15, criterios: []};
      secciones.push(secActual);
      // Si hay contenido en c2, agregarlo como primer criterio del rubro
      if (c2) {
        // Si el título del rubro es corto y descriptivo, úsalo; si no, deriva del texto
        const nombreCrit = titulo.length <= 50 ? titulo : nombreDesdeTexto(c2);
        secActual.criterios.push({
          id: "c" + (idCount++),
          n: nombreCrit || "Aplicación del paso",
          exc: c2,
          ace: "Aplica el paso parcialmente, omitiendo algún detalle",
          def: "Aplica el paso de forma incompleta o sin precisión",
          cri: "Omite por completo este paso del script"
        });
      }
    } else if (c2 && secActual) {
      // Contenido adicional para la sección actual:
      // - si c1 tiene texto útil, ese es el nombre
      // - si c1 está vacío, derivar del descriptor (c2) en vez de poner "Punto N"
      let nombre = c1.trim();
      if (!nombre) {
        nombre = nombreDesdeTexto(c2);
      }
      // Si todavía no hay nombre (texto muy corto), cae a un nombre derivado del rubro
      if (!nombre) {
        nombre = (secActual.titulo + " · paso " + (secActual.criterios.length + 1)).slice(0, 75);
      }
      secActual.criterios.push({
        id: "c" + (idCount++),
        n: nombre.length > 80 ? nombre.substring(0,77) + "…" : nombre,
        exc: c2,
        ace: "Aplica el paso parcialmente, omitiendo algún detalle",
        def: "Aplica el paso de forma incompleta o sin precisión",
        cri: "Omite por completo este paso del script"
      });
    } else if (c2 && !secActual) {
      secActual = {titulo: "General", peso: 100, criterios: []};
      secciones.push(secActual);
      secActual.criterios.push({
        id: "c" + (idCount++),
        n: c1 || nombreDesdeTexto(c2) || "Aplicación del script",
        exc: c2,
        ace: "Cumple parcialmente",
        def: "Cumple de forma incompleta",
        cri: "No aplica el criterio"
      });
    }
  });

  // Repartir el peso entre secciones uniformemente
  const total = secciones.length;
  if (total > 0) {
    const pesoBase = Math.floor(100 / total);
    secciones.forEach((s,i) => { s.peso = i === total-1 ? 100 - pesoBase*(total-1) : pesoBase; });
  }
  return secciones.filter(s => s.criterios.length > 0);
}

// Parser de Word/texto: usa headings numerados (1., 2., etc.) como secciones
function parsearScriptDesdeTexto(texto) {
  if (!texto) return [];
  const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  const secciones = [];
  let secActual = null;
  let idCount = 1;

  lineas.forEach(linea => {
    const matchSeccion = linea.match(/^(\d+)(\.\d+)?\.?\s+(.+)$/);
    if (matchSeccion) {
      const titulo = matchSeccion[3].trim();
      // Si es subsección (con .X), agregarla como criterio del actual
      if (matchSeccion[2] && secActual) {
        secActual.criterios.push({
          id: "c" + (idCount++),
          n: titulo.substring(0, 80),
          exc: titulo,
          ace: "Cumple parcialmente con este punto",
          def: "Cumple de forma incompleta",
          cri: "Omite este punto del script"
        });
      } else {
        secActual = {titulo: titulo, peso: 15, criterios: []};
        secciones.push(secActual);
      }
    } else if (secActual && linea.length > 10) {
      // Texto descriptivo del rubro actual → se vuelve un criterio
      secActual.criterios.push({
        id: "c" + (idCount++),
        n: linea.length > 60 ? linea.substring(0, 60) + "..." : linea,
        exc: linea,
        ace: "Cumple parcialmente con este punto",
        def: "Cumple de forma incompleta",
        cri: "Omite este punto del script"
      });
    }
  });

  // Repartir peso
  const total = secciones.length;
  if (total > 0) {
    const pesoBase = Math.floor(100 / total);
    secciones.forEach((s,i) => { s.peso = i === total-1 ? 100 - pesoBase*(total-1) : pesoBase; });
  }
  return secciones.filter(s => s.criterios.length > 0);
}

function aplicarScriptPersonalizadoAlActual(secciones, nombreArchivo) {
  // Sustituir el script en memoria
  if (currentArea === "credito") {
    SCRIPTS.credito.secciones = secciones;
    SCRIPTS.credito.label += " (personalizado)";
  } else if (currentArea === "ventas") {
    SCRIPTS.ventas.secciones = secciones;
    SCRIPTS.ventas.label += " (personalizado)";
  } else if (currentArea === "cobranza" && currentNivel) {
    SCRIPTS.cobranza[currentNivel].secciones = secciones;
    SCRIPTS.cobranza[currentNivel].label += " (personalizado)";
  }
  currentSecciones = secciones;

  // Guardar el script personalizado en localStorage
  const key = currentArea === "credito" ? "credito" : currentArea === "ventas" ? "ventas" : "cobranza_" + currentNivel;
  const personalizados = getScriptPersonalizado() || {};
  personalizados[key] = {
    nombre_archivo: nombreArchivo,
    cargado_en: new Date().toISOString(),
    secciones: secciones
  };
  localStorage.setItem(SCRIPT_PERSONALIZADO_KEY, JSON.stringify(personalizados));

  // Limpiar evaluación previa y reconstruir UI
  Object.keys(evaluacion).forEach(k => delete evaluacion[k]);
  buildUI();
  if (typeof updateResultado === "function") {
    document.getElementById("resultado-panel").style.display = "none";
  }
}

  const staff = getStaff();
  if (staff) {
    aplicarStaffAFormulario(staff);

    if (status) {
      if (staff.embebido) {

      } else {

        const fecha = staff.cargado_en ? new Date(staff.cargado_en).toLocaleDateString("es-MX") : "—";
        status.innerHTML = `<span style="color:var(--green-dark)">✓ Staff cargado</span> (${staff.total_supervisores} sup., ${staff.total_asesores} asesores) · ${fecha}`;
      }
    }
  }
  const personalizados = getScriptPersonalizado();
  if (personalizados) {
    // Aplicar todos los scripts personalizados guardados (secciones +,
    // si el Editor los definió, modo de puntaje y errores fatales)
    Object.entries(personalizados).forEach(([key, data]) => {
      let target = null;
      if (key === "credito") target = SCRIPTS.credito;
      else if (key === "ventas") target = SCRIPTS.ventas;
      else if (key.startsWith("cobranza_")) {
        const nivel = key.replace("cobranza_", "");
        if (SCRIPTS.cobranza[nivel]) target = SCRIPTS.cobranza[nivel];
      }
      if (!target) return;
      target.secciones = data.secciones;
      if (data.modo_puntaje) target.modo_puntaje = data.modo_puntaje;
      if (data.errores_fatales) target.errores_fatales = data.errores_fatales;
    });
    const status = document.getElementById("script-personalizado-status");
    if (status) {
      const cuenta = Object.keys(personalizados).length;
      status.textContent = `✓ ${cuenta} script(s) personalizado(s) activo(s)`;
      status.style.color = "var(--green-dark)";
    }
  }
}

function aaiEstaConfigurado() {
  // Verifica que la key no esté vacía, no sea el placeholder, y tenga formato razonable
  if (!ASSEMBLYAI_API_KEY) return false;
  const k = ASSEMBLYAI_API_KEY.trim();
  if (!k) return false;
  if (k === _PH_ASSEMBLYAI) return false;
  if (k.length < 20) return false;  // las keys reales tienen 32+ caracteres
  return true;
}

function anthropicEstaConfigurado() {
  const c = (API_KEYS.cobranza || "").trim();
  const cr = (API_KEYS.credito || "").trim();
  return (c && c !== _PH_ANTHROPIC && c.length >= 20) || (cr && cr !== _PH_ANTHROPIC && cr.length >= 20);
}

function handleAudioFile(file) {
  if (!file) return;
  // Validar que sea audio
  const tiposValidos = ['audio/', '.mp3', '.wav', '.m4a', '.mp4', '.ogg', '.webm', '.flac'];
  const nombre = file.name.toLowerCase();
  const esValido = file.type.startsWith('audio/') || tiposValidos.some(t => nombre.endsWith(t));
  if (!esValido) {
    showError('Archivo no válido. Sube un audio MP3, WAV, M4A, MP4, OGG, FLAC o WebM.');
    return;
  }
  // Validar tamaño (límite recomendado: 100 MB)
  const MAX_SIZE = 100 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    showError(`Archivo demasiado grande (${(file.size/1024/1024).toFixed(1)} MB). Máximo recomendado: 100 MB.`);
    return;
  }
  audioFileReal = file;
  document.getElementById('audio-upload-zone').style.display = 'none';
  const sel = document.getElementById('audio-selected');
  sel.style.display = 'flex';
  document.getElementById('audio-file-name').textContent = file.name;
  document.getElementById('audio-file-size').textContent = (file.size/1024/1024).toFixed(2) + ' MB · ' + (file.type || 'audio');
}

function handleAudioDrop(e) {
  e.preventDefault();
  document.getElementById('audio-upload-zone').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) handleAudioFile(f);
}

// Función principal: transcribe audio con AssemblyAI y luego evalúa con Anthropic
async function evaluarConAudio() {
  if (!audioFileReal) {
    showError('Selecciona un audio primero.');
    return;
  }
  if (!aaiEstaConfigurado()) {
    showError('La API Key de AssemblyAI no está configurada. Pega tu clave en ASSEMBLYAI_API_KEY al inicio del archivo HTML.');
    return;
  }
  if (!currentArea) {
    showError('Selecciona el área (Crédito o Cobranza) antes de procesar.');
    return;
  }
  if (currentArea === 'cobranza' && !currentNivel) {
    showError('Selecciona el nivel de cobranza (Inbound/M30/M90/M120/M150).');
    return;
  }

  document.getElementById('error-box').style.display = 'none';
  document.getElementById('btn-evaluar-audio').disabled = true;
  document.getElementById('aai-progress').style.display = 'block';

  try {
    // PASO 1: Subir audio a AssemblyAI
    setAaiStep('📤 Subiendo audio a AssemblyAI...', 'Transferencia en progreso', 15);
    const uploadResp = await fetch('https://api.assemblyai.com/v2/upload', {
      method: 'POST',
      headers: {
        'authorization': ASSEMBLYAI_API_KEY,
        'content-type': 'application/octet-stream'
      },
      body: audioFileReal
    });
    if (!uploadResp.ok) {
      const errText = await uploadResp.text();
      throw new Error(`Error al subir audio (${uploadResp.status}): ${errText}`);
    }
    const uploadData = await uploadResp.json();
    const audioUrl = uploadData.upload_url;
    if (!audioUrl) throw new Error('AssemblyAI no devolvió URL de audio');

    // PASO 2: Solicitar transcripción con diarización
    setAaiStep('🤖 AssemblyAI transcribiendo...', 'Identificando hablantes (ASESOR/CLIENTE)', 35);
    const submitResp = await fetch('https://api.assemblyai.com/v2/transcript', {
      method: 'POST',
      headers: {
        'authorization': ASSEMBLYAI_API_KEY,
        'content-type': 'application/json'
      },
      body: JSON.stringify({
        audio_url: audioUrl,
        speech_models: ['universal-3-pro', 'universal-2'],
        language_code: 'es',
        speaker_labels: true,   // identifica hablantes
        punctuate: true,
        format_text: true
      })
    });
    if (!submitResp.ok) {
      const errText = await submitResp.text();
      throw new Error(`Error al solicitar transcripción (${submitResp.status}): ${errText}`);
    }
    const submitData = await submitResp.json();
    const transcriptId = submitData.id;
    if (!transcriptId) throw new Error('AssemblyAI no devolvió ID de transcripción');

    // PASO 3: Hacer polling cada 3 segundos hasta que esté lista
    let intentos = 0;
    const maxIntentos = 120; // 6 minutos máximo
    let transcriptData = null;
    while (intentos < maxIntentos) {
      await new Promise(r => setTimeout(r, 3000));
      intentos++;
      const progresoUI = 35 + Math.min(50, intentos * 2);
      setAaiStep(
        '🤖 AssemblyAI transcribiendo...',
        `Procesando audio (${intentos * 3}s transcurridos)`,
        progresoUI
      );
      const pollResp = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}`, {
        headers: { 'authorization': ASSEMBLYAI_API_KEY }
      });
      if (!pollResp.ok) {
        const errText = await pollResp.text();
        throw new Error(`Error al consultar transcripción: ${errText}`);
      }
      transcriptData = await pollResp.json();
      if (transcriptData.status === 'completed') break;
      if (transcriptData.status === 'error') {
        throw new Error('AssemblyAI reportó error: ' + (transcriptData.error || 'desconocido'));
      }
    }
    if (!transcriptData || transcriptData.status !== 'completed') {
      throw new Error('La transcripción excedió el tiempo máximo de espera (6 min)');
    }

    // PASO 4: Construir texto con diarización ASESOR/CLIENTE
    setAaiStep('✓ Transcripción lista', 'Preparando evaluación con Claude...', 90);
    let transcripcionTexto = '';
    if (transcriptData.utterances && transcriptData.utterances.length > 0) {
      // Inferir cuál speaker es ASESOR vs CLIENTE
      // Heurística: el ASESOR generalmente habla primero, se identifica y menciona "MultiMoney"
      const speakers = {};
      transcriptData.utterances.forEach(u => {
        if (!speakers[u.speaker]) speakers[u.speaker] = [];
        speakers[u.speaker].push(u.text);
      });
      const speakerIds = Object.keys(speakers);
      let asesorSpeaker = speakerIds[0]; // por defecto el primero
      // Heurística: quien menciona "MultiMoney" o "Multi Money" probablemente es el asesor
      for (const sid of speakerIds) {
        const textoCompleto = speakers[sid].join(' ').toLowerCase();
        if (textoCompleto.includes('multimoney') || textoCompleto.includes('multi money') ||
            textoCompleto.includes('le saluda') || textoCompleto.includes('le habla')) {
          asesorSpeaker = sid;
          break;
        }
      }
      // Construir texto etiquetado
      transcripcionTexto = transcriptData.utterances.map(u => {
        const etiqueta = u.speaker === asesorSpeaker ? 'ASESOR' : 'CLIENTE';
        return `${etiqueta}: ${u.text}`;
      }).join('\n');
    } else {
      // Sin diarización, usar texto plano
      transcripcionTexto = transcriptData.text || '';
    }

    setAaiStep('✓ Listo, evaluando con Claude...', 'Análisis con IA en curso', 100);

    // PASO 5: Llenar el textarea de transcripción y disparar evaluación con Anthropic
    textoTranscripcion = transcripcionTexto;
    const tArea = document.getElementById('texto-transcripcion');
    if (tArea) tArea.value = transcripcionTexto;

    // Cambiar a la pestaña de pegar para mostrar la transcripción al usuario
    cambiarTab('pegar');
    actualizarContador();

    // Ocultar progreso de AAI
    document.getElementById('aai-progress').style.display = 'none';
    document.getElementById('btn-evaluar-audio').disabled = false;

    // Ahora ejecutar la evaluación con Anthropic (lógica que ya existe)
    await evaluarConIA();

  } catch (err) {
    showError('Error procesando audio: ' + err.message);
    document.getElementById('aai-progress').style.display = 'none';
    document.getElementById('btn-evaluar-audio').disabled = false;
  }
}

// Lee archivo .txt o .docx y devuelve el texto plano
async function leerArchivoTranscripcion(file) {
  if (!file) return "";
  const nombre = file.name.toLowerCase();
  if (nombre.endsWith(".txt")) {
    return await file.text();
  } else if (nombre.endsWith(".docx")) {
    // Leer .docx extrayendo el XML interno
    try {
      const arrayBuffer = await file.arrayBuffer();
      // Cargar mammoth.js dinámicamente si no está cargado
      if (typeof mammoth === "undefined") {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
          script.onload = resolve;
          script.onerror = () => reject(new Error("No se pudo cargar el lector de Word. Revisa tu conexión a internet."));
          document.head.appendChild(script);
        });
      }
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      return result.value;
    } catch (e) {
      throw new Error("No se pudo leer el archivo Word: " + e.message + ". Intenta copiar y pegar el texto directamente.");
    }
  } else {
    throw new Error("Formato no soportado. Usa .txt o .docx.");
  }
}

// ─── AREA / NIVEL SELECTION ───
function getAreaData(){
  if (currentArea === "credito") return SCRIPTS.credito;
  if (currentArea === "ventas") return SCRIPTS.ventas;
  if (currentArea === "cobranza" && currentNivel) return SCRIPTS.cobranza[currentNivel];
  return null;
}

function selectArea(area){
  currentArea=area;
  currentNivel=(area==="credito"||area==="ventas")?area:null;
  document.querySelectorAll(".area-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-area-"+area).classList.add("active");
  const ns=document.getElementById("nivel-selector");
  ns.style.display=area==="cobranza"?"block":"none";
  Object.keys(erroresFatalesMarcados).forEach(k=>delete erroresFatalesMarcados[k]);
  // Filtrar supervisores/asesores según el área seleccionada
  aplicarStaffAFormulario(getStaff(), area);
  if(area==="credito"){
    currentSecciones=SCRIPTS.credito.secciones;
    showScriptInfo("credito");
    buildUI();
  } else if(area==="ventas"){
    currentSecciones=SCRIPTS.ventas.secciones;
    showScriptInfo("ventas");
    buildUI();
  } else {
    currentSecciones=[];
    document.getElementById("script-info").style.display="none";
    document.getElementById("secciones").innerHTML="";
    document.getElementById("resultado-panel").style.display="none";
  }
}

function selectNivel(nivel){
  currentNivel=nivel;
  document.querySelectorAll(".nivel-area-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-n-"+nivel).classList.add("active");
  currentSecciones=SCRIPTS.cobranza[nivel].secciones;
  showScriptInfo(nivel);
  Object.keys(evaluacion).forEach(k=>delete evaluacion[k]);
  buildUI();
}

function showScriptInfo(key){
  const el=document.getElementById("script-info");
  el.innerHTML=SCRIPT_INFOS[key]||"";
  el.style.display="block";
  // Show API key status for the active area
  const area = key === "credito" ? "credito" : (key === "ventas" ? "ventas" : "cobranza");
  const apiKeyLookup = area === "ventas" ? API_KEYS.cobranza : API_KEYS[area];
  const configured = apiKeyLookup && apiKeyLookup !== _PH_ANTHROPIC;
  const areaLabel = area==="credito"?"Crédito":(area==="ventas"?"Ventas":"Cobranza");
  const ks = document.getElementById("key-status");
  const kd = document.getElementById("key-dot");
  const kl = document.getElementById("key-label");
  ks.style.display = "flex";
  if(configured){
    kd.className="key-ok-dot"; kd.style.background="var(--verde)";
    kl.className="key-ok";
    kl.textContent = "API Key " + areaLabel + " configurada · sk-ant-..." + apiKeyLookup.slice(-6);
  } else {
    kd.className="key-err-dot"; kd.style.background="#E05050";
    kl.className="key-err";
    kl.textContent = "⚠ API Key " + areaLabel + " no configurada — edita el archivo HTML";
  }

  // ★ NUEVO: badge del script oficial asociado a la cédula seleccionada
  try {
    var cedulaId = key === "credito" ? "credito"
                 : key === "ventas"  ? "ventas"
                 : "cobranza_" + key; // key ya es el nivel (inbound, m30, ...)
    var badgeHost = document.getElementById("script-oficial-badge");
    if (!badgeHost) {
      badgeHost = document.createElement("div");
      badgeHost.id = "script-oficial-badge";
      badgeHost.style.cssText = "margin-top:10px;padding:10px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:10px;line-height:1.4";
      el.parentNode.insertBefore(badgeHost, el.nextSibling);
    }
    var v = (window.SonarScripts && window.SonarScripts.getActivo) ? window.SonarScripts.getActivo(cedulaId) : null;
    if (v) {
      badgeHost.style.background = "var(--green-light)";
      badgeHost.style.border = "1px solid var(--green-border)";
      badgeHost.style.color = "var(--gray-900)";
      badgeHost.innerHTML =
        '<span style="font-size:15px">📄</span>' +
        '<div style="flex:1"><strong style="color:var(--green-dark)">Script asociado:</strong> ' +
          escapeAttr(v.nombre || "Script") + ' <span style="font-family:JetBrains Mono,monospace;background:var(--white);border:1px solid var(--green-border);padding:1px 6px;border-radius:3px;font-size:11px">v' + v.v + '</span>' +
          '<div style="font-size:11px;color:var(--gray-500);margin-top:2px">SONAR lo usará como contexto de referencia · <a href="#" onclick="Sonar.switchView(\'scripts\');return false;" style="color:var(--green-dark);text-decoration:underline">Editar</a></div>' +
        '</div>';
    } else {
      badgeHost.style.background = "var(--dorado-l)";
      badgeHost.style.border = "1px solid #f5e2a1";
      badgeHost.style.color = "#8a6a10";
      badgeHost.innerHTML =
        '<span style="font-size:15px">⚠️</span>' +
        '<div style="flex:1"><strong>Sin script oficial configurado para esta cédula.</strong> Puedes evaluar igual (opcional), pero si quieres que SONAR revise apego a guion, ' +
          '<a href="#" onclick="Sonar.switchView(\'scripts\');return false;" style="color:#8a6a10;text-decoration:underline;font-weight:600">configura uno en Editor de Scripts</a>.</div>';
    }
  } catch(e) { /* silencioso — no romper el flujo de evaluación por el badge */ }
}

// Helper para escapar HTML en atributos
function escapeAttr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ════════════════════════════════════════════════
// EDITOR DE RUBRO COMPLETO (integrado al evaluador)
// Permite que el área de calidad defina los criterios sobre los que la IA evaluará

function abrirEditorRubro(si) {

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">

          <input type="text" class="er-crit-nombre" value="${escapeAttr(c.n)}" placeholder="Nombre del criterio" style="width:100%;padding:8px 10px;font-size:13px;font-weight:600">
        </div>
        <button onclick="eliminarCriterioEditor(${si},${ci})" title="Eliminar criterio" style="background:var(--white);color:var(--rojo);border:1px solid var(--rojo);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;flex-shrink:0">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="display:block;font-size:10px;color:var(--green-dark);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:3px">★ Excelente (10 pts)</label>
          <textarea class="er-crit-exc" rows="2" style="width:100%;padding:7px 9px;font-size:12px;resize:vertical">${escapeAttr(c.exc)}</textarea>
        </div>
        <div>
          <label style="display:block;font-size:10px;color:var(--dorado);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:3px">◆ Aceptable (7 pts)</label>
          <textarea class="er-crit-ace" rows="2" style="width:100%;padding:7px 9px;font-size:12px;resize:vertical">${escapeAttr(c.ace)}</textarea>
        </div>
        <div>
          <label style="display:block;font-size:10px;color:#e07030;text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:3px">▼ Deficiente (4 pts)</label>
          <textarea class="er-crit-def" rows="2" style="width:100%;padding:7px 9px;font-size:12px;resize:vertical">${escapeAttr(c.def)}</textarea>
        </div>
        <div>
          <label style="display:block;font-size:10px;color:var(--rojo);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:3px">✕ Crítico (1 pt)</label>
          <textarea class="er-crit-cri" rows="2" style="width:100%;padding:7px 9px;font-size:12px;resize:vertical">${escapeAttr(c.cri)}</textarea>
        </div>
      </div>

  `).join("");

  overlay.innerHTML = `
    <div style="background:var(--white);border-radius:12px;max-width:1000px;width:100%;margin:auto;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden">
      <div style="background:var(--green);color:var(--black);padding:16px 22px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:16px;font-weight:800">✎ Editor del rubro #${si+1}</div>
          <div style="font-size:11px;font-weight:600;opacity:.85;margin-top:2px">El área de calidad define los criterios — la IA evaluará con base en estas reglas</div>
        </div>
        <button onclick="cerrarEditorRubro()" style="background:rgba(0,0,0,.15);color:var(--black);border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;font-weight:700">✕</button>
      </div>

      <div style="padding:20px 22px;max-height:calc(95vh - 160px);overflow-y:auto">
        <!-- TÍTULO Y PESO DEL RUBRO -->
        <div style="display:grid;grid-template-columns:1fr 120px;gap:12px;margin-bottom:18px">
          <div>
            <label style="display:block;font-size:11px;color:var(--gray-700);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:5px">Título del rubro</label>

}

function cerrarEditorRubro() {
  const overlay = document.getElementById('editor-rubro-overlay');
  if (overlay) overlay.remove();
  document.body.style.overflow = '';
}

function agregarCriterioEditor(si) {
  const sec = currentSecciones[si];
  if (!sec) return;
  // Primero guarda lo que ya está editado para no perderlo
  capturarCriteriosDelEditor(si);
  // Agregar criterio en blanco
  const nuevoId = 'c' + Date.now();
  sec.criterios.push({
    id: nuevoId,
    n: 'Nuevo criterio',
    exc: 'Describe qué hace el asesor para considerar excelente este criterio',
    ace: 'Describe el cumplimiento parcial pero aceptable',
    def: 'Describe el cumplimiento deficiente',
    cri: 'Describe la omisión total o crítica'
  });
  // Re-abrir el editor con el nuevo criterio
  abrirEditorRubro(si);
}

function eliminarCriterioEditor(si, ci) {
  const sec = currentSecciones[si];
  if (!sec) return;
  if (!confirm('¿Eliminar este criterio del rubro?')) return;
  // Capturar cambios existentes antes de eliminar
  capturarCriteriosDelEditor(si);
  sec.criterios.splice(ci, 1);
  abrirEditorRubro(si);
}

// Lee los inputs del editor y los aplica al modelo en memoria (sin persistir)
function capturarCriteriosDelEditor(si) {
  const sec = currentSecciones[si];
  if (!sec) return;
  const filas = document.querySelectorAll('#er-criterios-lista .editor-criterio');
  filas.forEach((row, ci) => {
    const c = sec.criterios[ci];
    if (!c) return;
    const get = (cls) => (row.querySelector('.' + cls)?.value || '').trim();
    c.n   = get('er-crit-nombre') || c.n;
    c.exc = get('er-crit-exc')    || c.exc;
    c.ace = get('er-crit-ace')    || c.ace;
    c.def = get('er-crit-def')    || c.def;
    c.cri = get('er-crit-cri')    || c.cri;
  });
}

function guardarEditorRubro(si) {
  const sec = currentSecciones[si];
  if (!sec) return;

  const tituloEl = document.getElementById('er-titulo');
  const pesoEl   = document.getElementById('er-peso');
  const critSupEl= document.getElementById('er-criterios-sup');

  const titulo = (tituloEl?.value || '').trim();
  const peso   = parseInt(pesoEl?.value) || 0;
  const critSup= (critSupEl?.value || '').trim();

  if (!titulo) { alert('El título del rubro no puede estar vacío.'); return; }
  if (peso < 0 || peso > 100) { alert('El peso debe estar entre 0 y 100.'); return; }

  sec.titulo = titulo;
  sec.peso = peso;
  sec.criterios_supervisor = critSup;

  // Capturar todos los criterios actuales del editor
  capturarCriteriosDelEditor(si);

  // Persistir el script personalizado (igual mecanismo que el carga-script)
  persistirScriptActualPersonalizado();

  cerrarEditorRubro();
  // Limpiar evaluación previa porque los criterios pudieron cambiar de ID/orden
  Object.keys(evaluacion).forEach(k => delete evaluacion[k]);
  buildUI();
  // Ocultar panel de resultado si estaba mostrado
  const rp = document.getElementById('resultado-panel');
  if (rp) rp.style.display = 'none';

  // Toast pequeño
  alert('✓ Rubro guardado. La IA evaluará usando estos criterios actualizados.');
}

// Persiste el script ACTUAL (lo que esté en currentSecciones) para el área+nivel seleccionado
function persistirScriptActualPersonalizado() {
  if (!currentArea) return;
  const key = currentArea === 'credito' ? 'credito' : currentArea === 'ventas' ? 'ventas' : 'cobranza_' + currentNivel;
  if (currentArea === 'cobranza' && !currentNivel) return;

  // Reemplazar el script en SCRIPTS también
  if (currentArea === 'credito') {
    SCRIPTS.credito.secciones = currentSecciones;
  } else if (currentArea === 'ventas') {
    SCRIPTS.ventas.secciones = currentSecciones;
  } else if (currentArea === 'cobranza' && currentNivel) {
    SCRIPTS.cobranza[currentNivel].secciones = currentSecciones;
  }

  const personalizados = getScriptPersonalizado() || {};
  personalizados[key] = {
    nombre_archivo: personalizados[key]?.nombre_archivo || 'edición manual',
    cargado_en: new Date().toISOString(),
    secciones: currentSecciones
  };
  localStorage.setItem(SCRIPT_PERSONALIZADO_KEY, JSON.stringify(personalizados));

  // Actualizar status visual
  const status = document.getElementById('script-personalizado-status');
  if (status) {
    const cuenta = Object.keys(personalizados).length;
    status.textContent = `✓ ${cuenta} script(s) personalizado(s) activo(s) · última edición ahora`;
    status.style.color = 'var(--green-dark)';
  }
}

function toggleSec(si){
  const b=document.getElementById("sec-body-"+si);
  b.style.display=b.style.display==="none"?"block":"none";
}

function pick(id,nivel,si){
  ["exc","ace","def","cri"].forEach(n=>{
    const btn=document.getElementById(`btn-${id}-${n}`);
    if(btn)btn.className="nivel-btn"+(n===nivel?` sel-${n}`:"");
  });
  evaluacion[id]=nivel;
  updateSecBadge(si);
  updateResultado();
}

function secScore(sec){
  const esPuntosDirectos = sec.criterios.length && sec.criterios[0].puntosMax !== undefined;
  if (esPuntosDirectos) {
    // Modo Ventas: cada criterio pesa su propio puntosMax (no todos parejo).
    // El nivel elegido (exc/ace/def/cri) determina qué fracción de esos puntos se obtiene.
    let obtenidos = 0, maxPosibles = 0, algunoEvaluado = false;
    sec.criterios.forEach(c => {
      maxPosibles += c.puntosMax;
      if (evaluacion[c.id] != null) {
        algunoEvaluado = true;
        obtenidos += (SCORES[evaluacion[c.id]] / 10) * c.puntosMax;
      }
    });
    if (!algunoEvaluado || maxPosibles === 0) return null;
    // Se normaliza a escala 0-10 para que el resto de SONAR (badges, Dashboard,
    // Batch) siga funcionando exactamente igual sin distinguir el modo de puntaje.
    return Math.round((obtenidos / maxPosibles) * 100) / 10;
  }
  const vals=sec.criterios.map(c=>evaluacion[c.id]!=null?SCORES[evaluacion[c.id]]:null).filter(v=>v!==null);
  if(!vals.length)return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10;
}

function updateSecBadge(si){
  const sec=currentSecciones[si];if(!sec)return;
  const s=secScore(sec);
  const badge=document.getElementById("sec-badge-"+si);if(!badge)return;
  badge.textContent=s!==null?s.toFixed(1)+"/10":"—";
  badge.style.background=s===null?"var(--negro-b)":s>=8?"rgba(0,193,112,.25)":s>=6?"rgba(212,160,23,.25)":"rgba(224,80,80,.25)";
  badge.style.color=s===null?"var(--muted)":s>=8?"var(--verde)":s>=6?"#D4A017":"#E05050";
}

function calcTotal(){
  // Errores fatales: si se marcó cualquiera, el total es 0 sin excepción,
  // sin importar qué tan bien haya salido el resto de la evaluación.
  if (Object.keys(erroresFatalesMarcados).some(k => erroresFatalesMarcados[k])) return 0;

  const areaData = getAreaData();
  if (areaData && areaData.modo_puntaje === "puntos_directos") {
    // Modo Ventas: suma directa de puntos obtenidos sobre el total de 100,
    // sin pasar por un promedio-de-promedios (evita distorsionar los pesos reales).
    let obtenidos = 0, maxPosibles = 0, algunoEvaluado = false;
    currentSecciones.forEach(sec => sec.criterios.forEach(c => {
      maxPosibles += c.puntosMax;
      if (evaluacion[c.id] != null) {
        algunoEvaluado = true;
        obtenidos += (SCORES[evaluacion[c.id]] / 10) * c.puntosMax;
      }
    }));
    if (!algunoEvaluado || maxPosibles === 0) return null;
    return Math.round((obtenidos / maxPosibles) * 100) / 10;
  }

  let sum=0,peso=0;
  currentSecciones.forEach(sec=>{const s=secScore(sec);if(s!==null){sum+=s*sec.peso;peso+=sec.peso;}});
  return peso===0?null:Math.round(sum/peso*10)/10;
}

function updateResultado(){
  const total=calcTotal();
  if(total===null||total===undefined)return;
  const hayErrorFatal = Object.keys(erroresFatalesMarcados).some(k => erroresFatalesMarcados[k]);
  document.getElementById("resultado-panel").style.display="block";
  // Mostrar también el panel de comentarios del Supervisor de Calidad
  const sup = document.getElementById("supervisor-calidad-panel");
  if (sup) sup.style.display = "block";
  let bg,color,border,nivel,desc,action;
  if(hayErrorFatal){
    bg="#2A0000";color="#FF5050";border="#FF2020";nivel="🚫 ERROR FATAL";
    desc="Se marcó al menos un error fatal — el puntaje se anula automáticamente";
    action="Acción: Escalar de inmediato, no aplica coaching estándar";
  }
  else if(total>=9){bg="#0A1A0A";color="var(--verde)";border="var(--verde)";nivel="★ EXCELENTE";desc="Dominio total del script";action="Acción: Reconocimiento y coaching de pares";}
  else if(total>=7.5){bg="#1A1500";color="#D4A017";border="#D4A017";nivel="◆ ACEPTABLE";desc="Cumple estándares con áreas de mejora";action="Acción: Coaching preventivo";}
  else if(total>=6){bg="#1A0A00";color="#E07030";border="#C05000";nivel="▼ DEFICIENTE";desc="Desviaciones frecuentes del script";action="Acción: Plan de mejora — sesión en 5 días";}
  else{bg="#1A0000";color="#E05050";border="#B02020";nivel="✕ CRÍTICO";desc="Omisiones de cumplimiento o script incompleto";action="Acción: Acompañamiento inmediato en llamadas";}
  const banner=document.getElementById("res-banner");
  banner.style.background=bg;banner.style.borderColor=border;
  banner.innerHTML=`<div><div class="res-label" style="color:${color}">${nivel}</div><div class="res-desc" style="color:${color}">${desc}</div><div class="res-action" style="color:${color}">${action}</div></div><div class="res-big" style="color:${color}">${total.toFixed(1)}<span style="font-size:18px">/10</span></div>`;
  document.getElementById("scores-mini").innerHTML=currentSecciones.map((sec,si)=>{
    const s=secScore(sec);
    const c=s===null?"#555":s>=8?"var(--verde)":s>=6?"#D4A017":"#E05050";
    return`<div class="score-mini-card"><div class="score-mini-num" style="color:${c}">${s!==null?s.toFixed(1):"—"}</div><div class="score-mini-lbl">${sec.titulo}</div><div class="mini-bar"><div class="mini-bar-fill" style="width:${s!==null?s*10:0}%;background:${c}"></div></div></div>`;
  }).join("");
}

function toggleErrorFatal(efId){
  erroresFatalesMarcados[efId] = !erroresFatalesMarcados[efId];
  const btn = document.getElementById("ef-btn-" + efId);
  if (btn) {
    if (erroresFatalesMarcados[efId]) {
      btn.textContent = "🚫 SÍ ocurrió";
      btn.style.background = "#d63333";
      btn.style.color = "white";
    } else {
      btn.textContent = "No ocurrió";
      btn.style.background = "white";
      btn.style.color = "#b02020";
    }
  }
  updateResultado();
}

// ─── FILE HANDLING ───
function handleFile(f){
  if(!f)return;
  const nombre = f.name.toLowerCase();
  const esValido = nombre.endsWith(".txt") || nombre.endsWith(".docx") || nombre.endsWith(".doc");
  if (!esValido) {
    showError("Formato no soportado. Sube un archivo .txt o .docx con la transcripción.");
    return;
  }
  audioFile=f;
  document.getElementById("upload-zone").style.display="none";
  document.getElementById("file-selected").style.display="flex";
  document.getElementById("file-name-display").textContent=f.name;
  document.getElementById("file-size-display").textContent=(f.size/1024).toFixed(1)+" KB";
}
function handleDrop(e){
  e.preventDefault();
  document.getElementById("upload-zone").classList.remove("drag");
  const f=e.dataTransfer.files[0];
  if (f) handleFile(f);
}
function cambiarAudio(){
  audioFile=null;
  document.getElementById("upload-zone").style.display="block";
  document.getElementById("file-selected").style.display="none";
  document.getElementById("audio-input").value="";
}

// ─── STEPS ───
function setStep(n,pct){
  for(let i=1;i<=5;i++){
    const li=document.getElementById("step-"+i),dot=document.getElementById("dot-"+i);
    li.className="";dot.className="step-dot";dot.textContent="";
    if(i<n){li.className="done";dot.className="step-dot done";dot.textContent="✓";}
    else if(i===n){li.className="active";dot.className="step-dot active";}
  }
  document.getElementById("prog-fill").style.width=pct+"%";
}

function showError(msg){
  document.getElementById("error-box").style.display="block";
  document.getElementById("error-box").textContent="Error: "+msg;
  document.getElementById("ai-progress").style.display="none";
  document.getElementById("btn-evaluar").disabled=false;
}

async function evaluarConIA(){

  // ───── RAMA MODO DEMO ─────
